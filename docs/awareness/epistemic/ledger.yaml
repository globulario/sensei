# Epistemic lane — uncertain design belief (globulario/sensei#288).
#
# NOT canonical knowledge. Nothing here is an invariant, a contract or a
# decision, nothing here is compiled into the awareness seed, and no routing
# surface reads it. A DesignQuestion records what must be resolved; a
# Hypothesis records what is believed and what would refute it; an
# Observation records what actually happened.
#
# Dispositions are COMPUTED (`sensei epistemic status`), never authored, and
# nothing here is established architecture until an `adoptions` entry says so.
# Write with `sensei epistemic declare|hypothesize|observe|adopt`, which validate.
version: 1
design_questions:
    - id: dq.abandon_ceiling_intermittency
      objective: Explain the intermittent build-and-test failure on main at 1a9efc93 (globulario/sensei#289)
      question: Is the intermittent abandonment failure environmental noise, or is ExtractBoundedOrAbandon nondeterministic when both select arms are ready?
      declared_by: claude-opus-5
      declared_at: "2026-08-23T19:07:01Z"
      alternatives:
        - id: flake
          statement: Environmental noise on a loaded runner; the implementation is correct and the test should be retried
        - id: race
          statement: The two-arm select picks at random when both the finished load and the expired ceiling are ready, so the reported limitation depends on the scheduler
      constraints:
        - awareness.missing_evidence_produces_unknown
      consequences:
        - effect: runs the existing test suite under CPU contention on a scratch worktree
          reversible: true
        - effect: temporarily reverts one function body in a worktree to observe the difference
          reversible: true
      notes: 'RETROSPECTIVE RECONSTRUCTION, written down after the fact. This is what actually happened while investigating #289, but it was not declared through this lane at the time because the lane did not exist yet. declared_at is when it was recorded, not when it was decided — and the same caveat applies to the observation''s observed_at.'
    - id: dq.adoption_event
      objective: Let a supported design become architecture without letting every implemented guess become architecture (#288)
      question: What event promotes an experimental design into governed architecture, and what must it carry?
      declared_by: claude-opus-5
      declared_at: "2026-08-23T19:31:24Z"
      alternatives:
        - id: extraction
          statement: 'Let code extraction promote it: once the implementation is stable and observed, canonical architecture picks it up as it does any other code'
          eliminated_by: rule:promotion to architecture is an epistemic event, not a side effect of implementation
        - id: supported_auto
          statement: Promote automatically when a hypothesis reaches SUPPORTED past its horizon
          eliminated_by: doc:docs/design/experimental-engineering-epistemology.md#9 — no automatic promotion, no automatic status transitions
        - id: explicit_adopt
          statement: An explicit adoption record citing the hypothesis, the observations, the horizon reached, and the uncertainty that remains
      constraints:
        - doc:docs/design/experimental-engineering-epistemology.md#9 — no automatic promotion, no automatic status transitions
        - rule:promotion to architecture is an epistemic event, not a side effect of implementation
      consequences:
        - effect: adds a record type and a CLI verb; no existing governance changes until something is actually adopted
          reversible: true
      notes: 'Both eliminations are real constraint bindings, not judgment: extraction-driven promotion IS the sediment failure, and automatic promotion on SUPPORTED is the automatic status transition §9 refuses. Only one alternative survives, so this is CONSERVATION — the shape of the answer is already determined and what remains is building it, not choosing it.'
    - id: dq.epistemic_lane_storage
      objective: Give uncertain design belief a first-class home (globulario/sensei#288 slice 1)
      question: Where do DesignQuestion, Hypothesis and Observation live, given they are believed-but-not-established?
      declared_by: claude-opus-5
      declared_at: "2026-08-23T19:06:41Z"
      alternatives:
        - id: corpus
          statement: Add design_question/hypothesis/observation as kinds in docs/awareness/*.yaml, compiled into the seed like invariants and failure modes
          eliminated_by: 'code:golang/propose/propose.go — contract-first: every canonical entry links an invariant, failure or contract'
        - id: candidates
          statement: Write them into docs/awareness/candidates/, the existing awaiting-review queue
        - id: own_lane
          statement: A separate governed ledger under docs/awareness/epistemic/, not read by yaml2nt and not projected into the graph
      constraints:
        - doc:docs/design/experimental-engineering-epistemology.md#3 — an uncertain claim must not have to masquerade as law
        - 'code:golang/propose/propose.go — contract-first: every canonical entry links an invariant, failure or contract'
        - doc:docs/design/experimental-engineering-epistemology.md#9 — no routing change in this slice
      consequences:
        - effect: adds one governed YAML file and a CLI surface; deleting the file removes the lane completely
          reversible: true
        - effect: 'no external effect: nothing is published, sent, or written outside this repository'
          reversible: true
      notes: candidates/ was not eliminated by a constraint — it was set aside by judgment, because that queue means 'awaiting promotion to canonical' and a design question is never promoted. Recorded as still viable so the belief in own_lane stays falsifiable.
    - id: dq.failed_design_versus_scar
      objective: Keep what a failed experiment taught, without turning every failure into a prohibition (#288)
      question: Does a refuted design become a distinct FailedDesign record, or is the refuted hypothesis plus its observation already that record?
      declared_by: claude-opus-5
      declared_at: "2026-08-23T19:31:47Z"
      alternatives:
        - id: reuse
          statement: The refuted hypothesis, its failure_conditions and its remaining_applicability ARE the record; retrieval reads them directly
        - id: distinct
          statement: A separate FailedDesign record carrying design identity, alternatives considered, the change that implemented it, and a disposition of refuted/weakened/superseded/scarred
        - id: promote_to_scar
          statement: Refutation files a scar and a forbidden_fix, reusing the machinery that already exists
          eliminated_by: rule:a refutation is evidence against one claim under stated conditions, not a standing ban on a mechanism
      constraints:
        - rule:a refutation is evidence against one claim under stated conditions, not a standing ban on a mechanism
        - existing:scar + forbidden_fix already exist for expensive failures that must not be rediscovered
      consequences:
        - effect: adds retrieval surface; nothing existing is reinterpreted
          reversible: true
      notes: A failed design and a scar are not the same severity. 'Append-only receipts produced unacceptable write amplification under workload X' is worth keeping and is not 'this caused split-brain and corrupted state'. Collapsing the first into the second would make failed designs a second kind of frozen dogma.
    - id: dq.governance_axes
      objective: Express 'may be rewritten freely, but still inside its established envelope' without another one-dimensional verdict (#288)
      question: Is an implementation's governance one scalar, or are epistemic status and mutation protection independent axes?
      declared_by: claude-opus-5
      declared_at: "2026-08-23T19:31:47Z"
      alternatives:
        - id: scalar
          statement: One status per implementation — experimental or established — with mutation protection derived from it
        - id: two_axes
          statement: Epistemic status (HYPOTHETICAL/EXPERIMENTAL/SUPPORTED/ESTABLISHED/REFUTED) and mutation protection (FREE/CONSTRAINED/GOVERNED/RETIRED) recorded independently
        - id: envelope_only
          statement: No per-implementation status at all — an implementation is experimental exactly while some open hypothesis names it in scope, and governance stays whatever the surrounding envelope already says
      constraints:
        - history:file -> grant/refuse, change -> grant/refuse, risk -> human/not-human each broke against reality (design doc §8a)
      consequences:
        - effect: changes what the ledger records; no established invariant, contract or gate is touched either way
          reversible: true
      notes: envelope_only is what slice 1 actually built, so this question is partly a review of a choice already made under time pressure rather than a fresh one. Recording it that way instead of retrofitting a justification. §8a warns that every scalar this project tried broke against reality, which is an argument against scalar but not yet evidence for two_axes over envelope_only.
hypotheses:
    - id: h.abandon_is_a_real_select_race
      question: dq.abandon_ceiling_intermittency
      alternative: race
      prediction: Force the run into the state where the load has been delivered AND the ceiling has expired, and the cancelled run will report a COMPLETED load rather than abandonment on roughly half the iterations.
      falsifier: With both select arms deterministically ready, every cancelled iteration still reports abandonment — which would mean the intermittency came from the environment and not from the select.
      horizon:
        due_at: "2026-08-23T18:00:00Z"
      declared_by: claude-opus-5
      declared_at: "2026-08-23T19:07:01Z"
      notes: RETROSPECTIVE. The discriminating experiment was the beforeCeilingForTest seam plus reverting the fix in a worktree.
    - id: h.own_lane_prevents_masquerade
      question: dq.epistemic_lane_storage
      alternative: own_lane
      prediction: 'Keeping the lane out of the awareness corpus and out of the seed prevents uncertain belief from being consumed as established knowledge: no DesignQuestion or Hypothesis id will appear in a briefing, preflight, edit-check or admission decision as governing knowledge.'
      falsifier: A briefing, preflight, gate or admission output cites a DesignQuestion or Hypothesis id among the knowledge governing a change — with every existing gate green.
      horizon:
        due_at: "2026-12-01T00:00:00Z"
        condition: at the first review after any surface begins reading docs/awareness/epistemic/
      declared_by: claude-opus-5
      declared_at: "2026-08-23T19:07:01Z"
observations:
    - id: o.reverted_fix_failed_on_run_zero
      hypothesis: h.abandon_is_a_real_select_race
      observed_at: "2026-08-23T19:07:01Z"
      what: 'With the seam forcing both arms ready and the ctx.Err() check reverted, the cancelled run reported a completed load on run 0 of 40, carrying exactly the limitation CI produced: ''semantic package load stopped by the caller: context canceled''. With the fix restored, 40 of 40 iterations abandon. Separately, 0 of 3200 cancelled runs took the wrong arm on an idle 16-core machine at GOMAXPROCS 1, 2, 4 and 16 — so the environment governs whether the defect is VISIBLE, not whether it exists.'
      outcome: supports
      evidence:
        - 'PR #289, golang/architecture/gosemantics/abandon_test.go:TestExtractBoundedOrAbandonAbandonsWhenBothArmsAreReady'
        - CI run 32657471809 on main 1a9efc93, build-and-test
        - failure.sensei.a_scheduler_race_reports_a_load_past_its_ceiling_as_a_comple
      observed_by: claude-opus-5
adoptions:
    - id: ad.explicit_adoption_event
      resolves_question: dq.adoption_event
      design: explicit_adopt
      evidence_hypotheses: []
      remaining_uncertainty: 'Whether requiring a SUPPORTED hypothesis is the right bar in practice is untested: it has been exercised on one CONSERVATION question and no experimental one. Adoption also cannot verify that a named authority is a person or that a person agreed — it records an attribution.'
      scope:
        - golang/architecture/epistemic/adoption.go
      adopted_by: claude-opus-5
      adopted_at: "2026-08-23T20:22:19Z"
      notes: 'Adopted with no evidence_hypotheses because the question is CONSERVATION: the constraints eliminated promotion-by-implementation and promotion-on-SUPPORTED, and no experiment was needed to decide what remained. Requiring a hypothesis here would have forced a fake experiment to confirm what the constraints already decided.'

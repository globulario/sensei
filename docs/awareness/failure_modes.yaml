    evidence: Phase 9.5 Checkpoint 2 provider supplies typed observations or typed-unavailable sources with exact reasons; dimension assessment stays in controlstate.

  - id: controlstate.transport_recomputes_a_different_digest
    title: The transport recomputed a different projection digest
    severity: high
    root_cause: |
      The mapper, a handler, or a client recomputed a projection digest from the protobuf
      representation (or repaired a mismatched digest) instead of copying the canonical
      controlstate digest verbatim — producing a digest that verifies the wrong content.
    symptoms:

    evidence:
      - 'Reproduced on an isolated restored copy of graph def94857 (158349 triples): deleting one codeSymbol triple and inserting one unrelated triple left freshness=current, verdict=authoritative, detail=''live store matches expected validated graph artifact'' (#282, witnessed in docs/evaluation/prospective-v1-execution/graph-snapshot-witness.md)'
  - id: failure.sensei.a_scheduler_race_reports_a_load_past_its_ceiling_as_a_comple
    title: A scheduler race reports a load past its ceiling as a completed stage
    severity: high
    description: ExtractBoundedOrAbandon selected between the finished load and the expired ceiling with a bare two-arm select. When both were ready Go chose at random, so one cancelled run reported abandonment (a BLOCKING limitation naming a document with no semantic observations) and the next reported completion, whose stop reaches factextract as a NON-blocking note. Partial evidence was therefore presented as a whole stage, decided by the scheduler.
    protects:
      files:
        - golang/architecture/gosemantics/extract.go
    related_invariants:
      - awareness.missing_evidence_produces_unknown
    required_tests:
      - golang/architecture/gosemantics/abandon_test.go:TestExtractBoundedOrAbandonAbandonsWhenBothArmsAreReady
    evidence:
      - 'CI run 32657471809 on main 1a9efc93: TestExtractContextAbandonsTheSemanticStageAtTheCeiling failed with go_semantic_extractor limitation ''semantic package load stopped by the caller: context canceled'' Blocking:false'
      - not reproducible on a 16-core idle machine (0 of 3200 cancelled runs took the wrong arm); reproduced within 60 runs under nproc-wide CPU contention, and on a loaded two-core GitHub runner
      - the defect predates the merge that exposed it; no change in that merge touched Go code
  - id: failure.sensei.a_build_depends_on_the_unauthenticated_github_rest_api_and_f
    title: A build depends on the unauthenticated GitHub REST API and fails on unrelated traffic
    severity: warning
    description: 'deploy/Dockerfile resolved the Oxigraph download URL through api.github.com, which is rate-limited PER IP for unauthenticated callers. On a shared CI runner the quota is somebody else''s to exhaust: the appliance build died with ''curl: (22) ... error: 403'' while a sibling job on the same commit passed. A build whose success depends on unrelated traffic from other tenants is not reproducible, and the failure looks like a defect in the change under test.'
    protects:
      files:
        - deploy/Dockerfile
    related_invariants:
      - invariant.an_identity_claim_must_be_derived_from_the_exact_thing_it_cl
    evidence:
      - 'CI run 32665423125 on PR #294: build-and-smoke failed at the Releases JSON API with 403; run 32665437458 on the same commit passed'
      - scripts/fetch-oxigraph.sh had already avoided this API and says so in its header — the same repository learned the same lesson twice, in two places, without one informing the other
  - id: failure.sensei.a_client_deadline_was_reported_as_an_unreachable_backend
    title: A client deadline was reported as an unreachable backend
    description: 'toolRPCError tested for Unavailable OR DeadlineExceeded and then emitted one sentence asserting the awareness-graph backend is unreachable: it DISTINGUISHED THE TWO CODES AND THEN DISCARDED THE DISTINCTION. callWithFailover collapsed it earlier and worse, returning a MANUFACTURED codes.Unavailable whatever the per-address failures actually were, so a set of addresses that all timed out reached the caller already relabelled. A caller could not tell ''Sensei is down'' from ''this call was too slow'', making the honest reactions -- retry with a longer budget, narrow the scope, report degraded coverage -- indistinguishable from concluding absence. Measured: a 2-file scoped preflight 2.7s, a 6-file one 7.6s and failing every time while the identical call succeeded by hand. An envelope of about six files could not be governed, for a reason nobody chose and nobody could see in the message.'
    protects:
      files:
        - cmd/awareness-mcp/main.go
        - cmd/awareness-mcp/transport_outcome.go
    required_tests:
      - cmd/awareness-mcp/transport_outcome_test.go:TestTheReportedFailureIsNotAnUnreachableBackend
      - cmd/awareness-mcp/transport_outcome_test.go:TestAllAddressesTimingOutIsDeadlineNotUnavailable
      - cmd/awareness-mcp/transport_outcome_test.go:TestMixedOutcomesDoNotBecomeAConfidentClaim
      - cmd/awareness-mcp/transport_outcome_test.go:TestAnUnrecognisedFailureIsUnclassifiedNotUnreachable
      - cmd/awareness-mcp/transport_outcome_test.go:TestTheClassificationReachesTheJSONRPCSurfaceAsData
      - cmd/awareness-mcp/transport_outcome_test.go:TestClassificationAndRetryAreDifferentQuestions
      - cmd/awareness-mcp/transport_outcome_test.go:TestEveryMemberOfTheClosedSetReachesTheCallerAsTypedData
      - cmd/awareness-mcp/transport_outcome_test.go:TestATerminalFailureKeepsTheAttemptsBeforeIt
      - cmd/awareness-mcp/transport_outcome_test.go:TestASoleTerminalFailureIsUnchanged
    forbidden_fix:
      - 'raise the timeout instead of correcting the classification: it moves the threshold and hides the false attribution until a larger envelope crosses the new one'
      - 'compensate downstream by parsing this prose in the consuming adapter: the adapter is replaceable and both the deadline and the classification originate in the bridge'
    evidence:
      - globulario/sensei#319, found from a sensei-code run; the three configured addresses returned RST_STREAM/CANCEL, context deadline exceeded, context deadline exceeded -- none of which is a refused connection
    contract: 'Only the outcome that means the backend could not be reached may say so. A client deadline, a transport reset, a CANCELLATION, a server refusal and an unclassifiable failure are five different facts, and each must survive to the caller as a typed outcome in the structured surface -- never as prose a downstream adapter has to parse. Cancellation is its own member and is never reported as a deadline: a call the caller aborted did not run out of budget, and saying it did asserts a fact about time that nothing established. `unclassified` is a member and an ANSWER, so it reaches the caller in the same shape as every other outcome rather than as a silence. A set of addresses that failed DIFFERENTLY aggregates to `unclassified`; the last address never speaks for the whole set.'
  - id: failure.sensei.a_presentation_cap_silently_changed_a_governance_verdict
    title: A presentation cap silently changed a governance verdict
    description: Preflight and change-impact bounded their anchor, repair-plan and pattern lists for readability, then passed the BOUNDED list to the deciding functions. In compact mode caps.invariants=3, caps.failureModes=2, caps.patterns=1 and maxRepairPlansSurfaced=2, so a governed anchor beyond the cap could not raise risk, could not establish applicability, and could not cast a repair-plan authority vote. The verdict was a function of how much fitted on screen. Three instances were live and mutation-proven; a fourth was latent (see the ordering invariant).
    protects:
      files:
        - golang/server/preflight.go
        - golang/server/change_impact.go
        - golang/server/blast_radius.go
    related_invariants:
      - invariant.sensei.governance_decides_from_complete_state_and_projects_afterwards
    required_tests:
      - golang/server/preflight_applicability_test.go:TestRiskClassificationSeesAnchorsThatCapsHide
      - golang/server/blast_radius_test.go:TestMatchingReturnsEveryPlanAndSurfacingIsWhatCaps
    evidence:
      - each of the three was proven by reverting the wiring and watching the falsifier fail; ten further caps in the package were inspected BY READING ONLY, which is a weaker evidence class and is recorded as such
  - id: failure.sensei.a_decision_surface_reported_current_while_the_admitted_knowl
    title: A decision surface reported current while the admitted knowledge was unreachable
    description: 'The authority block reported ''authoritative (current)'' because current was measured against the published artifact''s own marker -- and an artifact always matches itself. Nothing compared the serving generation to the authored corpus. Measured 2026-09-01: the live store was built from 96f19456f5fb on 2026-08-20 while the corpus had moved 159 corpus-touching commits ahead, so every law admitted in that window was authored, reviewed, merged and invisible to every decision, with no surface saying so. Absence of publication was not reported as stale -- it was not represented at all.'
    protects:
      files:
        - golang/reachability/reachability.go
        - cmd/awg/authority_output.go
    required_tests:
      - golang/reachability/reachability_test.go:TestAdmittedButUnpublishedKnowledgeIsStaleNotCurrent
      - golang/reachability/reachability_test.go:TestEveryUnanswerableQuestionIsUnknownNeverCurrent
      - golang/reachability/reachability_test.go:TestAnUnorderableGraphIsNotCalledStale
      - golang/reachability/reachability_test.go:TestAbbreviatedAndFullRevisionsAreTheSameRevision
    forbidden_fix:
      - 'publish automatically to make the line green: publication stays deliberate, and hidden mutation of a shared decision surface is a worse failure than a visible stale one'
      - 'report an unmeasurable distance as current: an unmeasured zero is indistinguishable from a measured zero, which is a fail-open in the very check written to stop one'
    evidence:
      - 'briefing printed ''authoritative (current)'' beside ''Build time: 2026-08-20'' for eleven days; the reachability line now prints STALE with the distance on the same block'
    contract: 'A caller must be able to establish whether newly admitted knowledge is reachable by the graph making a decision. Reachability is REPORTED, never repaired by rebuilding. A stale or unestablished generation is reported as unpublished or unestablished knowledge and NEVER as absence of law: ''the graph has no rule about this'' and ''the graph that would hold the rule is eleven days old'' are different answers.'
  - id: failure.a_positive_control_gate_reported_success_while_no_rule_had_l
    title: A positive-control gate reported success while no rule had loaded, reproducing the defect it guards against
    severity: critical
    description: 'The ruleguard positive-control gate exists so each principle rule is PROVEN to fire on a known-bad fixture, precisely because a rule that cannot load reports zero findings exactly like a clean tree. It had never executed in either environment. In CI no workflow installed ruleguard, so the test skipped in every run -- while its own comment said ''CI MUST install it so this attestation actually runs''. Locally ruleguard was installed but could not resolve go-ruleguard/dsl, so it loaded NO rule and every sub-test skipped. And ''proven'' was counted and never asserted, so the test reported ok while proving nothing. Three independent conditions each had to be repaired: the DSL made resolvable, the install placed in the job that actually runs go test, and proven==0 made fatal. Any one or two alone still leaves a false-green path. The first repair attempt put the install in the cross-platform COMPILE job, which runs no tests -- a green CI that changed nothing about the proof path, a fix indistinguishable from no fix.'
    protects:
      files:
        - cmd/principle-check/positive_control_test.go
    related_invariants:
      - invariant.a_verification_mechanism_must_prove_its_falsifying_path_exec
    required_tests:
      - cmd/awg/promote_evidence_test.go:TestTheGateTestCanActuallyRunHere
    evidence:
      - no workflow file mentioned ruleguard; the test's own comment asserted CI installs it
      - locally every sub-test skipped with 'cannot resolve go-ruleguard/dsl'; 26 rules prove their control once the DSL is a module dependency
      - proven was incremented at line 124 and never asserted
  - id: failure.a_whole_store_replace_left_the_store_claiming_the_generation
    title: A whole-store replace left the store claiming the generation it had just destroyed
    severity: critical
    description: 'sensei build --all replaces every triple in the store and never published a store-scoped proof set; only --repo did. expectedGraphMarker prefers that store-scoped record over the per-repository marker file, so after a cold-start build every freshness-gated surface compared the live store against the generation it had just replaced and refused: ''graph freshness stale for briefing: live store missing expected graph marker''. Measured 2026-09-02: a brand-new empty store on a port last used three days earlier inherited that port''s generation record from ~/.sensei/graph/<store-id>/current.json; a --all build loaded 108887 triples and wrote a marker file agreeing with the store exactly, and briefing still refused. The refusal is correct in FORM and false in FACT, which is the worst kind -- it is indistinguishable from a genuinely stale store, so the honest reaction (rebuild) is the one that does not help, and every rebuild reproduced it.'
    protects:
      files:
        - cmd/awg/cmd_build.go
    required_tests:
      - cmd/awg/build_publishes_generation_test.go:TestBothStoreLoadPathsPublishTheGeneration
    evidence:
      - removing the publishProofSet call from the --all path fails TestBothStoreLoadPathsPublishTheGeneration; making Invalidate a no-op fails TestInvalidateDropsAPointerThatDescribesReplacedContent; renaming the scan anchor fails the vacuous-pass guard; end to end, the same --all build that refused a briefing before the fix serves one after it
    contract: A build that replaces the store's content replaces the record that identifies it, or drops that record. A store must never claim a generation describing content it no longer holds, because the freshness gate prefers the store-scoped record over any per-repository copy.
  - id: failure.a_domain_scoped_answer_carried_the_home_domain_s_authority_b
    title: A domain-scoped answer carried the home domain's authority because the scope was read after the stamp
    severity: high
    description: 'Metadata accepted req.domain, scoped its per-class and triple counts to it, and stamped resp.Authority from graphAuthorityFromSnapshot -- graphAuthorityFromSnapshotFor with closureDomain '''' -- fifty lines BEFORE it read req.GetDomain(). The closure proof behind the verdict was therefore evaluated for the home domain and attached to counts scoped to the caller''s. Neither half is wrong alone; the composite hands an agent domain X''s node counts beside an AUTHORITATIVE verdict about a different repository''s publication. Measured with the authorityReferentServer fixture: Metadata(domain=sensei-code) returned AUTHORITATIVE with the closure evaluator asked about nothing at all. The drift detector that exists for exactly this class, TestAllDomainScopedSurfacesProjectTheSameAuthority, excluded metadata on the recorded grounds that it ''read the requested domain correctly'' -- so the one surface assumed correct was the one still defective, and its hardcoded surface list covered 3 of 6 projecting files while its comment promised that a new surface would fail there automatically.'
    protects:
      files:
        - golang/server/metadata.go
    required_tests:
      - golang/server/metadata_authority_domain_test.go:TestMetadataAuthorityAnswersForTheDomainItWasAsked
    evidence:
      - reverting the one-line scoping change fails both TestMetadataAuthorityAnswersForTheDomainItWasAsked and the metadata surface of the drift detector; a positive control proves a proven domain still reports AUTHORITATIVE, so the negative case is not a blanket refusal
    contract: A response scoped to a requested domain carries authority evaluated for THAT domain. A surface that accepts a scope may not stamp a verdict computed for another, and a coverage check over sibling surfaces must enumerate them structurally rather than by a hand-maintained list whose name claims more than its body.
  - id: failure.union_default_graph_reads_expose_in_flight_staging_graphs
    title: Union default-graph reads expose in-flight staging graphs
    description: Named graphs already exist and are NOT domains. Enabling union reads to make named-graph domain publication readable also makes transient staging graphs readable, destroying the atomicity the staging design provides.
    protects:
      files:
        - cmd/awg/cmd_serve.go
    related_invariants:
      - graph.publication_requires_pre_mutation_domain_source_admission
    required_tests:
      - cmd/awg/oxigraph_serve_args_test.go:TestOxigraphServeArgsDoNotEnableUnionReadsWhileStagingGraphsExist
    evidence:
      - 'sensei build PUTs a candidate slice and a SECOND seed marker into urn:sensei:graph-staging:<marker> and promotes it in one transaction (cmd/awg/cmd_build.go). With oxigraph --union-default-graph, an unqualified { ?s ?p ?o } matches every named graph, so concurrent briefing and metadata readers observe the unpublished candidate and a duplicate marker before the promotion commits. Measured: default-only reads see 0 triples and the staged candidate is invisible; union reads see 2 and it leaks.'
  - id: failure.a_subsystem_s_health_overwrote_the_file_s_own_coverage_verdi
    title: A subsystem's health overwrote the file's own coverage verdict in one status field
    severity: high
    description: 'combineBriefingStatus returns DEGRADED whenever the briefing-feedback subsystem is degraded/unavailable/invalid, whatever the file''s own coverage was, and BriefingResponse carried only that composite. Two orthogonal facts -- ''is this file governed'' (OK|INFERRED_ONLY|CONTEXT_ONLY|EMPTY) and ''could feedback be consulted'' -- were collapsed into one field, and the second always won. Measured 2026-09-02: a server running without --repo-root has no feedback projection, so every briefing returned DEGRADED and an automatic pre-edit briefing could not tell a file governed by a direct anchor from a LICENSE the graph knows nothing about; it interrupted both. The field is additive and optional so absence is distinguishable from a value: BriefingStatus''s zero value is OK, and a plain field would have read ''this server does not report a file verdict'' as ''this file is governed''.'
    protects:
      files:
        - golang/server/briefing.go
    required_tests:
      - golang/server/briefing_file_status_test.go:TestTheBriefingRPCPopulatesFileStatus
    evidence:
      - with file_status removed from the response the RPC test fails because the field reads as its zero value OK for a file with no anchors; with the presence check removed an absent field is read as governed; live, 4 governed files record OK and 4 ungoverned record EMPTY where all 9 previously recorded DEGRADED
    contract: A response that answers two independent questions carries two fields. A composite that folds a subsystem's availability into an epistemic verdict may be offered, but never as the only answer, because a consumer needing the second question then receives the first. An additive status field is optional so that absence is distinguishable from its zero value.
  - id: failure.a_required_action_list_was_bounded_in_silence_so_satisfying
    title: A required-action list was bounded in silence, so satisfying it was not sufficient
    severity: high
    description: 'matchRuntimeEvidence capped its result at maxEvidenceSurfaced=2 and returned the prefix, putting a presentation bound inside the matching step. The capped list became Preflight RequiredActions with nothing recording that a bound had been applied, so a third required evidence profile was dropped in silence: a caller satisfied the two requirements it was shown, saw no others, and had no way to learn a third applied. The consumer''s decision len(matched)>0 was cap-invariant, so no verdict changed -- which is why it survived: the defect is not a wrong verdict but an output that reads as complete while being a prefix. Found 2026-09-02 during reflex-v1''s by-hand verification and deliberately NOT scored as the cap-before-decision shape, because stretching that definition to claim a subject would have manufactured the experiment''s result.'
    protects:
      files:
        - golang/server/runtime_evidence.go
    related_invariants:
      - invariant.sensei.governance_decides_from_complete_state_and_projects_afterwards
    required_tests:
      - golang/server/runtime_evidence_cap_test.go:TestATruncatedRequiredEvidenceListSaysItIsIncomplete
    evidence:
      - restoring the cap inside matchRuntimeEvidence fails TestATruncatedRequiredEvidenceListSaysItIsIncomplete on the matched count; bounding without the incompleteness line fails it on the message; emitting the line unconditionally fails the positive control
    contract: A bounded list of REQUIREMENTS states that it is bounded. Matching decides what applies and returns it complete; presentation bounds it and names what it omitted. A requirement absent without a statement of absence converts 'these are the requirements' into 'these are some of them' with no change to the output a reader sees.
  - id: failure.the_one_briefing_section_that_scales_with_the_package_outwei
    title: The one briefing section that scales with the package outweighed every section about the file
    severity: high
    description: 'composePackageInferenceNote rendered every inferred node unbounded. It is the only briefing section whose size scales with how much of the PACKAGE is governed rather than with what is known about the file, so in a large heavily-anchored package it dominated everything else. Measured 2026-09-03 across a fixed 15-file set: mean 23863 bytes of delivered context per governed edit, mean 109 inferred entries, near-identical for every file in golang/server -- including code_symbol.go and provenance.go, which carried 0 direct anchors and 0 decision-focus items and still delivered ~30KB about other files. A section explicitly labelled ''NOT about this file'' that outweighs the rest by two orders of magnitude is not subordinate, and an agent that learns to skim past it has been trained to skim past the briefing.'
    protects:
      files:
        - golang/server/briefing.go
    related_invariants:
      - invariant.sensei.governance_decides_from_complete_state_and_projects_afterwards
    required_tests:
      - golang/server/briefing_inferred_bound_test.go:TestTheInferredSectionIsBoundedAndSaysSo
    evidence:
      - 'same fixed set before and after: mean delivered context 23863B -> 3018B (87% reduction), mean inferred entries 109 -> 5, while Decision focus changed on 0 of 12 files and direct-anchor counts changed on 0 of 12; removing the bound, bounding silently, reverting to alphabetical survivors, or announcing truncation unconditionally each fail a test'
    contract: A briefing section that is subordinate by its own label is bounded, and states the bound. What survives a bound is chosen by an authored property of the entries, never by an ordering that merely happens to sort some earlier. Bounding a section must not change which knowledge is presented as governing the file.
  - id: failure.a_freshness_gate_compared_what_it_had_just_produced_against
    title: A freshness gate compared what it had just produced against itself and never checked what was committed
    severity: high
    description: 'scripts/build-awareness-graph-self.sh --check, the gate CI runs, regenerated docs/awareness/generated into a TEMP directory and then compared only the SEED. Both sides of that comparison derive from the fresh scan, so the COMMITTED generated artifacts never entered any comparison and could drift arbitrarily while the gate printed ''fresh'' and exited 0. Reproduced twice at 58c055fb: an annotation report reading discovered_tests 999999, and code_symbols.yaml with a real symbol deleted; both passed. It is material rather than cosmetic because sensei build reads -input docs/awareness recursively, so the committed generated files are PUBLISHED into the served graph -- a drifted one publishes wrong knowledge past the gate that exists to prevent exactly that. The comparison mechanism already existed: scripts/build-awareness-graph.sh implements check_file and applies it to _code_symbols.yaml and _code_edges.yaml while deliberately excluding the annotation report as informational. The repository had already decided which artifacts must not drift; the script CI actually runs simply never consumed that decision.'
    protects:
      files:
        - scripts/build-awareness-graph-self.sh
    related_invariants:
      - invariant.a_verification_mechanism_must_prove_its_falsifying_path_exec
    required_tests:
      - cmd/awg/self_build_gate_test.go:TestGeneratedFreshnessCheck
    evidence:
      - removing the check block, discarding its result, dropping one artifact, treating a missing fresh copy as agreement, or renaming the anchor each fail TestSelfBuildGateChecksCommittedGeneratedArtifacts; on first real use the repaired gate immediately caught genuine drift introduced by this campaign's own new test file
    contract: A freshness gate compares the COMMITTED artifact against a freshly derived one. Comparing two freshly derived copies proves only that generation is deterministic. An artifact that is published must be checked; an absent comparison is reported as unchecked, never as agreement.

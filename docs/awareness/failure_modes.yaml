  - id: controlstate.protobuf_mapping_collapses_unknown_to_zero
    title: The protobuf mapping collapsed unknown into zero
    severity: critical
    root_cause: |
      The controlstate->protobuf mapper (or a handler) converted an unobserved count/summary into

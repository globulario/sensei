    evidence: Phase 9.5 Checkpoint 2 additions use new field numbers only; field 7 is pinned by compatibility tests.
  - id: failure.briefing_session_marker_bound_only_to_file_path_not_domain
    title: Briefing session marker bound only to file path, not domain
    description: record-briefing.sh and enforce-briefing.sh hashed only the resolved absolute file path to gate protected edits. A briefing obtained against one loaded domain could therefore authorize an edit evaluated under a different domain in the same checkout, since the marker carried no domain identity at all.
    protects:
      files:
        - .claude/hooks/record-briefing.sh
        - .claude/hooks/enforce-briefing.sh
    evidence:
      - 'cmd/awg/hook_lifecycle_integration_test.go step 4: a briefing recorded with domain=github.com/somebody-else/renamed-repo still authorized an edit before the fix'
    contract: 'docs/design/checkout-repository-domain-binding.md §3: briefing markers must bind hash(repository root + repository domain + file path)'
  - id: failure.projectverification_composed_a_verification_record_without_c
    title: ProjectVerification composed a verification record without checking it referenced the same decision
    protects:
      files:
        - golang/architecture/workspacecontract/admission.go
    related_invariants:
      - workspace.admission.decision_verification_binding
    required_tests:
      - golang/architecture/workspacecontract/admission_test.go:TestProjectVerification_RejectsMismatchedAdmissionID
    evidence:
      - reachable via direct package use with two independently-constructed admission.Decision/admission.Verification values, no filesystem race needed
  - id: failure.synthesis_unbounded_retry_if_caller_bypasses_transition
    title: Unbounded autonomous retry if a caller bypasses Transition's budget enforcement
    protects:
      files:
        - golang/architecture/synthesis/transition.go
    related_invariants:
      - invariant.synthesis.retry_and_replan_budgets_are_precommitted
    required_tests:
      - golang/architecture/synthesis/adversarial_gaps_test.go:TestBudgetsNeverIncreaseAcrossAFullSequence
    evidence:
      - 'Transition provably enforces RemainingRetryBudget/RemainingReplanBudget non-increase and exact-once-per-accepted-evaluation consumption (TestBudgetsNeverIncreaseAcrossAFullSequence), but this guarantee holds only for callers that route every retry/replan decision through a RecordEvaluationCommand. Transition has no way to observe calls that never reach it: a hand-rolled orchestration loop that invokes a provider directly and retries on failure, without ever submitting an Evaluation and driving the loop through Transition, would retry without any budget check at all — the state machine cannot prevent misuse of itself that bypasses its own API.'

  - id: failure.intent_mine_citation_cage_rejected_claude_cli_citations_miss
    title: 'Intent-mine citation cage rejected claude-cli citations missing the file: prefix'
    protects:
      files:
        - golang/extractor/coldsource/intent_draft.go
    evidence:
      - 'Regression proof: golang/extractor/coldsource/intent_extract_test.go:TestLLMIntentDrafter_ToleratesDroppedFileSchemePrefix'
      - "12/12 claude-cli-drafted intents for a cold-imported gin checkout were rejected as fabricated although every citation resolved after restoring the dropped file: scheme prefix."
    contract: Every LLM-drafted intent source citation must resolve to a real gathered excerpt citation id or be rejected as fabricated.
  - id: failure.sensei.agentcommand_encodeagentprompt_omits_the_mode_const_empty_ru
    title: agentcommand.encodeAgentPrompt omits the mode-const-empty rule for non-set-mode operations
    severity: warning
    description: 'Observed during a real end-to-end O1-O7 self-pilot run (synthesisdriver.Run against Sensei''s own repo, real claude CLI subprocess calls for interpretation/planning/O3-generation). Interpretation and planning completed correctly. O3 generation''s real claude call produced a mutation-plan operation with kind=write and mode="regular", which agentcommand-mutation-plan-v1.schema.json correctly rejected (mode must be const "" for write/delete/rename/symlink; only kind=set-mode allows regular/executable) -- this is the intended governance behavior, a plausible-but-wrong LLM output mechanically caught rather than silently applied, and the driver correctly stopped with Disposition=runner-stopped rather than pushing through. But the rejection was avoidable: command_agent.go''s encodeAgentPrompt tells the model ''each operation must contain all fields ... mode ... Modes: regular or executable'' without ever stating that mode must be the empty string for every kind except set-mode. The prompt instructs the model into producing schema-invalid output for the common case.'
    protects:
      files:
        - golang/architecture/agentcommand/command_agent.go
        - golang/architecture/agentcommand/schemas/agentcommand-mutation-plan-v1.schema.json
    evidence:
      - 'Real O7 self-pilot run: a real claude CLI call for O3 generation produced kind=write with mode="regular"; validation failed at /operations/0/mode ''value must be ""'' per the schema''s const constraint for non-set-mode kinds'
      - 'command_agent.go:180 says only ''Modes: regular or executable'', never stating this applies exclusively to kind=set-mode and must be empty-string otherwise'
    contract: agentcommand.encodeAgentPrompt's generated instructions must fully and correctly describe the mutation-plan schema's per-kind field constraints, since the schema is the sole ground truth an LLM-generated plan is validated against -- an incomplete prompt wastes real generation attempts on avoidable, predictable schema rejections.
  - id: failure.job_level_env_exposed_openai_api_key_to_every_step_defeating
    title: Job-level env exposed OPENAI_API_KEY to every step, defeating the pinned action's own proxy isolation
    severity: critical
    description: 'Round 1 of PR #148''s secret-restructuring fix (4e40a852) moved Codex execution to a workflow_run-triggered workflow (closing the PR-can-edit-the-workflow-YAML attack) but still set ''env: OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}'' at job level solely so the job''s own if: conditions could branch on key presence. Every step in that job -- including whatever codex exec spawns as a subprocess -- inherited it. openai/codex-action deliberately exposes the key as PROXY_API_KEY to one proxy-startup step only, then runs ''env -u PROXY_API_KEY'' before launching the long-running proxy process the agent actually talks to, specifically so the agent''s own subprocess never retains the raw key. Ambient job-level env silently put it back within reach.'
    protects:
      files:
        - .github/workflows/sensei-codex-architect-review.yml
    evidence:
      - 'PR #148 review at head c0785e11 (2026-08-02): ''The trusted workflow places OPENAI_API_KEY in job-level environment scope... This defeats the pinned action''s own isolation mechanism.'''
      - 'Detected by scripts/lib/codex-workflow-guardrails_test.sh, a shell-script regression check -- not citable via required_tests, whose identifier grammar is restricted to Go-test-shaped IDs (path/to/file_test.go:TestName).'
    contract: Secret-bearing pinned actions must receive credentials only through their documented input channel; ambient job/step env is forbidden because every sibling step and any subprocess a composite action spawns inherits it.
  - id: awareness.graph_authority.scratch_build_overwrites_live_marker
    title: A scratch-targeted graph build silently falls back to the repository-global authority marker path, causing an unrelated live Sensei server to report stale/non-authoritative even though its graph store was never modified
    severity: high
    description: 'sensei build --all --store-url http://127.0.0.1:19879/store?default was run against a throwaway scratch Oxigraph instance for local CI reproduction, with --graph-marker-file left unset. Because the marker path defaults independently of --store-url (cmd/awg/cmd_build.go:183-190, defaultRuntimeMarkerFile), the write landed at the repository-global default .sensei/graph-authority.json — the exact path an already-running, unrelated live sensei serve daemon (:10120, PID 436953) was using for its own freshness check. The live Oxigraph store at :7878 (186825 triples) was never touched; only local marker/transaction metadata was corrupted. sensei metadata then reported Freshness state: stale / Seed state: stale for a server whose underlying graph data was fully intact.'
    protects:
      files:
        - cmd/awg/cmd_build.go
    related_invariants:
      - awareness.graph_authority.marker_target_binding
    evidence:
      - scratchpad/provenance/graph-marker-incident/graph-authority.corrupted.json — marker overwritten with scratch digest d130c13081b6... (95586 triples) instead of the live digest 2990e0a81620... (186825 triples)
      - 'scratchpad/provenance/graph-marker-incident/live-metadata.txt — captured live metadata showing Freshness state: stale, Freshness detail: live store missing expected graph marker d130c13..., while Live graph triples remained 186825'
      - scratchpad/provenance/graph-marker-incident/server-process.txt — PID 436953 process listing at time of incident, confirming the live daemon's -graph-marker-file flag points at the repo-global default path
  - id: awareness.workspace_identity.pre_edit_consultation_skipped_via_worktree_isolation
    title: An agent addressing external-review findings on a high-risk file can repeatedly modify code without performing the repository-required pre-edit consultation, because isolated worktree state makes the obligation appear absent
    severity: high
    description: |-
      Observed across PR #154 (feat/principle-pack-refresh, cmd/awg/cmd_principle_pack.go -- a file listed in docs/awareness/high_risk_files.yaml under cmd/awg/). CLAUDE.md requires loading the Sensei Architect skill and running sensei briefing before planning or editing architecture-sensitive work, especially 'state/convergence... recovery' work -- exactly what this PR's durability fix chain was. Across six consecutive review rounds (commits 8aa47fd5 through c47bac3a), the agent read each Codex finding, patched the exact line, wrote a test for that exact line, pushed, and waited for the next finding -- never once invoking sensei briefing/preflight/edit-check or the Sensei Architect skill, despite CLAUDE.md being loaded in context from the start of the session.
    
      The proximate cause, once investigated, was not simple negligence but a specific, reproducible mechanism: the agent was doing this work in an isolated git worktree (~/.../sensei-pr154-work), created deliberately after an earlier incident where a scratch sensei build in the main checkout corrupted the live server's graph-authority marker. That worktree has no .sensei/project/claims.yaml and no .sensei/tasks/ state at all, while the main checkout has a real, bootstrapped 141MB claims.yaml and dozens of task sessions. From inside the worktree, the Sensei Architect skill's own conditional check ('prepare-change is required when .sensei/project/claims.yaml exists') evaluates as not-applicable, because the file genuinely does not exist AT THAT PATH -- even though the repository this worktree is a checkout of has real governance state one directory over. The agent did eventually run briefing/preflight/edit-check against a scratch server built from the worktree (which correctly reported thin/DEGRADED coverage for this specific new file), but never discovered or consulted the main checkout's task-session state at all until the user asked directly why a separate worktree was being used.
    
      This is the AGENT-BEHAVIOR-LEVEL failure mode. It is distinct from, but directly caused by, the tooling-level gap filed separately as contract_unknown awareness.workspace_identity.governance_state_binding_unknown (same session): that candidate proposes the fix (governance-state location and mutation-workspace identity must be explicitly bindable and independently verified); this failure_mode documents the concrete harm of NOT having that fix -- an agent silently skipping a required discipline step because the absence of local state was indistinguishable from the absence of an applicable obligation. Fixing the tooling gap would very likely have prevented this specific occurrence (an explicit --state-repo/--state-dir binding would have surfaced the real governance state instead of silently reporting none).
    protects:
      files:
        - cmd/awg/cmd_principle_pack.go
        - cmd/awg/cmd_task_session.go
    evidence:
      - 'PR #154 review history: commits 8aa47fd5, 8cbb9755, 0295856, 30707ad, 54ea7bf/6dc678f, c47bac3 -- six consecutive rounds with zero sensei briefing/preflight/edit-check invocations, each responding only to the immediately-prior Codex finding'
      - 'sensei task-status --repo <main checkout> --active --verify: confirmed the main checkout DOES have real governance state (task.documentation.8b5971ee1097, 141MB claims.yaml, dozens of task sessions under .sensei/tasks/) that the worktree had no path to discover'
      - user had to ask directly ('why did you dont use it') before the agent invoked sensei-architect at all, and a second direct question ('is the fact that you work in a separate dir... can make sensei fail') before the worktree/governance-state asymmetry was investigated and confirmed
      - 'cross-linked: contract_unknown awareness.workspace_identity.governance_state_binding_unknown (same session, filed from the main checkout) proposes the tooling fix this failure_mode''s harm motivates'
    contract: CLAUDE.md's pre-edit consultation requirement (sensei briefing / Sensei Architect skill before editing files listed in docs/awareness/high_risk_files.yaml, especially for state/convergence/recovery work) must be satisfied based on the REPOSITORY's actual governance state, not merely the physical checkout's local .sensei/ contents -- an agent must not treat 'no local .sensei/project/claims.yaml in this exact directory' as proof no consultation obligation exists.
  - id: failure.sensei.dangling_tested_by_annotation_asserted_proof_from_a_test_tha
    title: Dangling tested_by annotation asserted proof from a test that does not exist
    description: 'A tested_by code annotation named a test that no discovered test defines, so briefing/impact reported ''Tested by: <test>'' for a test that was never written. The reconciliation validator''s referenced-symbol leg skipped any anchor whose symbol was not discovered, making the dangling case the one shape it stayed silent about. 7 of 10 annotated source files were affected, including impact.go, briefing.go, resolve.go and query.go.'
    protects:
      files:
        - golang/extractor/test_reconciliation_validator.go
    related_invariants:
      - awareness.missing_evidence_produces_unknown
    required_tests:
      - golang/extractor/test_reconciliation_validator_test.go:TestValidateTestReconciliation_ReferencedTestWithNoImplementationIsReported
    evidence:
      - sensei briefing --file golang/server/resolve.go reported tested_by golang/server/resolve_test.go:TestResolveNotFound; neither that file nor that function exists anywhere in the repo
      - ValidateTestReconciliation over the built code-symbol graph reported 0 findings before the fix and exactly 7 dangling anchors after adding ReferencedMissingImplementation
  - id: failure.sensei.missing_test_implementation_conflated_with_excluded_discover
    title: Missing test implementation conflated with excluded discovery scope
    description: AuthoritativeMissingImplementation reports 'required test has no discovered implementation' without distinguishing whether the discovery surface was actually available. In the standalone self build the generated/ code-symbol root is excluded by design, so no TestSymbol is discovered at all and every concrete required-test anchor is reported as missing. This accuses the repository of ~193 absent tests when 192 exist and are discoverable, and it buries the one genuine missing implementation in the noise. Absent implementation and unavailable discovery are different states and must not share a verdict.
    protects:
      files:
        - golang/extractor/test_reconciliation_validator.go
    related_invariants:
      - awareness.missing_evidence_produces_unknown
    evidence:
      - 'Controlled comparison on the same corpus: validating the self seed alone reports 193 AuthoritativeMissingImplementation; concatenating the generated code-symbol graph and revalidating reports 1'
      - 'Chain established for 5 representatives (cmd_build/cmd_feedback_check/cmd_infer_claims/cmd_propose/cmd_bootstrap tests): authored reference exists, Go function exists in checkout, TestSymbol absent from self seed, symbol present in docs/awareness/generated'
      - 'The single survivor with discovery available is genuine: golang/architecture/tasksession/briefing_promotion_test.go:TestBriefingExcludesTamperedPromotionWithFinding is referenced but defined nowhere in the repository'
  - id: failure.sensei.test_run_exit_code_accepted_as_proof_that_required_tests_ran
    title: Test-run exit code accepted as proof that required tests ran
    description: go test prints ok and exits 0 for a package whose tests were all skipped, so a caller that certifies from the process exit code reports proof it never obtained. On this repository the required tests for golang/server preflight work are guarded by requireCombinedSeed and skip in the open-core checkout, so 'required tests pass' was reachable while nothing was proved. A skipped or unselected required test is unavailable proof, not satisfied proof, and must not certify.
    protects:
      files:
        - golang/architecture/testobligation/obligation.go
    related_invariants:
      - awareness.missing_evidence_produces_unknown
    required_tests:
      - golang/architecture/testobligation/obligation_test.go:TestCertify_RequiredSkipIsIndeterminateNotPass
    evidence:
      - 'go test -run TestPreflightCriticalSignalsLeadTheActionList exits 0 and prints ok while the test reports SKIP: combined-seed golden: standalone seed omits Globular/services content'
      - sensei verify-obligations over the same run returns INDETERMINATE with exit 3, naming both obligations SKIPPED and preserving the skip reason
  - id: graph.wrong_workspace_publication_certifies_unrepresented_repository
    title: A publication from the wrong workspace certifies a repository it does not represent
    description: 'sensei build -input defaults to docs/awareness RELATIVE TO THE CURRENT WORKING DIRECTORY, and --repo <domain> replaces that domain''s entire slice. Run from the wrong repository, the build compiles a different corpus, replaces the target domain with it, and stamps a marker certifying the intended repository''s commit. Every downstream signal then reports health: the marker matches the last publication, freshness is CURRENT, seed is CURRENT, and the receipt names the correct certified commit. The graph is internally consistent and semantically wrong. Detection asymmetry makes it dangerous — briefings degrade to empty rather than erroring, so an agent reads ''no invariants apply here'' instead of ''the knowledge plane is not describing your repository''.'
    protects:
      files:
        - cmd/awg/domain_closure.go
    related_invariants:
      - graph.certified_domain_must_match_published_domain_content
    required_tests:
      - cmd/awg/domain_closure_test.go:TestWrongWorkspacePublicationFailsClosure
    evidence:
      - '2026-08-05: store fell 248743 -> 145491 triples. certified_services_repo_commit=d7c1a87c with authoritative=true and GRAPH_FRESHNESS_STATE_CURRENT, while resolve(four_layer.layer_has_single_writing_actor, domain=globular) returned found:false and resolve(awareness.briefing.deterministic_compact_context) — a sensei invariant sourced from golang/server/briefing.go — returned found:true under the same domain. Boundary trace proved projection intact: present in source, in the parsed structure, and in the emitted N-Triples as 28 triples with rdf:type Invariant and authoredIn provenance. The same mistake was repeated four times by an operator with full context; the fourth was refused before mutation by the admission guard.'
  - id: failure.sensei.platform_specific_source_never_compiled_by_ci
    title: Platform-specific source ships unbuilt because CI compiles only the host platform
    severity: high
    description: cmd/awg/lock_windows.go called syscall.LockFile/syscall.UnlockFile, which Go's standard library does not define on Windows (they are Linux-only wrappers). The file never compiled from the day it landed. CI builds and tests on Linux only, so nothing exercised the //go:build windows side; the defect surfaced only on the native windows-latest release runner, where it failed the whole release job and blocked the v1.6.0 tag entirely. A correct sibling in the same package (acquireGraphPublicationLock, using golang.org/x/sys/windows.LockFileEx) already demonstrated the right call, so the codebase contained both the bug and its fix simultaneously.
    protects:
      files:
        - cmd/awg/lock_windows.go
        - .github/workflows/ci.yml
    evidence:
      - 'release run 31413065922: cmd\awg\lock_windows.go:17:16: undefined: syscall.LockFile on windows-latest'
      - same class previously stalled releases between v1.3.0 and v1.5.0, also a Windows syscall.LockFile defect
      - fixed in 6b2c9c64; windows-amd64 build then passed in run 31413601050
    contract: Every GOOS/GOARCH in the release matrix must be compile-verified by a pre-release gate, not first exercised by the release job itself
  - id: failure.sensei.scoped_repo_publish_leaves_stale_source_file_edges_because_f
    title: Scoped repo publish leaves stale source-file edges because file nodes carry no domain tag
    description: 'sensei build --repo <domain> deletes triples whose SUBJECT is tagged aw:repo == domain, then appends the fresh slice. SourceFile nodes carry only rdf:type and aw:implements — no aw:repo — so they default to the home domain and are never deleted by a non-home publish. Their old aw:implements edges therefore survive indefinitely. Any re-identification or re-anchoring leaves ghosts: after the component-granularity migration the live graph served both the new per-package component and the retired coarse one for the same file, while the freshly compiled slice contained only the new edge. The same mechanism means an anchor REMOVED from the corpus keeps being served.'
    protects:
      files:
        - cmd/awg/cmd_build.go
    related_invariants:
      - awareness.missing_evidence_produces_unknown
    evidence:
      - fresh compiled slice links workspacecontract/identity.go only to component.golang.architecture.workspacecontract; the live store after a successful --repo publish serves both that and component.golang.architecture
      - grep of the compiled slice shows 0 aw:repo triples on the sourceFile node; its only predicates are rdf:type and aw:implements
  - id: failure.publishing_one_registered_domain_invalidates_every_other_dom
    title: Publishing one registered domain invalidates every other domain's authority proofs
    description: 'The graph marker is a whole-graph fact stored once per repository, and the closure report is a per-domain fact bound to whole-graph identity. Building any domain recomputes the global marker and regenerates the proof set for only that domain, leaving every other registered domain holding a proof set that vouches for a publication that no longer exists. Observed in both build orders with two servers sharing one Oxigraph store: there was no state in which two domains were simultaneously authoritative. Repair: store the proof set once per store and publish it as one atomic generation; carry an unchanged domain''s verdict forward only after verifying its slice digest is identical.'
    protects:
      files:
        - cmd/awg/cmd_build.go
        - golang/server/graph_authority.go
    related_invariants:
      - graph.certified_domain_must_match_published_domain_content
    required_tests:
      - golang/graphgeneration/graphgeneration_test.go:TestBuildingOneDomainKeepsEveryOtherDomainAuthoritative
    evidence:
      - sensei build --repo services leaves sensei-code failing preflight with GRAPH_DOMAIN_CLOSURE_UNPROVEN; reversing the order fails services with a missing expected graph marker
  - id: failure.installed_shared_knowledge_acquires_repository_authorship_fr
    title: Installed shared knowledge acquires repository authorship from its containing checkout
    protects:
      files:
        - golang/architecture/packcustody/custody.go
    related_invariants:
      - meta.storage_is_not_semantic_authority
    required_tests:
      - golang/architecture/graphbuild/custody_authorship_test.go:TestNoStableSubjectHasTwoAuthoritativeAuthoringDomains
    evidence:
      - Live topology measured 143 subjects carrying two aw:repo tags, 134 of them principle-pack identities. sensei init installs a mirror of the portable pack into every project; sensei build --repo then tagged that mirror to whichever repository's corpus directory contained it, minting two authoritative authoring domains for one stable identity.
  - id: failure.generated_inventory_committed_with_untracked_working_tree_so
    title: Generated inventory committed with untracked working-tree sources, and the local freshness gate cannot detect it
    protects:
      files:
        - docs/awareness/generated/awareness_graph_go_import_graph.yaml
    related_invariants:
      - meta.end_to_end_check_is_the_only_truth
    evidence:
      - make import-graph-check passed locally while CI reported STALE on the same commit. import-scan scans the working tree, so four untracked WIP files under golang/architecture/agentcommand/ entered the committed import graph (1 file entry) and the code-symbol inventory (14 symbols). The local gate regenerates from the same contaminated tree it compares against, so it agrees with itself; only a clean checkout disagrees.
  - id: failure.governed_append_corrupted_a_scaffolded_yaml_marker_and_repor
    title: Governed append corrupted a scaffolded YAML marker and reported success because nothing re-read the result
    protects:
      files:
        - golang/architecture/governedmutation/apply.go
    related_invariants:
      - meta.end_to_end_check_is_the_only_truth
    required_tests:
      - golang/architecture/governedmutation/apply_scaffold_append_test.go:TestFirstAppendAgainstScaffoldedEmptyMarkerStaysValid
    evidence:
      - 'sensei init scaffolds ''decisions: []''; the ^key: regex matched that inline marker as if it were a block marker, so the first append wrote block items under it and produced invalid YAML. Nothing in the propose path re-read the file, so the write reported success and every decision recorded afterwards was silently absent from the graph. In globulario/sensei-code this went unnoticed across many decisions and only surfaced when a rebuild was finally required.'
  - id: failure.ordinary_absence_returned_as_a_filesystem_error_entered_an_a
    title: Ordinary absence returned as a filesystem error entered an architect's evidence as an unavailable surface
    protects:
      files:
        - golang/architecture/tasksession/control.go
    related_invariants:
      - meta.authority_must_express_uncertainty
    required_tests:
      - golang/architecture/tasksession/no_task_session_test.go:TestMissingTasksDirectoryIsTypedAbsenceNotAnError
    evidence:
      - 'task_status in a repository that had never created a task session returned ''open .../.sensei/tasks: no such file or directory''. A governed run in globulario/sensei-code carried that errno into its architectural claims as evidence that the Sensei task surface was unavailable, when the accurate answer was simply that no task sessions exist. A missing tasks directory is the ordinary state of a repo that has not used tasks.'
  - id: failure.propose_accepted_a_repository_domain_it_could_not_honour_and

  - id: controlstate.read_rpc_mutates_dialogue_or_completion_state
    title: A read RPC mutated dialogue or completion state
    severity: critical
    root_cause: |
      A control-panel read handler wrote repository, dialogue, question, completion,
      certification, or graph state — or accepted a client-supplied AttentionItem or other
      semantic verdict — turning a read surface into an unaudited write path.
    symptoms:

  - id: failure.governed_append_assumed_one_of_yaml_s_two_block_sequence_sty
    title: Governed append assumed one of YAML's two block-sequence styles and refused every proposal against the other
    severity: high
    protects:
      files:
        - golang/architecture/governedmutation/apply.go
    required_tests:
      - golang/architecture/governedmutation/apply_indent_append_test.go:TestAppendMatchesEitherBlockSequenceStyle
    evidence:
      - 'sensei propose refused every proposal against globulario/services (11,640-line invariants.yaml, 277 entries) with ''appending under "invariants" would produce a document that does not parse (yaml: did not find expected key)''. renderItem always emits 2-space-indented items; that corpus writes items at column 0, so the composed item landed as a key inside the previous entry.'
      - 'Content-independent: the reported line did not move when the payload shrank to one word, and the same shape failed identically for failure_modes.yaml. It never reproduced on sensei''s own corpus, which happens to use the indented style.'
    contract: A governed append must match the block-sequence indentation the target corpus already uses; both of YAML's styles are legal and the corpus, not the renderer, decides.
  - id: failure.a_governed_append_reported_success_while_writing_the_record
    title: A governed append reported success while writing the record into a nested sequence instead of the governed one
    severity: critical
    protects:
      files:
        - golang/architecture/governedmutation/apply.go
    required_tests:
      - golang/architecture/governedmutation/apply_indent_append_test.go:TestAppendNeverLandsInANestedSequence
    evidence:
      - YAML allows a bare '-' indicator with the item's content on the following lines. The indentation detector required '- ', skipped such an item, and continued scanning -- matching the first NESTED sequence below it, typically protects.files six columns in. The record was reindented into that nested list.
      - 'verifyAppendResult only checks that the top-level key is still a list, so the composed document parsed and the append reported SUCCESS. This is a distinct and more dangerous class than the sibling parse-refusal scar: a caller with a success exit has no reason to look again, and the record is absent from the governed sequence with nothing reporting it.'
    contract: A governed append must place the record in the sequence under the named top-level key. Verifying that the key still holds a list is not the same check, and a record that parses in the wrong list is worse than one that does not parse at all.
  - id: failure.a_resource_budget_bound_one_extractor_and_not_the_other_so_a

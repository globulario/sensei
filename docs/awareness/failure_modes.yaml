  # ── Phase 9.1: canonical read-only completion projection ──
  - id: closure.completion_surface_collapses_or_remaps_terminal_state
    title: A surface collapsed or independently re-mapped completion terminal state
    severity: high
    root_cause: |
      A server/CLI/briefing surface translated broken, contradictory, or unsupported

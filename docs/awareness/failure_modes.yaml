    evidence:
      - 'synthesisdriver has six dispositions; synthesis-run''s exitCodeForDisposition and nextStep switches handled five. DispositionInterpretationAdvisory fell through to exitInternalDefect, so an ordinary governed outcome (the interpretation''s closure receipt did not carry governing authority) told the operator to treat it as a bug in the tool. Observed live: disposition interpretation-advisory, exit_code 7 (internal defect), detail ''interpretation remains advisory: blockers=[completeness:incomplete]''. The guarding test could not catch it because it enumerated five dispositions by hand rather than ranging over the closed vocabulary.'
  - id: failure.a_nil_validation_context_was_reported_as_a_probe_sourcing_vi
    title: A nil validation context was reported as a probe sourcing violation, bricking the task
    protects:
      files:
        - golang/architecture/probe/model.go
    related_invariants:
      - meta.single_derivation_path_must_reach_its_consumer
    required_tests:
      - golang/architecture/probe/nil_context_test.go:TestCommandBearingProbeLoadsWithoutAValidationContext
    evidence:
      - 'probe/model.go treated ctx == nil as a failed CommandMatches, so every command-bearing probe became permanently unloadable. Convergence generates such a probe FROM the graph (generate.go copies ev.Command with SourceRef evidence:+ev.ID, which verifies when a context is present), persists it, and then every ordinary load path rejects it: tasksession AdvanceTask and convergence both pass nil, having no graph to pass. prepare-change refused its own output and advance-task, the remediation its own error recommended, refused the same probe. Execution safety never depended on this check: probeexec rejects any step carrying a command outright.'
  - id: failure.convergence_generates_a_control_probe_that_the_same_run_and
    title: Convergence generates a control probe that the same run and its remediation both refuse
    protects:
      files:
        - golang/architecture/probe/model.go
    related_invariants:
      - meta.single_derivation_path_must_reach_its_consumer
    evidence:
      - 'prepare-change synthesizes a control probe during convergence and then refuses it (''probe command must be copied exactly from a sourced Evidence node''), and advance-task -- the remediation its own error text recommends -- fails on that same probe when loading control probes. synthesis-run then stops at closure-digest-unavailable before reaching the governed driver. Deterministic across runs and across --mode modify and --mode inspect. Found by the #149 CLI smoke on its first real end-to-end run.'
  - id: failure.composition_cannot_be_evaluated_on_a_repository_with_no_grap
    title: Composition cannot be evaluated on a repository with no graph, and zero candidates hides why
    protects:
      files:
        - golang/architecture/evalharness/composition.go
    related_invariants:
      - meta.single_derivation_path_must_reach_its_consumer
    required_tests:
      - golang/architecture/evalharness/composition_test.go:TestZeroCandidatesIsDistinguishedFromCompositionNotRunning
    evidence:
      - investigator.Compose mandates five explicit SHA256 input digests with no unavailable status, and the composed document's receipt graph digest is validated against its binding's repository graph digest. A synthetic mutant has no graph, so supplying digests without a binding is refused and making them agree would declare a resolved graph digest for a repository that has none. Observed as candidates 0/9 while HOW produced 27-38 observations per mutant, a count that reads as composition found nothing unless the arm states that composition never ran. Resolved by onboarding the mutants with their own awareness corpus so the digest is earned.
  - id: failure.a_governed_decision_declared_two_identities_within_one_proce
    title: A governed decision declared two identities within one process
    description: normalizePath was not idempotent for the empty string (filepath.Clean("") is ".", so normalizePath(".")=="" and normalizePath("")=="."), and normalizeDecision rewrites path slices in place on a backing array shared with the caller's Decision. The second normalization read the emptied slot, produced ".", added a phantom files_to_read entry and changed the digest. A declared-equals-computed check cannot catch this because both sides move together; only comparing two serializations of one value exposes it.
    protects:
      files:
        - golang/architecture/admission/admission.go
    related_invariants:
      - invariant.synthesis.declared_digest_must_equal_computed_content_digest
    required_tests:
      - golang/architecture/admission/decision_identity_stability_test.go:TestDecisionDigestIsStableAcrossRepeatedMarshals
    evidence:
      - sensei admit-change --output <file> --format json marshalled one Decision twice and the stored copy declared decision_digest_sha256 ea114a3e1a08 while the printed copy declared a5e545fe5043; each serialization alone produced ea114a3e1a08, so the second marshal in a process changed the artifact's identity
  - id: failure.a_candidate_s_graph_identity_is_never_revalidated_after_the
    title: A candidate's graph identity is never revalidated after the run that produced it
    description: 'synthesis-admit and synthesis-apply refuse base-revision drift when they revisit a persisted bundle, but do not re-verify the workspace or graph identity the candidate was produced under, because recomputing workspace identity needs a live Metadata RPC. A candidate sealed against one graph publication can therefore be composed into an admission request under another, or under none at all. Named in issue #149 hard law 10 and now measured rather than assumed.'
    protects:
      files:
        - cmd/awg/cmd_synthesis_admit.go
    related_invariants:
      - invariant.synthesis.session_resumption_rejects_all_bound_identity_drift
    evidence:
      - with the graph server stopped, sensei synthesis-run refuses (exit 12, graph-identity-unusable) but sensei synthesis-admit composed an admission request from the persisted lineage bundle anyway; measured by scripts/synthesis-run-smoke.sh with the refusing run as its control
  - id: failure.a_post_application_verification_can_never_be_attached_to_the
    title: A post-application verification can never be attached to the application it describes
    description: 'synthesis-apply --verification records an already-produced admission verification against the applied result. A verification OF the applied result can only be produced after the application, and by then the candidate is consumed, so attaching it is refused. The two requirements exclude each other and the only way through is deleting the receipt and re-applying, which the command itself warns makes two applications indistinguishable from one. Issue #149''s proof matrix row ''verification failure after materialization'' therefore remains fixture-only, not because it was untested but because the path is unreachable.'
    protects:
      files:
        - cmd/awg/cmd_synthesis_apply.go
    related_invariants:
      - invariant.synthesis.declared_digest_must_equal_computed_content_digest
    evidence:
      - in scripts/synthesis-run-smoke.sh the applied worktree verifies scope_compliant via sensei verify-admission, but sensei synthesis-apply --verification then exits 6 (previously consumed), because the only command that attaches a verification is the one that performs the application
  - id: failure.runnercomposition.sealed_entry_opened_through_collectible_dirfd
    title: Sealed entry opened through a garbage-collectible directory descriptor
    severity: high
    description: The candidate artifact store read a bare descriptor number out of os.File.Fd() and handed it to openat(2). os.File closes its descriptor from a garbage-collection cleanup, and by the time openat ran nothing in any live frame referenced the store, so a collection landing in that window closed the descriptor mid-call and freed its number for reissue to an unrelated file. The entry was then resolved against a directory the store does not own.
    protects:
      files:
        - golang/architecture/runnercomposition/store_openat_unix.go
    required_tests:
      - golang/architecture/runnercomposition/store_openat_unix_test.go:TestOpenSealedEntryRefusesADescriptorTheStoreNoLongerOwns
    evidence:
      - '64,000 Get calls over freshly constructed store values under forced GC failed 54 times; one error was ''openat <digest>.json: not a directory'', i.e. the reissued number had landed on a regular file'
      - 'Surfaced as an intermittent CI failure in evaluatorcomposition (#214): a governed required-evaluator-unavailable terminal state produced by GC timing rather than by any evaluator observation'
    contract: A descriptor used to resolve a sealed entry must be held through a reference the store still owns for the duration of the call
  - id: failure.sensei.custody_decided_by_flag_while_config_named_another
    title: Custody decided by a flag while the project config named another endpoint
    severity: high
    description: 'sensei build, sensei preflight and sensei governance activate decided where they read or wrote from a flag default while .sensei/config.yaml named a different value they never consulted. The failure is silent and self-consistent: the build reports success and the closure report says PROVEN, and only another domain''s lost proof reveals it.'
    protects:
      files:
        - cmd/awg/endpoint_binding.go
    required_tests:
      - cmd/awg/endpoint_binding_test.go:TestRequireStoreURLAgreementRefusesAnEndpointTheConfigDoesNotName
    evidence:
      - A throwaway domain was published into a shared services store because an edited store_url was believed to have redirected the build; seven aw:repo tags landed on subjects another domain owned, the global marker rotated, and that domain lost its proof
    contract: A command must not act on an endpoint that disagrees with the project config the operator reads, unless the operator named it on the command line
  - id: failure.sensei.cheap_health_surface_read_green_while_graph_could_not_govern
    title: A cheap health surface read green while the graph could not govern
    severity: high
    description: Metadata reported freshness only while preflight checked freshness AND the closure proof AND the transaction certification. A store whose closure report vouched for a different publication therefore read 'authoritative, CURRENT' on the surface monitoring reaches for, and refused on the surface that governs. The repair is one evaluation answering two surfaces, never a second evaluation that agrees today.
    protects:
      files:
        - golang/server/metadata.go
    related_invariants:
      - invariant.sensei.repository_local_identity_is_repository_scoped
    required_tests:
      - golang/server/metadata_authority_test.go:TestMetadataAndPreflightCannotDisagreeAboutAuthority
    evidence:
      - 'Observed in issue #176: awareness_metadata reported authoritative/CURRENT for a publication awareness_preflight refused as non-authoritative'
  - id: failure.sensei.working_tree_facts_bound_to_head_and_reported_as_resolved
    title: Working-tree facts bound to HEAD and reported as resolved
    description: 'sensei infer-claims scanned the working tree, then stamped the commit ResolveRevision returned onto every claim and fact receipt with revision_status: resolved. Resolving HEAD establishes what the last commit is, not that the scan read that commit''s bytes, so on a dirty checkout the document asserted that facts citing files the commit does not contain were observed at it.'
    protects:
      files:
        - cmd/awg/cmd_infer_claims.go
    related_invariants:
      - awareness.closure_is_revision_scope_and_task_bound
    required_tests:
      - cmd/awg/cmd_infer_claims_test.go:TestInferClaimsRefusesToBindAWorkingTreeThatDiffersFromHEAD
    evidence:
      - 'globulario/sensei#216: on sensei-code at ed56eb10c647 with uncommitted work, infer-claims emitted 146 claims and 283 fact receipts citing internal/roles/, a package absent from the revision every one of them named as resolved.'
      - Every provenance field was individually true (real digest of real bytes, resolving revision, file present on disk); only the pairing of bytes to revision was false, so no caller could detect it.
  - id: failure.sensei.pattern_recipe_match_reported_as_sufficient_preflight_covera
    title: Pattern recipe match reported as sufficient preflight coverage
    description: computePreflightCoverage set coverage.sufficient = true on a strong-tier ImplementationPattern match alone, with zero direct anchors and zero indexed files. A pattern recognises the shape of code from task text; it never examines the files asked about. sufficient is the field that separates 'the graph looked and found nothing' from 'the graph never looked', so the second answer was published wearing the first one's clothes, and every consumer that trusts it -- risk classification, change-risk assessment, MCP output -- inherited the claim.
    protects:
      files:
        - golang/server/preflight.go
    related_invariants:
      - awareness.graph.compiled_context_not_authority
    required_tests:
      - golang/server/preflight_coverage_authority_test.go:TestPatternMatchAloneCannotManufactureSufficientCoverage
    evidence:
      - 'globulario/sensei#218: computePreflightCoverage(files=[internal/x/x.go], indexed=0, no anchors, one strong pattern) returned sufficient=true direct_anchor_count=0 indexed_file_count=0.'
      - 'The pattern needed no authority of its own to do it: MatchedImplementationPattern carries no promotion state, so the coverage computation could not have filtered an unpromoted match even if it tried.'
  - id: failure.sensei.examination_defined_as_governance_collapsing_emptyproven_int
    title: Examination defined as governance, collapsing EmptyProven into Absent
    description: Preflight incremented its indexed-file count only when a file produced direct anchors, so 'the graph examined this file' was defined as 'the graph governs this file'. indexed > 0 implied directCount > 0, which made a file the graph holds and governs by nothing indistinguishable from a file nobody ever analysed, and left computePreflightCoverage's indexed-but-no-rules branch unreachable through the RPC while its note described a state the data model could not produce.
    protects:
      files:
        - golang/server/preflight.go
    related_invariants:
      - invariant.sensei.incompleteness_and_coverage_are_explained_by_owner_projectio
    required_tests:
      - golang/server/preflight_examined_test.go:TestPreflightCoverageDistinguishesExaminedFromUnknown
    evidence:
      - 'globulario/sensei#220: computePreflightCoverage(files, indexed=1, no anchors) returns sufficient=true with ''1/1 file(s) indexed'', but no caller could ever pass indexed=1 with zero anchors.'
      - Measured over 39 commits in globulario/sensei-code, the routine tier whose condition is exactly EmptyProven qualified zero changes; the qualifying population was 'a file with an anchor, none of whose anchors governs it', not the designed one.
      - 'The state is reachable in a full build and not in a corpus-only seed: 18 of 36 symbol-indexed files in this repository''s generated code_symbols surface are not named by the authored corpus, and a SourceFile node is minted for each, while every SourceFile in the self seed carries an implements edge.'
  - id: failure.sensei.a_domain_s_compiled_knowledge_disappears_without_any_surface
    title: A domain's compiled knowledge disappears without any surface saying so
    description: The whole-graph marker proves the live store matches the last publication, and nothing measured a DOMAIN's slice against what was published for it. A store that lost a domain and a store that never held one are identical from the inside, so the loss stayed invisible until a write was refused — and the refusal named no repair, so the operator recorded the knowledge in a markdown file beside the graph instead of in it.
    protects:
      files:
        - golang/server/domain_slice.go
    related_invariants:
      - awareness.graph.compiled_context_not_authority
    required_tests:
      - golang/server/domain_slice_test.go:TestDomainSliceShortfallIsReportedWithItsRepair
    evidence:
      - 'globulario/sensei#221: the store serving github.com/globulario/services held 6 triples while its intact corpus rebuilt to 121338; the gap surfaced only when sensei propose failed closed.'
      - 'docs/pending-scars.md in that checkout is the first fossil of the side channel: knowledge the graph exists to hold, written beside it, with no proofs, no domain scoping and no way back in.'
  - id: failure.sensei.a_wall_clock_that_the_dominating_stage_cannot_observe_is_not
    title: A wall clock that the dominating stage cannot observe is not a ceiling
    description: 'factextract.Extract took no context, so a caller enforcing a ceiling bounded only the stages around it. Measured on this repository, a 20-second ceiling produced a 122-second run: the AST pass finished inside the window and the semantic package load, which holds the context but shells out to the Go toolchain and type-checks the module, carried on past the deadline it was given. A run that crossed its ceiling could still report itself completed, which is a ceiling the receipt claims was enforced.'
    protects:
      files:
        - golang/architecture/factextract/invariants.go
    related_invariants:
      - awareness.graph.compiled_context_not_authority
    required_tests:
      - golang/architecture/factextract/extract_context_test.go:TestExtractContextAbandonsTheSemanticStageAtTheCeiling
    evidence:
      - 'globulario/sensei#131 world 1: self-evaluation could not be run under a budget; before the fix, ceilings of 20s and 60s both produced 2m2s runs with identical output.'
      - After the fix the same ceilings bind exactly (20s -> 20s, 45s -> 45s), and the document carries blocking limitations naming the abandoned stage instead of arriving late and complete.
  - id: failure.sensei.derived_claims_about_unqualified_identifiers_become_unanswer
    title: Derived claims about unqualified identifiers become unanswerable blocking questions
    description: 'Claim derivation accepted any fact subject, including bare identifiers that name nothing outside one function body. An unsupported claim becomes an OpenQuestion, an unanswered OpenQuestion blocks closure, and closure gates admission — so implementation trivia became a question nobody could answer standing in front of a bounded change. The bare EXPORTED case is the same defect: invariantWriteTarget records a selector write as its final segment only, so report.Authority.State and an unrelated status.State both arrive as the subject State, conflating writers across files into one claim.'
    protects:
      files:
        - golang/architecture/inference/subject.go
    related_invariants:
      - awareness.architecture_claims_non_authoritative_until_promoted
    required_tests:
      - golang/architecture/inference/subject_test.go:TestArchitecturalSubject
    evidence:
      - 'globulario/sensei#230: a three-file modify task ran 242 static probes, completed none, and stopped on ''which evidence establishes: seen has_observed_writer_set <13 symbols>'' — seen being a local variable, with 13 unrelated files pulled into the scope.'
      - 'Measured in this repository''s own derived corpus: of 14,477 distinct claim subjects, 4,458 are bare unqualified names (scope, cred, digA, subParts, graphProj).'
  - id: failure.sensei.an_unreachable_graph_endpoint_reported_as_an_empty_or_non_au
    title: An unreachable graph endpoint reported as an empty or non-authoritative graph
    description: 'synthesis-run composed workspace identity against a graph endpoint and, when nothing was serving it, reported the composed absence: workspace identity partial, COVERAGE_STATE_EMPTY, next step ''rebuild or reload the graph''. The graph was healthy and had simply never been asked, so the prescribed repair was a full republication that changes nothing. gRPC dials lazily, so the caller checking only the dial error saw no failure; the transport error arrives on the first RPC.'
    protects:
      files:
        - cmd/awg/synthesis_run_identity.go
    related_invariants:
      - awareness.store_unavailable_explicit
    required_tests:
      - cmd/awg/synthesis_run_addr_test.go:TestUnreachableGraphEndpointIsReportedAsUnreachable
    evidence:
      - 'globulario/sensei#231: sensei_workspace_status against the repository''s configured endpoint reported composition_state complete and COVERAGE_STATE_SUFFICIENT at the same moment synthesis-run reported EMPTY against a port nothing was serving.'
  - id: failure.sensei.an_unanswerable_evidence_question_blocks_closure_on_a_self_e
    title: An unanswerable evidence question blocks closure on a self-evidenced claim
    description: Question generation escalated evidence blockers regardless of whether anyone could answer them. For a mechanically derived observed claim whose every premise is a source-backed fact with a resolved digest and line range, the only possible answer is 'read the source the extractor already read' — and the unanswered question blocks closure, which gates admission. The task is then stopped by a demand that cannot be met.
    protects:
      files:
        - golang/architecture/questiongen/questiongen.go
    related_invariants:
      - awareness.architecture_claims_non_authoritative_until_promoted
    required_tests:
      - golang/architecture/questiongen/self_evidenced_test.go:TestQuestionIsNotRaisedWhenTheClaimCarriesItsOwnEvidence
    evidence:
      - 'globulario/sensei#230: a three-file modify task ran 242 static probes, completed none, and stopped on provide_external_evidence for a claim whose premises were already source-backed observations.'
      - taskcontrol.selectNextAction falls through to advance_convergence when no question is available, so declining to raise one does not leave the task without an action — verified in golang/architecture/taskcontrol/project.go.
  - id: failure.sensei.a_repository_outside_the_observation_surface_reports_as_empt
    title: A repository outside the observation surface reports as empty rather than unreadable
    description: Fact extraction reads .go files in both its semantic and AST passes. Run over a repository written in another language it returned an empty report whose only note was a non-blocking Go module-load message, so 'I cannot see this language' was indistinguishable from 'I looked and there is nothing to say'. An evaluation calibrating against such a repository would measure the surface while believing it measured the reasoning.
    protects:
      files:
        - golang/architecture/factextract/invariants.go
    related_invariants:
      - awareness.store_unavailable_explicit
    required_tests:
      - golang/architecture/factextract/observation_surface_test.go:TestARepositoryOutsideTheObservationSurfaceSaysSo
    evidence:
      - 'globulario/sensei#131 world 3: sqlite/sqlite at depth 1 — 315 C files, 0 facts, 0 candidates, 0 authority surfaces, and no blocking limitation.'
  - id: failure.sensei.a_governed_decision_is_recorded_on_the_ledger_but_the_projec
    title: A governed decision is recorded on the ledger but the projection that acts on it never reads it
    protects:
      files:
        - golang/architecture/taskcontrol/project.go
    required_tests:
      - golang/architecture/taskcontrol/disposition_test.go:TestDismissedQuestionStopsDemandingEvidence
    evidence:
      - 'sensei#230: an architect dismissal recorded through questiondisposition (terminal dismissed state, NextNone) left taskcontrol.classifyQuestion classifying the question active_unresolved forever, because classifyQuestion read only the dialogue document status and nothing carried the ledger decision into the projection'
    contract: A decision recorded through a governed mutation path, with an actor, a rationale and a verified receipt, is authority over the state it decides; a projection that presents the next action must read it, or it presents a demand the governed decision already withdrew
  - id: failure.sensei.an_observation_anchors_a_field_to_the_file_its_struct_was_de
    title: An observation anchors a field to the file its struct was declared in, not the file the field is in
    protects:
      files:
        - golang/architecture/gosemantics/extract.go
    required_tests:
      - golang/architecture/gosemantics/field_anchor_test.go:TestStructFieldObservationsAnchorToTheirOwnFile
    evidence:
      - 'sensei#131 evidence-resolvability pass: 74 observations from data_shape_extractor cited lines past the end of the file they named, including golang/architecture/authority/model.go (118 lines) cited at lines 126-140. Cause: type aliases — the alias declaration supplies the file while the aliased struct''s fields supply the line from another package''s longer file'
      - The extractor already emitted 74 'line N unavailable' limitations; the count was visible for a long time but nothing compared an anchor against the file it named, so the cause was never located
    contract: An evidence anchor names the file and line where the observed thing is actually declared; a composed anchor that takes the file from one declaration and the line from another names a location that need not exist
  - id: failure.sensei.a_reader_accepts_a_resolved_status_as_proof_of_the_evidence
    title: A reader accepts a resolved status as proof of the evidence the status describes
    protects:
      files:
        - golang/architecture/inference/binding.go
    required_tests:
      - golang/architecture/inference/premise_binding_consistency_test.go:TestReadersAgreeOnWhetherAPremiseIsPinned
    evidence:
      - 'Audit of the source-digest owner: architecture.ValidateFact accepts source_digest_status=resolved carrying an empty or malformed SourceDigest. inference.statusForPremises read the status alone and promoted such a premise to StatusSupported on an uncommitted tree, while maintenance.VerifySourceReceipt, which reads the digest, called the same fact unknown'
      - 'The inference package''s own test fixture encoded the defect: it declared source_digest_status resolved beside the placeholder digest string ''digest'', and the supported-claim assertion passed on the strength of the status'
    contract: A status field reports what a check concluded; the artifact it describes is the evidence. A reader that accepts the status without the artifact treats an unpinned premise as pinned, and two readers of the same fact then disagree
  - id: failure.sensei.a_scope_filter_checks_one_of_the_two_places_a_fact_records_w
    title: A scope filter checks one of the two places a fact records where it belongs
    protects:
      files:
        - golang/architecture/howextract/compose.go
    required_tests:
      - golang/architecture/howextract/scope_filter_test.go:TestExcludedPathsAreFilteredEvenWithoutAnEvidenceAnchor
    evidence:
      - 'Audit of the scope-receipt owner: howextract/compose.go filtered on Evidence.SourceFile only, guarded by SourceFile != "". The generated-artifact fact carries no anchor because a directory is not a source file, and names docs/awareness/generated solely in Scope.Files — so it survived an extraction excluding docs/, while the receipt reported the scope as enforced'
      - Reproduced on main at 57ec787e with an in-scope baseline that still produced observations, so the failure was attributable to the filter rather than to the fixture
    contract: A bounded extraction's receipt asserts that the declared scope was enforced. A fact records its location in both the evidence anchor and the scope, so a filter reading only one of them lets a fact whose location lives in the other survive a run that excluded it
  - id: failure.a_frozen_benchmark_run_that_binds_only_target_code_is_replay
    title: A frozen benchmark run that binds only target code is replayed under different authority and reported as comparable
    description: FreezeReceipt bound the target repository (revisions, tree digests, history) and the freeze policy, but nothing about the authority that governed the run. Replaying a frozen workspace later re-ran whatever seed, authored corpus and Sensei revision happened to be installed then, against the same frozen code, and the numbers were reported as if the only variable was the system under test.
    protects:
      files:
        - golang/architecture/benchmark/benchmark.go
    related_invariants:
      - invariant.workspace_drift_is_evidence_about_the_workspace_never_retroa
    required_tests:
      - golang/architecture/benchmark/authority_state_test.go:TestVerifyAuthorityStateDetectsEachDrift
    evidence:
      - 'R2 (#164) A0 came back INCOMPLETE: the R1 pilot environment (frozen R1 f8a4e7639071, B 9/9 vs E 5/9 across 9 pairs) could not be reproduced because the freeze captured code, not authority state. Capturing the real repo now shows the drift the receipt could not see: seed built at b2bd6b85 while HEAD is d1cb6bab, and a dirty tree that makes the recorded revision not identify the code that ran.'
    contract: A benchmark freeze receipt must bind the Sensei authority that governed the run — revision, seed digest, authored-corpus digest, build-transaction stamp — and a replay may be reported as comparable only when an independently observed authority equals the bound one. Absence of a binding is a typed verdict, never a match.
  - id: failure.a_byte_comparison_re_admits_the_clock_that_the_semantic_dige
    title: A byte comparison re-admits the clock that the semantic digest deliberately excluded
    description: VerificationRecordDigest excludes ObservedAt so an idempotent re-record is recognised as the same fact, but the synthesis-record-verification conflict check compared raw JSON bytes, which carry ObservedAt. Two recordings of identical evidence separated by one second were reported as exitRecordConflict with the message 'two different statements cannot both be what was observed'.
    protects:
      files:
        - cmd/awg/cmd_synthesis_record_verification.go
    related_invariants:
      - invariant.synthesis.declared_digest_must_equal_computed_content_digest
    required_tests:
      - cmd/awg/cmd_synthesis_record_verification_test.go:TestRepeatedRecordingIsIdempotentAcrossAClockTick
    evidence:
      - 'TestRepeatedRecordingNeitherDuplicatesNorOverwrites passed locally and failed in CI (run 32523698608, exit 5) because the two recordings straddled a wall-clock second. The digest exclusion was already documented in golang/architecture/candidateapply/digest.go with this exact hazard named: letting the clock into the identity would make an idempotent re-record look like a second, different record.'
    contract: Where a type defines a semantic identity that excludes a provenance field, every equality decision about that type must use the semantic identity. Comparing serialized bytes re-admits the excluded field and turns provenance back into identity.
  - id: failure.a_fail_closed_gate_applied_to_one_output_format_exempts_the
    title: A fail-closed gate applied to one output format exempts the caller it exists to stop
    description: benchmark-status computed the replay-authority gate inside the --format text branch only. --format json and --format yaml returned the freeze data with exit 0 and no comparability verdict, so a drifted or unverifiable replay was machine-readable as though it were comparable — and --format json is precisely what a harness consumes, so the only caller the exit-3 refusal was written to stop was the one caller that never saw it.
    protects:
      files:
        - cmd/awg/cmd_benchmark_external.go
    related_invariants:
      - invariant.workspace_drift_is_evidence_about_the_workspace_never_retroa
    required_tests:
      - cmd/awg/cmd_benchmark_external_test.go:TestBenchmarkStatusReplayGateAppliesToEveryFormat
    evidence:
      - 'Found by the repository''s Codex PR review on PR #254 (P1) after the human-readable path had been tested and reported as implemented. The regression test fails without the shared gate with --format json exit = 0 and --format yaml exit = 0, want 3, while --format text passes — which is exactly how the hole stayed invisible.'
    contract: A refusal that exists to stop a machine consumer must be enforced on the paths a machine consumer uses. Where a command emits several formats, the gate is computed before the format is chosen and returns the same verdict for every one of them.
  - id: failure.an_idempotence_check_trusted_the_digest_a_stored_record_decl
    title: An idempotence check trusted the digest a stored record declared about itself
    description: The synthesis-record-verification idempotence check compared record_digest_sha256 as read from the stored record against the newly computed one. A record edited to say something else — a different admission verification status or binding — while retaining its original digest field was therefore accepted as an idempotent re-record, so the command reported success and left conflicting proof on disk.
    protects:
      files:
        - cmd/awg/cmd_synthesis_record_verification.go
    related_invariants:
      - invariant.synthesis.declared_digest_must_equal_computed_content_digest
    required_tests:
      - cmd/awg/cmd_synthesis_record_verification_test.go:TestRecordRefusesAStoredRecordWhoseDigestDoesNotDescribeIt
    evidence:
      - 'Found by the repository''s Codex PR review on PR #254 (P1) in the very commit that fixed the byte-comparison defect, and against the invariant that commit''s own scar had cited. The regression test tampers with admission_verification_status while leaving record_digest_sha256 intact; without recomputation the command exits 0 instead of 5.'
    contract: A digest read from a stored artifact is a value some earlier process wrote, not a fact about the bytes present now. Any decision that relies on it must recompute it from the artifact's current content first, and refuse when the declared and computed identities disagree.
  - id: failure.an_environment_observation_taken_after_the_tool_changed_the
    title: An environment observation taken after the tool changed the environment measures the tool
    description: 'Freeze captured the governing authority AFTER creating its temporary workspace. The dirty-tree observation runs git status --porcelain, so when the workspace lived inside the Sensei checkout the freeze''s own untracked scratch files were observed as uncommitted changes: a clean checkout was recorded SenseiTreeDirty=true and every later replay of that run was rejected as incomparable for a change nobody made.'
    protects:
      files:
        - golang/architecture/benchmark/benchmark.go
    related_invariants:
      - invariant.workspace_drift_is_evidence_about_the_workspace_never_retroa
    required_tests:
      - golang/architecture/benchmark/authority_state_test.go:TestFreezeDoesNotDirtyTheAuthorityWithItsOwnWorkspace
    evidence:
      - 'Found by the repository''s Codex PR review on PR #254 (P2). The regression test freezes into a workspace inside a clean fixture checkout; with capture ordered after workspace creation the recorded authority reports a dirty tree.'
    contract: An observation that characterises the environment a run happened in must be taken before the run mutates that environment. Otherwise the record describes the tool's own side effects and attributes them to the subject.
  - id: failure.a_failed_observation_was_recorded_as_a_negative_observation
    title: A failed observation was recorded as a negative observation
    description: CaptureAuthorityState ran git status --porcelain to record whether the governing checkout was clean and, when the command errored, left SenseiTreeDirty at its zero value while still reporting the capture bound. Two captures that had never established either tree's state could then compare equal and be reported as authority_match with Comparable=true.
    protects:
      files:
        - golang/architecture/benchmark/authority_state.go
    related_invariants:
      - awareness.missing_evidence_produces_unknown
    required_tests:
      - golang/architecture/benchmark/authority_state_test.go:TestCaptureAuthorityStateFailsClosedWhenTreeStateUnreadable
    evidence:
      - 'Found by the repository''s Codex PR review on PR #254 (P1), in the file whose own doc comment states that absent authority must be a state a reader can see rather than a zero value it has to infer. The regression test makes git status fail via an invalid status.showUntrackedFiles setting while rev-parse and ls-files still work; without the fix the capture reports bound instead of unavailable.'
    contract: Failing to observe a property and observing that property to be absent are different results and must be represented differently. A read that errors yields a typed unavailable state, never the falsy value the successful read would have produced.
  - id: failure.a_safety_gate_was_opt_in_while_the_documented_workflow_omitt
    title: A safety gate was opt-in while the documented workflow omitted the opt-in
    description: benchmark-status verified replay authority only when --sensei-repo was supplied, and the workflow in the bundled sensei-benchmark skill invokes benchmark-status without it. The documented evaluation route therefore returned uncertifiable numbers with exit 0 and no comparability verdict, which is the same machine-consumer hole the gate had just been written to close.
    protects:
      files:
        - cmd/awg/cmd_benchmark_external.go
    related_invariants:
      - invariant.workspace_drift_is_evidence_about_the_workspace_never_retroa
    required_tests:
      - cmd/awg/cmd_benchmark_external_test.go:TestBundledBenchmarkSkillDocumentsTheGatedStatusPath
    evidence:
      - 'Found by the repository''s Codex PR review on PR #254 (P1), citing the shipped skill''s own command line. Fixed by defaulting the flag to the current checkout so the gate is opt-out rather than opt-in; the regression fails with exit 0 instead of 3 when the default is empty.'
    contract: A gate that exists to stop an unsafe consumption must be enforced by default. When the canonical documented workflow can invoke the command without enabling it, the protection is absent exactly where operators were told to look.
  - id: failure.a_checkout_identity_was_recorded_as_proof_about_the_binary_t
    title: A checkout identity was recorded as proof about the binary that actually ran
    description: CaptureAuthorityState recorded the revision, authored-corpus digest and build-transaction stamp of whatever checkout --sensei-repo named, without establishing that this checkout produced the evaluator. A checkout advanced without rebuilding — the ordinary case — meant two captures could agree on every tree identity and be reported authority_match with Comparable=true while the runs executed different code.
    protects:
      files:
        - golang/architecture/benchmark/authority_state.go
    related_invariants:
      - invariant.sensei.evidence_receipts_are_validated_not_self_certified
    required_tests:
      - golang/architecture/benchmark/authority_state_test.go:TestVerifyAuthorityStateRefusesABuildNotFromTheRecordedCheckout
    evidence:
      - 'Found by the repository''s Codex PR review on PR #254 (P1). Demonstrated on the branch''s own end-to-end run: the binary built at 71f72c50 against a fixture checkout 753e2aad previously printed authority_match, and now reports executed_build_not_from_recorded_checkout. Go stamps vcs.revision into binaries built inside a repository; when that stamp is absent the state is recorded as unstamped and the replay is refused rather than assumed to match.'
    contract: An identity recorded for a checkout characterises that tree, never the executable built from some other tree. A run may be certified reproducible only when the running evaluator's own build provenance ties it to the checkout being recorded; absent provenance is a refusal, not a pass.
  - id: failure.a_threaded_outcome_was_silently_ignored_because_go_permits_a
    title: A threaded outcome was silently ignored because Go permits an unused parameter
    description: The WHY composer was changed to accept the observed model outcome instead of minting a status from configuration. The edit that was supposed to consume it silently failed to apply — gofmt had realigned the struct literal, so the text substitution did not match — and the composer kept writing the hardcoded disabled binding. The parameter was simply unused, which compiles, so the build and the deterministic tests stayed green while the model lane's result was discarded.
    protects:
      files:
        - golang/architecture/whyinvestigation/compose.go
    related_invariants:
      - invariant.synthesis.intelligence_may_explore_but_authority_is_deterministic
    required_tests:
      - golang/architecture/whyinvestigation/model_lane_test.go:TestModelAssistedRunRecordsItsOwnNondeterminism
    evidence:
      - 'Observed on the #256 implementation branch: the deterministic-preservation test passed BECAUSE the model outcome was ignored, and only the model-assisted assertion (model digest absence empty on a resolved run) exposed it. Both the model binding and the nondeterminism declaration had to be rewired by line position after the pattern-based edit reported success.'
    contract: 'Threading a value into a composer is not the same as the composer using it. Where a parameter replaces a previously hardcoded value, a test must observe the parameter changing the output, because the compiler will not: an unused function parameter is legal Go.'
  - id: failure.a_per_request_budget_applied_to_a_whole_multi_request_call_f
    title: A per-request budget applied to a whole multi-request call fails as a function of workload size
    description: awareness-mcp's --timeout is documented as a per-request gRPC timeout but was applied as the deadline for an entire tools/call. awareness_audit_diff issues an Impact and an EditCheck per file, so a one-file diff fitted inside a single request's budget and a two-file diff did not. The refusal surfaced as evaluator_unavailable, which from outside is indistinguishable from the change being bad, and a governed run that correctly refuses to accept over a Sensei refusal therefore ended on a defect in the harness.
    protects:
      files:
        - cmd/awareness-mcp/main.go
    related_invariants:
      - awareness.missing_evidence_produces_unknown
    required_tests:
      - cmd/awareness-mcp/main_test.go:TestMultiFileAuditIsNotStarvedByThePerRequestBudget
    evidence:
      - 'Reported in issue #260 as a deterministic cannot_verify on a two-file diff where each file passed alone and each returned in about five seconds — five seconds being the timeout value itself rather than evidence against a timeout. Confirmed in code: br.timeout appeared in exactly one place, the whole-call deadline, and never on an individual request.'
    contract: A timeout documented as bounding one request must be applied to one request. Using it as the ceiling for a call that issues many requests makes the call fail as a function of how much work it was given, and the refusal describes the subject rather than the budget.
  - id: failure.sensei.a_guarantee_relocated_to_one_call_site_silently_unbounds_its
    title: A guarantee relocated to one call site silently unbounds its siblings
    description: 'When a cross-cutting budget, check or guarantee is moved off a shared choke point onto one specific consumer, every other consumer of that choke point loses it with no signal at all — it compiles, it passes, and the loss is invisible until something stalls. Place the guarantee at the seam every consumer must pass through (here a client decorator applied in the constructor) so a consumer added later cannot forget what it never had to remember. Second recurrence of this class: see also the guarantee-verified-on-only-one-output-path scar from PR #254.'
    protects:
      files:
        - cmd/awareness-mcp/main.go
    required_tests:
      - cmd/awareness-mcp/main_test.go:TestSingleRequestToolIsBoundedByTheRequestBudget
    evidence:
      - 'PR #261: --timeout was moved from the JSON-RPC loop into a per-request context consumed only by the diff-audit checker; the other eight MCP tools (awareness_briefing, awareness_impact, awareness_edit_check and the rest) then reached the backend with no per-request deadline at all, bounded only by the 2m whole-call ceiling. The first fix for #260 introduced a fresh instance of the very defect class it was fixing.'
    contract: --timeout is a per-request gRPC budget that bounds EVERY individual request a tool makes, not merely the requests of whichever consumer the budget was last wired into; --call-timeout separately bounds one whole tools/call.
  - id: failure.sensei.a_mechanically_manufactured_evaluation_population_reads_as_a
    title: A mechanically manufactured evaluation population reads as a real denominator
    description: 'The failure is not the wrong predicate rule; it is a measuring instrument deciding, from the data it is grading, what counts as a case. Whether a predicate may hold one object is a statement about the ontology and belongs outside the sampler, like the recall unit inventory. Two absences must also stay distinguishable: ''nothing disagreed'' and ''nobody declared what disagreement would look like'' are different facts, and collapsing them lets an undeclared ontology read as a clean bill of health.'
    protects:
      files:
        - golang/architecture/evalsample/candidates.go
    required_tests:
      - golang/architecture/evalsample/sample_test.go:TestAMultiValuedRelationIsNotADisagreement
    evidence:
      - 'PR for #131 step 9: the contradiction lane first treated every repeated (subject, predicate) carrying differing objects as a disagreement. Run against world 1 it produced 23,641 ''contradiction cases'', essentially all of them components legitimately depending on many things — a multi-valued relation, not a contradiction. The lane would have handed a human adjudicator thousands of non-questions while reporting a large, healthy-looking denominator.'
    contract: An evaluation sampler may select items; it may not invent the population it selects from. Where deciding what belongs in a population requires an ontological judgement, that judgement is a caller-supplied declaration, and its absence is a TYPED undrawn lane rather than a clean empty one.
  - id: failure.composed_claim_baked_its_lane_into_the_description_the_blind
    title: Composed claim baked its lane into the description the blinded view renders
    description: composedClaim formatted the counterexample Description as '[lane kind] text'. evalsample renders that Description verbatim as the blinded view's claim. The lane was already in the counterexample ID and therefore in the manifest subject_id, so revealing it in the view bought nothing and biased first-pass labeling. Found while assembling the Step 10 package, before the reference set was frozen, which is what kept it from becoming a section 2 correction that invalidates downstream scores.
    protects:
      files:
        - cmd/eval-arms/sample.go
    related_invariants:
      - invariant.a_blinded_adjudication_view_must_not_carry_provenance_the_ma
    required_tests:
      - cmd/eval-arms/sample_test.go:TestComposedClaimsReachTheSample
    evidence:
      - every sampled challenge item opened '[deterministic candidate_claim] ...' in sample/blind/world4_mutant_suite.challenge.json, so the adjudicator was told the producing lane before assigning a support label or usefulness rating
  - id: failure.count_preserving_graph_mutation_is_certified_as_authoritativ
    title: Count-preserving graph mutation is certified as authoritative
    description: Live-store freshness compared only the SeedBuild marker and the triple count, then reported 'live store matches expected validated graph artifact'. A mutation that deletes one real triple and inserts one unrelated triple preserves both signals, so the store drifts while decideRoute keeps reading AUTHORITY_VERDICT_AUTHORITATIVE and every briefing, preflight and admission decision downstream inherits it.
    protects:

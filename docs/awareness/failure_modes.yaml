    evidence: Phase 9.5 Checkpoint 2 handlers return partial projections as RPC success; proven by semantic-availability handler tests.

  - id: controlstate.client_supplied_class_treated_as_artifact_authority
    title: A client-supplied class was treated as artifact class authority
    severity: critical
    root_cause: |
      An RPC accepted a caller-supplied canonical class (or treated an index filter as class

    related_invariants:
      - controlstate.read_surfaces_must_be_structurally_non_mutating
    evidence: Phase 9.5 Checkpoint 2 handlers consume the read-only store interface; no inbound message carries a semantic verdict; proven by no-mutation tests.

  - id: controlstate.proto_field_renumbering_breaks_existing_consumers
    title: Protobuf field renumbering broke existing consumers
    severity: critical
    root_cause: |
      A control-panel proto change renumbered, retyped, or removed an existing field (such as the
      Phase 9.6 BriefingResponse.feedback field 7) or reused an enum number, silently corrupting
      decoding for already-deployed clients.
    symptoms:

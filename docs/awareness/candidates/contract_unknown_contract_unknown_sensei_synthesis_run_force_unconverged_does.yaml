contract_unknown:
  - id: contract_unknown.sensei.synthesis_run_force_unconverged_does_not_bypass_the_coverage
    kind: contract_unknown
    title: synthesis-run --force-unconverged does not bypass the coverage-sufficiency precondition
    description: 'Live-ran the private eval repo''s new Mode E harness (awareness-graph-private/eval/multi-swe-bench/mode-e-synthesis.sh) end to end against a fresh, isolated Sensei server (fully isolated ports, no live system touched): sensei import --refresh -> prepare-change -> synthesis-run, driving a real claude subprocess, against a freshly onboarded synthetic Go repo (tinyrepo, one function, one test). The pipeline is mechanically sound through prepare-change. synthesis-run first refused correctly on an unconverged primary blocker; passing --force-unconverged (the harness''s documented escape hatch) got past that, then hit a second, separate, non-overridable precondition: cmd/awg/synthesis_run_identity.go composes workspace identity via workspacecontract.ComposeIdentity, whose deriveCompositionState requires CoverageState == COVERAGE_STATE_SUFFICIENT for CompositionComplete. sensei metadata against the isolated server confirmed Coverage state: thin (96 domain-scoped triples, 0 invariants/components/contracts -- exactly what a freshly-onboarded repo with no authored architecture will always report). --force-unconverged only bypasses tasksession control''s PrimaryBlocker check (cmd_synthesis_run.go step 3); it has no effect on the separate workspace-identity CompositionState gate (step 4), so this is not a flag-usage mistake -- there is currently no override path at all for coverage-insufficiency.'
    proposed_contract: 'This reconfirms and sharpens contract_unknown.sensei.o7_synthesisdriver_run_requires_a_pre_onboarded_repository_u (docs/awareness/candidates/contract_unknown_contract_unknown_sensei_o7_synthesisdriver_run_requires_a_pr.yaml): the missing prerequisite is now proven specific and reproducible -- COVERAGE_STATE_SUFFICIENT on the target domain, not merely "some served graph authority". sensei synthesis-run should either (a) document coverage-sufficiency as a hard, currently non-overridable O7 precondition alongside the existing --force-unconverged-covered primary-blocker precondition, or (b) offer an explicit, separately-named override (e.g. --force-thin-coverage) for governed benchmark/bootstrap contexts that knowingly accept a thin-coverage graph, so the two distinct preconditions are not conflated under one flag.'
    source_files:
      - cmd/awg/cmd_synthesis_run.go
      - cmd/awg/synthesis_run_identity.go
      - golang/architecture/workspacecontract/identity.go
    evidence:
      - 'sensei metadata --domain github.com/example/tinyrepo against the isolated server reported Coverage state: thin'
      - sensei synthesis-run --force-unconverged still exited 1 with "workspace identity is partial, not complete" after the primary-blocker check was bypassed
    domain: github.com/globulario/sensei

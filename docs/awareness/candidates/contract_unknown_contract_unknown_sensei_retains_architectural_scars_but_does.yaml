contract_unknown:
  - id: contract_unknown.sensei_retains_architectural_scars_but_does_not_surface_them
    kind: contract_unknown
    title: Sensei retains architectural scars but does not surface them while a structurally similar change is being authored
    description: 'Retention and prospective retrieval are separate capabilities. The graph''s retained knowledge was accurate and specific; it was simply never projected into the authoring sites about to repeat it. A candidate metric worth defining BEFORE it is measured: of the known applicable failure modes, how many are surfaced before or during the change that would repeat them. That number, rather than another precision percentage, may be what governs how far agent autonomy can safely extend.'
    proposed_contract: A known applicable failure mode should be surfaced before or during the change that would repeat it, not only discovered afterwards in review. Retention and prospective retrieval are different capabilities, and only the second constrains authoring.
    evidence:
      - 'PR #254 recorded failure.an_idempotence_check_trusted_the_digest_a_stored_record_decl with its own required test. In PR #258, written afterwards, the same law was violated seven more times in structurally different places — trusted stored digests in the scorer, a checkout bound as proof about the running binary, an arm naming itself model_disabled while a model was bound, a bridge selecting its model from the environment rather than the request, a prompt digest not covering the schema it sent, an acquisition frozen before its baseline finished, and a reference set allowed to carry labels with no frozen identity. Every one was caught by the repository''s independent PR reviewer, none by awareness. Preflight over the edited files returned PREFLIGHT_STATUS_DEGRADED with CONFIDENCE_LOW and the explicit note that the graph has no facts about those files.'

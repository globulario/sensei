contract_unknown:
  - id: contract_unknown.services.protects_files_required_test_on_invariants_sometimes_cite_no
    kind: contract_unknown
    title: protects.files/required_test on invariants sometimes cite non-repo-relative targets (runtime paths, cross-repo ../ refs)
    description: 'sensei audit''s protection-coverage check flags 10 governed_relation_malformed_source findings in services'' docs/awareness/invariants.yaml and repository_artifact_authority_invariants.yaml. Two distinct patterns: (1) protects.files citing real but non-source-controlled runtime deployment paths (e.g. /var/lib/globular/etcd/member/snap/db, /var/lib/globular/workflows/release.apply.package.yaml) that will never resolve as repo files; (2) protects.files/required_test citing sibling-repo files via relative ../globular-installer/... paths from within the services repo''s own corpus. Both are WARN not FAIL, and both look like intentional documentation choices by whoever authored these invariants (the runtime paths and cross-repo paths are real and meaningful context), not typos -- but golang/architecture/protection''s NormalizePath validator has no sanctioned way to express either case, so they always show as malformed.'
    proposed_contract: Either (a) protects.files/required_test must be restricted to paths that resolve inside the authoring repo, and invariants needing to reference runtime-only paths or sibling-repo files should use a different, explicitly-non-validated field (e.g. a free-text 'related_paths' or 'external_context' list) instead of protects.files -- or (b) NormalizePath should gain an explicit, deliberately-scoped allowance for these two patterns (a recognized non-repo runtime-path prefix, and a recognized sibling-repo relative-path form) so they stop reading as malformed. Which of these is correct is a real open question, not something to guess at unilaterally.
    source_files:
      - golang/architecture/protection/structural.go
    evidence:
      - 'sensei audit --verbose on the combined sensei+services+Globular graph (186817 triples, 2026-08-02): 10 governed_relation_malformed_source findings, all citing either /var/lib/globular/... runtime paths or ../globular-installer/... cross-repo relative paths from services'' own invariants.yaml and repository_artifact_authority_invariants.yaml'
    domain: github.com/globulario/services

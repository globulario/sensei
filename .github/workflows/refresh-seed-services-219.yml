name: Refresh embedded seed for services PR 219

on:
  push:
    branches:
      - agent/refresh-seed-for-services-219

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/refresh-seed-for-services-219
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum

      - name: Regenerate canonical self seed
        run: scripts/build-awareness-graph-self.sh

      - name: Validate regenerated seed
        run: |
          scripts/build-awareness-graph-self.sh --check
          go test ./golang/server/... -count=1

      - name: Commit generated repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/awareness/generated golang/server/embeddata
          git rm .github/workflows/refresh-seed-services-219.yml
          git commit -m "chore(awareness): refresh embedded seed after Phase 10 merge"
          git push origin HEAD:agent/refresh-seed-for-services-219

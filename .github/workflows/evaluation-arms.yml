# Runs the landed evaluation arms of issue #131 at an exact revision and keeps
# their reports as artifacts.
#
# The arms were reachable only from Go tests, which print to a log nobody can
# compare. #131's completion evidence asks for reports that are reproducible and
# content-addressed; this produces them at a pinned head, together with an index
# naming every arm and world that did NOT run and why — an index listing only
# what worked would read as a complete protocol.
#
# Deliberately manual and path-triggered rather than on every push: this is a
# measurement, not a gate. It must never become a check that pressures anyone to
# make a number go up.
name: Evaluation arms

on:
  workflow_dispatch:
    inputs:
      captured_at:
        description: Explicit RFC3339 capture timestamp for the reports
        required: true
        default: "2026-01-01T00:00:00Z"
  push:
    branches:
      - main
    paths:
      # The harness itself...
      - "golang/architecture/evalharness/**"
      - "golang/architecture/evalmutant/**"
      - "cmd/eval-arms/**"
      - ".github/workflows/evaluation-arms.yml"
      # ...and the evaluators it measures. A change to the extraction or
      # composition path moves these numbers without touching a wrapper
      # package, and a measurement that only re-runs when its own harness is
      # edited would report yesterday's capability as today's.
      - "golang/architecture/howextract/**"
      - "golang/architecture/factextract/**"
      - "golang/architecture/gosemantics/**"
      - "golang/architecture/investigator/**"
      - "golang/architecture/whyinvestigation/**"
      - "golang/architecture/investigation/**"

permissions:
  contents: read

jobs:
  arms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve the capture timestamp
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          # The commit's own timestamp for a push, so a report is bound to the
          # revision it measured rather than to when a runner happened to start.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            captured="${{ inputs.captured_at }}"
          else
            captured="$(git show -s --format=%cI "${GITHUB_SHA}")"
          fi
          echo "captured_at=${captured}" >> "$GITHUB_OUTPUT"

      - name: Run the landed evaluation arms
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/eval-arms \
            --out "${RUNNER_TEMP}/eval-arms" \
            --captured-at "${{ steps.capture.outputs.captured_at }}" \
            | tee "${RUNNER_TEMP}/eval-arms-summary.txt"

      - name: Prove the reports replay identically
        shell: bash
        run: |
          set -euo pipefail
          # Determinism is a completion criterion of #131, so it is checked here
          # rather than asserted: the same revision and the same capture
          # timestamp must produce byte-identical reports.
          go run ./cmd/eval-arms \
            --out "${RUNNER_TEMP}/eval-arms-replay" \
            --captured-at "${{ steps.capture.outputs.captured_at }}" >/dev/null
          # SEMANTIC reports only. run_envelope.json carries elapsed time and
          # memory, which must differ between runs — comparing it would turn
          # this check into a benchmark of the scheduler, which is exactly the
          # confusion the envelope was split out to prevent. index.json names
          # the envelope and is likewise excluded.
          for report in "${RUNNER_TEMP}"/eval-arms/*.json; do
            name="$(basename "$report")"
            case "$name" in
              index.json|run_envelope.json) continue ;;
            esac
            if ! cmp -s "$report" "${RUNNER_TEMP}/eval-arms-replay/${name}"; then
              echo "::error::${name} is not reproducible: a replay at the same revision produced different bytes"
              exit 1
            fi
            echo "  ${name} replayed byte-identically"
          done
          # And the envelope must NOT be identical-by-accident-of-checking: it is
          # never compared, so nothing here can quietly start depending on it.
          echo "run envelope excluded from replay identity by construction"

      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-arms-reports
          path: |
            ${{ runner.temp }}/eval-arms/*.json
            ${{ runner.temp }}/eval-arms-summary.txt
            # The trees the run measured, kept beside the reports describing
            # them: a report about a subject nobody can inspect afterwards
            # cannot be checked by the next reader.
            ${{ runner.temp }}/eval-arms/mutants/**
          if-no-files-found: error

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Evaluation arms — issue #131"
            echo
            echo '```text'
            cat "${RUNNER_TEMP}/eval-arms-summary.txt"
            echo '```'
            echo
            echo "Reports are content-addressed; the index names every arm and world that did not run and why."
          } >> "$GITHUB_STEP_SUMMARY"

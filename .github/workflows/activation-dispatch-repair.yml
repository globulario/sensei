name: Activation dispatch repair

on:
  push:
    branches: [agent/sensei-full-activation]
    paths:
      - .github/workflows/activation-dispatch-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sensei-full-activation
          fetch-depth: 0

      - name: Add missing Phase 10 dispatch and proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("cmd/awg/main.go")
          text = path.read_text()
          needle = '''\tcase "evidence":
          \t\treturn runEvidence(args)
          \tcase "resolve":
          '''
          replacement = '''\tcase "evidence":
          \t\treturn runEvidence(args)
          \tcase "investigate":
          \t\treturn runInvestigate(args)
          \tcase "candidates":
          \t\treturn runCandidates(args)
          \tcase "resolve":
          '''
          if replacement in text:
              pass
          elif needle in text:
              path.write_text(text.replace(needle, replacement, 1))
          else:
              raise SystemExit("anchored evidence/resolve dispatch block not found")
          PY

          cat > cmd/awg/main_phase10_dispatch_test.go <<'EOF'
          // SPDX-License-Identifier: AGPL-3.0-only

          package main

          import "testing"

          func TestDispatchExposesPhase10Investigation(t *testing.T) {
          	if got := dispatch("investigate", []string{"--help"}); got != 0 {
          		t.Fatalf("dispatch investigate --help exit=%d, want 0", got)
          	}
          }

          func TestDispatchExposesPhase10CandidateReview(t *testing.T) {
          	if got := dispatch("candidates", []string{"--help"}); got != 0 {
          		t.Fatalf("dispatch candidates --help exit=%d, want 0", got)
          	}
          }
          EOF

          gofmt -w cmd/awg/main.go cmd/awg/main_phase10_dispatch_test.go
          go test ./cmd/awg -run 'TestDispatchExposesPhase10' -count=1
          git rm .github/workflows/activation-dispatch-repair.yml

      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cmd/awg/main.go cmd/awg/main_phase10_dispatch_test.go
          git commit -m "fix(activation): expose Phase 10 CLI surfaces"
          git push origin HEAD:agent/sensei-full-activation

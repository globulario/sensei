name: ARCHER O5B repair

on:
  pull_request:
    branches: ['**']

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 138
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum
      - name: Format package and regenerate import graph
        run: |
          set -euo pipefail
          gofmt -w golang/architecture/candidateapply/*.go
          make import-graph
          git rm .github/workflows/o5b-repair.yml
      - name: Publish clean O5B head
        run: |
          git config user.name "sensei-archer-o5b"
          git config user.email "sensei-archer-o5b@users.noreply.github.com"
          git add -A
          git commit -m "chore(archer): format O5B candidate application"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

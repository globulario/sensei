name: O7 test formatting

on:
  push:
    branches:
      - archer/o7-bounded-synthesis-driver

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archer/o7-bounded-synthesis-driver
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Format tests and refresh imports
        shell: bash
        run: |
          gofmt -w golang/architecture/synthesisdriver/*.go
          make import-graph
          rm -f .github/workflows/o7-format-tests.yml .github/o7-format-tests-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(archer): format O7 proofs and refresh import graph'
          git push origin HEAD:archer/o7-bounded-synthesis-driver

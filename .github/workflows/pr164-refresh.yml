name: PR164 branch refresh

on:
  push:
    branches:
      - agent/interpretation-closure

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/interpretation-closure
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Apply authority integration edits
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # O7 independently binds the returned receipt to the exact task closure.
          replace_once(
              'golang/architecture/synthesisdriver/driver.go',
              '''\t\t\t\tstate.Session.GraphAuthorityDigestSHA256,\n\t\t\t); err != nil {''',
              '''\t\t\t\tstate.Session.GraphAuthorityDigestSHA256,\n\t\t\t\tstate.Session.ClosureDigestSHA256,\n\t\t\t); err != nil {''',
          )

          # Production authority: challenge-plan identity is recomputed from queries,
          # and runtime owns evidence references/results.
          p = Path('golang/architecture/synthesisdriver/closure_report_authority.go')
          text = p.read_text()
          text = text.replace(
              '''type ClosureReportAuthorityConfig struct {\n\tReport   closure.Report\n\tGoProbes []interpretationclosure.GoProbe\n}''',
              '''type ClosureReportAuthorityConfig struct {\n\tReport                    closure.Report\n\tGoProbes                  []interpretationclosure.GoProbe\n\tChallengePlanDigestSHA256 string\n}''',
          )
          text = text.replace(
              '''\treport       closure.Report\n\treportDigest string\n\tgoProbes     []interpretationclosure.GoProbe''',
              '''\treport              closure.Report\n\treportDigest        string\n\tgoProbes            []interpretationclosure.GoProbe\n\tchallengePlanDigest string''',
          )
          old_ctor = '''\tprobes := append([]interpretationclosure.GoProbe(nil), config.GoProbes...)\n\treturn &ClosureReportAuthority{report: config.Report, reportDigest: digest, goProbes: probes}, nil'''
          new_ctor = '''\tprobes := append([]interpretationclosure.GoProbe(nil), config.GoProbes...)\n\tchallengeDigest := ""\n\tif len(probes) != 0 {\n\t\tcomputed, err := interpretationclosure.ChallengePlanDigest(interpretationclosure.ChallengePlan{\n\t\t\tSchemaVersion: interpretationclosure.ChallengePlanSchemaVersion,\n\t\t\tGoProbes:      probes,\n\t\t})\n\t\tif err != nil {\n\t\t\treturn nil, fmt.Errorf("synthesisdriver: validate interpretation challenge plan: %w", err)\n\t\t}\n\t\tif config.ChallengePlanDigestSHA256 != "" && config.ChallengePlanDigestSHA256 != computed {\n\t\t\treturn nil, fmt.Errorf("synthesisdriver: interpretation challenge plan digest %q does not match recomputed %q", config.ChallengePlanDigestSHA256, computed)\n\t\t}\n\t\tchallengeDigest = computed\n\t} else if config.ChallengePlanDigestSHA256 != "" {\n\t\treturn nil, fmt.Errorf("synthesisdriver: interpretation challenge digest was supplied without any challenge probes")\n\t}\n\treturn &ClosureReportAuthority{report: config.Report, reportDigest: digest, goProbes: probes, challengePlanDigest: challengeDigest}, nil'''
          if old_ctor not in text:
              raise SystemExit('closure_report_authority constructor pattern not found')
          text = text.replace(old_ctor, new_ctor, 1)
          old_go = '''\t\tgoFindings, err := interpretationclosure.CheckGoTruth(ctx, request.RepositoryRoot, a.goProbes)\n\t\tif err != nil {\n\t\t\treturn nil, fmt.Errorf("synthesisdriver: execute Go interpretation challenge: %w", err)\n\t\t}\n\t\tfindings = append(findings, goFindings...)'''
          new_go = '''\t\tprobes := append([]interpretationclosure.GoProbe(nil), a.goProbes...)\n\t\tfor i := range probes {\n\t\t\tprobes[i].EvidenceReferences = []string{\n\t\t\t\t"challenge-plan:" + a.challengePlanDigest,\n\t\t\t\t"repository-revision:" + request.Session.BaseRevision,\n\t\t\t}\n\t\t}\n\t\tgoFindings := interpretationclosure.CheckGoTruth(ctx, request.RepositoryRoot, probes)\n\t\tfindings = append(findings, goFindings...)'''
          if old_go not in text:
              raise SystemExit('closure_report_authority Go check pattern not found')
          text = text.replace(old_go, new_go, 1)
          text = text.replace(
              '''interpretationclosure.UnknownTruth(\n\t\t\tclaimID,\n\t\t\t"unsupported",\n\t\t\t"no deterministic repository checker or canonical claim match is available for this governing invariant",\n\t\t)''',
              '''interpretationclosure.UnknownTruth(\n\t\t\tclaimID,\n\t\t\t"unknown",\n\t\t\t"no_deterministic_checker",\n\t\t\t"no deterministic repository checker or canonical claim match is available for this governing invariant",\n\t\t)''',
          )
          p.write_text(text)

          # Challenge plans cannot author evidence references. Runtime adds them.
          p = Path('golang/architecture/interpretationclosure/go_checker.go')
          text = p.read_text().replace(
              'EvidenceReferences []string    `json:"evidence_references,omitempty"`',
              'EvidenceReferences []string    `json:"-"`',
          )
          p.write_text(text)

          # Every existing O7 test harness that supplies an interpretation provider
          # must also explicitly supply the test-only authority capability.
          for p in Path('golang/architecture/synthesisdriver').glob('*_test.go'):
              text = p.read_text()
              if 'InterpretationProvider:' not in text:
                  continue
              lines = text.splitlines(True)
              out = []
              for i, line in enumerate(lines):
                  out.append(line)
                  if 'InterpretationProvider:' in line:
                      window = ''.join(lines[i+1:i+4])
                      if 'InterpretationAuthority:' not in window:
                          indent = line[:len(line)-len(line.lstrip())]
                          out.append(indent + 'InterpretationAuthority: testGoverningInterpretationAuthority(),\n')
              p.write_text(''.join(out))

          # O1 tests must use the real promotion constructor for ordinary fixtures.
          # The digest-integrity adversarial case intentionally forges only the
          # package-private marker so the lower digest guard remains independently
          # tested behind the authority guard.
          p = Path('golang/architecture/synthesis/transition_test.go')
          text = p.read_text()
          text, count = re.subn(
              r'mustTransition\(t, ([A-Za-z_][A-Za-z0-9_]*), RecordInterpretationCommand\{Interpretation: interp\}\)',
              r'mustTransition(t, \1, testCertifiedInterpretationCommand(t, \1, interp))',
              text,
          )
          if count == 0:
              raise SystemExit('no synthesis RecordInterpretationCommand fixture migrated')
          p.write_text(text)

          p = Path('golang/architecture/synthesis/digest_integrity_test.go')
          text = p.read_text()
          text = text.replace(
              'mustTransition(t, planningSeed, RecordInterpretationCommand{Interpretation: interp})',
              'mustTransition(t, planningSeed, testCertifiedInterpretationCommand(t, planningSeed, interp))',
              1,
          )
          text = text.replace(
              'RecordInterpretationCommand{Interpretation: tamperedInterpretation}',
              'RecordInterpretationCommand{Interpretation: tamperedInterpretation, closureReceiptDigestSHA256: zeroDigest}',
              1,
          )
          p.write_text(text)

          # providerport fixture drivers also cross O1 through the certified constructor.
          p = Path('golang/architecture/providerport/mapping_test.go')
          text = p.read_text().replace(
              'synthesis.Transition(state, synthesis.RecordInterpretationCommand{Interpretation: interp})',
              'synthesis.Transition(state, testCertifiedInterpretationCommand(t, state, interp))',
              1,
          )
          text = text.replace(
              'synthesis.Transition(freshCreated, synthesis.RecordInterpretationCommand{Interpretation: interp2})',
              'synthesis.Transition(freshCreated, testCertifiedInterpretationCommand(t, freshCreated, interp2))',
              1,
          )
          old_transition_test = '''\tcmd, err := MapToCommand(state, request, result, "")\n\tif err != nil {\n\t\tt.Fatalf("MapToCommand: %v", err)\n\t}\n\tnext, events, err := synthesis.Transition(state, cmd)\n\tif err != nil {\n\t\tt.Fatalf("synthesis.Transition rejected the mapped command: %v", err)\n\t}'''
          new_transition_test = '''\taccepted, err := MapInterpretationCandidate(state, request, result)\n\tif err != nil {\n\t\tt.Fatalf("MapInterpretationCandidate: %v", err)\n\t}\n\tcmd := testCertifiedInterpretationCommand(t, state, accepted)\n\tnext, events, err := synthesis.Transition(state, cmd)\n\tif err != nil {\n\t\tt.Fatalf("synthesis.Transition rejected the certified command: %v", err)\n\t}'''
          if old_transition_test not in text:
              raise SystemExit('providerport transition integration test pattern not found')
          text = text.replace(old_transition_test, new_transition_test, 1)
          p.write_text(text)

          # Production CLI composes the authority from the exact closure report and
          # an optional query-only challenge sidecar.
          p = Path('cmd/awg/cmd_synthesis_run.go')
          text = p.read_text()
          text = text.replace(
              '"github.com/globulario/sensei/golang/architecture/evaluatorcomposition"\n',
              '"github.com/globulario/sensei/golang/architecture/evaluatorcomposition"\n\t"github.com/globulario/sensei/golang/architecture/interpretationclosure"\n',
              1,
          )
          text = text.replace(
              '\tinterpretationPath := fs.String("interpretation", "", "path to an authored synthesis.Interpretation JSON file (required)")\n',
              '\tinterpretationPath := fs.String("interpretation", "", "path to an authored synthesis.Interpretation JSON file (required)")\n\tinterpretationChallengePath := fs.String("interpretation-challenge", "", "optional query-only interpretation challenge JSON; Go probes are executed against the bound checkout before O1 planning")\n',
              1,
          )
          anchor = '''\tclosureDigest, err := closureprotocol.SemanticDigest(closureReport)\n\tif err != nil {\n\t\tfmt.Fprintf(os.Stderr, "sensei synthesis-run: digest closure report: %v\\n", err)\n\t\treturn exitResolutionFailure\n\t}\n'''
          insertion = anchor + '''\n\t// Optional Gate-1 challenge input contains queries only. It cannot carry\n\t// supported/contradicted/authority outcomes; the production authority\n\t// executes these probes against absRepo and recomputes the plan digest.\n\tvar challengePlan interpretationclosure.ChallengePlan\n\tvar challengePlanDigest string\n\tif challengePath := strings.TrimSpace(*interpretationChallengePath); challengePath != "" {\n\t\tif !filepath.IsAbs(challengePath) {\n\t\t\tchallengePath = filepath.Join(absRepo, challengePath)\n\t\t}\n\t\tchallengePlan, challengePlanDigest, err = interpretationclosure.LoadChallengePlan(challengePath)\n\t\tif err != nil {\n\t\t\tfmt.Fprintf(os.Stderr, "sensei synthesis-run: load --interpretation-challenge: %v\\n", err)\n\t\t\treturn exitResolutionFailure\n\t\t}\n\t}\n\n\tinterpretationAuthority, err := synthesisdriver.NewClosureReportAuthority(synthesisdriver.ClosureReportAuthorityConfig{\n\t\tReport:                    closureReport,\n\t\tGoProbes:                  challengePlan.GoProbes,\n\t\tChallengePlanDigestSHA256: challengePlanDigest,\n\t})\n\tif err != nil {\n\t\tfmt.Fprintf(os.Stderr, "sensei synthesis-run: construct interpretation authority: %v\\n", err)\n\t\treturn exitResolutionFailure\n\t}\n'''
          if anchor not in text:
              raise SystemExit('cmd_synthesis_run closure anchor not found')
          text = text.replace(anchor, insertion, 1)
          text = text.replace(
              '\t\tInterpretationProvider: interpretationProvider,\n',
              '\t\tInterpretationProvider:  interpretationProvider,\n\t\tInterpretationAuthority: interpretationAuthority,\n',
              1,
          )
          p.write_text(text)

          # Avoid relying on a plane constant in a synthetic test fixture.
          p = Path('golang/architecture/synthesisdriver/closure_report_authority_test.go')
          text = p.read_text().replace('ArchitecturalPlane: architecture.PlaneObserved,', 'ArchitecturalPlane: "observed",')
          p.write_text(text)

          # Canonical and embedded O7 receipt schemas are one artifact. The source
          # schema changed earlier on this branch; copy it to the canonical docs
          # location so the drift guard remains meaningful.
          embedded = Path('golang/architecture/synthesisdriver/schemas/synthesisdriver-receipt-v1.schema.json')
          Path('docs/schemas/synthesisdriver/v1/synthesisdriver-receipt-v1.schema.json').write_text(embedded.read_text())
      - name: Format touched Go sources
        run: |
          gofmt -w \
            cmd/awg/cmd_synthesis_run.go \
            golang/architecture/interpretationclosure/*.go \
            golang/architecture/providerport/interpretation_candidate.go \
            golang/architecture/providerport/interpretation_closure_test.go \
            golang/architecture/providerport/mapping_test.go \
            golang/architecture/synthesis/*.go \
            golang/architecture/synthesisdriver/*.go
      - name: Run focused tests
        run: |
          go test ./golang/architecture/interpretationclosure ./golang/architecture/providerport ./golang/architecture/synthesis ./golang/architecture/synthesisdriver ./cmd/awg
      - name: Refresh generated import graph
        run: make import-graph
      - name: Commit branch refresh
        run: |
          git config user.name "sensei-pr164-bot"
          git config user.email "sensei-pr164-bot@users.noreply.github.com"
          git add cmd/awg/cmd_synthesis_run.go golang/architecture docs/schemas/synthesisdriver/v1/synthesisdriver-receipt-v1.schema.json docs/awareness/generated/awareness_graph_go_import_graph.yaml
          if git diff --cached --quiet; then
            echo "No refresh changes"
            exit 0
          fi
          git commit -m "wire interpretation closure into synthesis runtime"
          git push origin HEAD:agent/interpretation-closure

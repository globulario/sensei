name: O6 Windows native process tests

on:
  push:
    branches:
      - agent/o6-command-provider

permissions:
  contents: write

jobs:
  windows-native:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/o6-command-provider
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run command-provider tests natively
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./golang/architecture/commandprovider -count=1
          go test ./golang/architecture/providerport -count=1
          Remove-Item .github/workflows/o6-windows-native-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add golang/architecture/commandprovider .github/workflows/o6-windows-native-test.yml
          git commit -m 'test(commandprovider): prove Windows-native process-tree cleanup'
          git push origin HEAD:agent/o6-command-provider

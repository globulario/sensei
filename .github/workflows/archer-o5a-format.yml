name: ARCHER O5A source formatter

on:
  push:
    branches:
      - archer/o5a-admission-composition

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[o5a-format]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archer/o5a-admission-composition
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum

      - name: Format source and regenerate import graph
        run: |
          gofmt -w golang/architecture/admissioncomposition/*.go
          make import-graph

      - name: Publish helper-free formatted head
        run: |
          git config user.name "sensei-archer-o5a"
          git config user.email "sensei-archer-o5a@users.noreply.github.com"
          git rm -f \
            .github/workflows/archer-o5a-implement.yml \
            .github/workflows/archer-o5a-diagnose.yml \
            .github/workflows/archer-o5a-format.yml \
            .archer-o5a-trigger \
            .archer-o5a-diagnose-trigger \
            .archer-o5a-merge-trigger \
            .archer-o5a-format-trigger \
            .archer-o5a-format-merge-trigger
          git add -A
          git commit -m "chore(archer): format O5A composition package"
          git push origin HEAD:archer/o5a-admission-composition

name: Graph publication integration

on:
  push:
    branches: ['**']
    paths:
      - 'cmd/awg/cmd_build.go'
      - 'cmd/awg/cmd_build*_test.go'
      - 'cmd/awg/graph_publication_lock*.go'
      - 'golang/store/oxigraph/**'
      - 'golang/publication/**'
      - 'scripts/fetch-oxigraph.sh'
      - '.github/workflows/graph-publication-integration.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'cmd/awg/cmd_build.go'
      - 'cmd/awg/cmd_build*_test.go'
      - 'cmd/awg/graph_publication_lock*.go'
      - 'golang/store/oxigraph/**'
      - 'golang/publication/**'
      - 'scripts/fetch-oxigraph.sh'
      - '.github/workflows/graph-publication-integration.yml'

jobs:
  real-oxigraph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Sensei
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum

      - name: Install pinned Oxigraph
        run: scripts/fetch-oxigraph.sh 0.5.9

      - name: Prove staged publication against real Oxigraph
        run: |
          go test -tags=integration ./cmd/awg \
            -run '^TestIntegration_ScopedRepoPublication_RealOxigraph$' \
            -count=1 -timeout 5m

      # The adapter boundary is where representation loss lives, and in-process
      # fakes structurally cannot catch it. This seeds controlled good and
      # malformed terms into the pinned Oxigraph and asserts the lossless read
      # preserves term kind, datatype and language.
      # The -run filter is a NAME LIST, so a new integration test is silently
      # absent from CI until it is added here. That is the same failure as a
      # skip: a property proven locally and unproven on the runner.
      - name: Prove the publication adapter and authority snapshot
        run: |
          PATH="$PWD/bin:$PATH" go test -tags=integration ./cmd/awg \
            -run '^TestIntegration_(PublicationAdapterPreservesTerms|AuthoritySnapshotReadsOneWorld)_RealOxigraph$' \
            -count=1 -timeout 5m -v 2>&1 | tee adapter.log
          # A skip is NOT evidence. This job installs Oxigraph, so an
          # unavailable binary means the job is misconfigured, not that the
          # property holds.
          # Both tests must actually have run. A filter that matches nothing
          # produces a green step with no evidence in it.
          for want in PublicationAdapterPreservesTerms AuthoritySnapshotReadsOneWorld; do
            if ! grep -q -- "--- PASS: TestIntegration_${want}_RealOxigraph" adapter.log; then
              echo "::error::${want} did not run; the -run filter or the test name has drifted"
              exit 1
            fi
          done
          if grep -q -- '--- SKIP' adapter.log; then
            echo "::error::the adapter test SKIPPED in a job that installs Oxigraph; a skip is not evidence"
            exit 1
          fi

      # The named-graph carrier's only real-Oxigraph proofs. Under the
      # integration build tag they are invisible to `go test ./...`, and this
      # workflow ran ./cmd/awg only — so per-domain isolation and the
      # staging-visibility hazard were proven locally and UNPROVEN on the
      # runner. A relative graph name is not rejected by Oxigraph: it is
      # resolved against the server's base URL, so the endpoint silently becomes
      # part of the domain's identity. Exactly that class of defect merges green
      # while these proofs do not execute.
      - name: Prove per-domain named-graph publication
        run: |
          PATH="$PWD/bin:$PATH" go test -tags=integration ./golang/store/oxigraph \
            -run '^TestIntegration_(PublishingOneDomainLeavesAnotherUntouched|DefaultGraphContentIsAttributableToNoDomain|UnionReadsWouldExposeInFlightStagingGraphs|GraphIRIIsIndependentOfTheEndpoint)$' \
            -count=1 -timeout 5m -v 2>&1 | tee namedgraph.log
          # A filter that matches nothing produces a green step with no evidence
          # in it, so every proof must be seen to have run.
          for want in PublishingOneDomainLeavesAnotherUntouched DefaultGraphContentIsAttributableToNoDomain UnionReadsWouldExposeInFlightStagingGraphs GraphIRIIsIndependentOfTheEndpoint; do
            if ! grep -q -- "--- PASS: TestIntegration_${want}" namedgraph.log; then
              echo "::error::${want} did not run; the -run filter or the test name has drifted"
              exit 1
            fi
          done
          if grep -q -- '--- SKIP' namedgraph.log; then
            echo "::error::a named-graph proof SKIPPED in a job that installs Oxigraph; a skip is not evidence"
            exit 1
          fi

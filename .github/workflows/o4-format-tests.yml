name: O4 format tests

on:
  push:
    branches:
      - agent/governed-evaluator-composition-o4
    paths:
      - .github/workflows/o4-format-tests.yml
      - golang/architecture/evaluatorcomposition/*_test.go

permissions:
  contents: write

jobs:
  format-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/governed-evaluator-composition-o4
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum
      - name: Format tests
        run: |
          gofmt -w golang/architecture/evaluatorcomposition/*_test.go
          if git diff --quiet; then
            echo "No test formatting changes required."
            exit 0
          fi
          git config user.name "sensei-o4-maintenance"
          git config user.email "sensei-o4-maintenance@users.noreply.github.com"
          git add golang/architecture/evaluatorcomposition/*_test.go
          git commit -m "chore(synthesis): format O4 checkpoint-4 tests"
          git push origin HEAD:agent/governed-evaluator-composition-o4

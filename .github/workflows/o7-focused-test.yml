name: O7 focused tests

on:
  push:
    branches:
      - archer/o7-bounded-synthesis-driver

permissions:
  contents: write

jobs:
  focused:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archer/o7-bounded-synthesis-driver
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run O7 package tests
        shell: bash
        run: go test ./golang/architecture/synthesisdriver -v -count=1 -timeout 3m
      - name: Remove focused lane after success
        shell: bash
        run: |
          rm -f .github/workflows/o7-focused-test.yml .github/o7-focused-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(archer): remove successful O7 focused lane'
          git push origin HEAD:archer/o7-bounded-synthesis-driver

name: PR 126 terminal reason repair

on:
  push:
    branches:
      - agent/governed-evaluator-composition-o4
    paths:
      - .github/workflows/pr126-terminal-reason-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/governed-evaluator-composition-o4
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum
      - name: Repair terminal reason constants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('golang/architecture/evaluatorcomposition/complete_test.go')
          text = path.read_text()
          text = text.replace('synthesis.ReasonArchitectReview,', 'synthesis.ReasonArchitectReviewRequired,')
          text = text.replace('synthesis.ReasonAbort,', 'synthesis.ReasonExplicitlyAborted,')
          path.write_text(text)
          PY
          gofmt -w golang/architecture/evaluatorcomposition/complete_test.go
          git diff --check
          git config user.name "sensei-pr126-repair"
          git config user.email "sensei-pr126-repair@users.noreply.github.com"
          git add golang/architecture/evaluatorcomposition/complete_test.go
          git commit -m "fix(synthesis): use canonical terminal reason constants"
          git push origin HEAD:agent/governed-evaluator-composition-o4

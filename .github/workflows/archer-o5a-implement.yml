          func TestComposeRequestDerivesOnlyExactModifyScope(t *testing.T) {
          	in := validInput(t)
          	req, concrete, err := ComposeRequest(in)
          	if err != nil {
          		t.Fatal(err)
          	}
          	if !req.AdmissionEligible || concrete == nil {
          		t.Fatal("expected admission-eligible request")
          	}
          	if len(req.DerivedScope.Files) != 1 || req.DerivedScope.Files[0].Path != "a.txt" || req.DerivedScope.Files[0].Operation != admission.OperationModify {
          		t.Fatalf("unexpected derived scope: %#v", req.DerivedScope)
          	}
          	if err := ValidateRequest(req); err != nil {
          		t.Fatal(err)
          	}
          }

          func TestComposeRequestRejectsTamperedLineage(t *testing.T) {
          	in := validInput(t)
          	in.EvaluationReceipt.RunnerReceiptDigestSHA256 = hex64("different-runner")
          	digest, err := evaluatorcomposition.EvaluationReceiptDigest(in.EvaluationReceipt)
          	if err != nil {
          		t.Fatal(err)
          	}
          	in.EvaluationReceipt.ReceiptDigestSHA256 = digest
          	if _, _, err := ComposeRequest(in); err == nil {
          		t.Fatal("expected O3/O4 lineage mismatch")
          	}
          }

          func TestUnsupportedCreateIsPreservedAndNotSubmitted(t *testing.T) {
          	in := validInput(t)
          	entry := manifestEntry(t, "new.txt", []byte("new"), runnercomposition.ModeRegular)
          	in.CandidateArtifact.Manifest = append(in.CandidateArtifact.Manifest, entry)
          	finalDigest, err := runnercomposition.ManifestDigest(in.CandidateArtifact.Manifest)
          	if err != nil {
          		t.Fatal(err)
          	}
          	in.CandidateArtifact.FinalCandidateContentDigestSHA256 = finalDigest
          	in.RunnerReceipt.FinalCandidateContentDigestSHA256 = &finalDigest
          	artifactDigest, err := runnercomposition.CandidateArtifactDigest(in.CandidateArtifact)
          	if err != nil {
          		t.Fatal(err)
          	}
          	in.CandidateArtifact.CandidateArtifactDigestSHA256 = artifactDigest
          	in.RunnerReceipt.CandidateArtifactDigestSHA256 = &artifactDigest
          	runnerDigest, err := runnercomposition.RunnerReceiptDigest(in.RunnerReceipt)
          	if err != nil {
          		t.Fatal(err)
          	}
          	in.RunnerReceipt.RunnerReceiptDigestSHA256 = runnerDigest
          	in.EvaluationReceipt.RunnerReceiptDigestSHA256 = runnerDigest
          	in.EvaluationReceipt.CandidateArtifactDigestSHA256 = artifactDigest
          	o4Digest, err := evaluatorcomposition.EvaluationReceiptDigest(in.EvaluationReceipt)
          	if err != nil {
          		t.Fatal(err)
          	}
          	in.EvaluationReceipt.ReceiptDigestSHA256 = o4Digest

          	req, concrete, err := ComposeRequest(in)
          	if err != nil {
          		t.Fatal(err)
          	}
          	if req.AdmissionEligible || concrete != nil || len(req.UnsupportedOperations) != 1 || req.UnsupportedOperations[0].Operation != admission.ChangeAdded {
          		t.Fatalf("unsupported operation was not preserved: %#v", req)
          	}
          	receipt, err := ComposeUnsupportedReceipt(req, "2026-08-01T22:00:00Z")
          	if err != nil {
          		t.Fatal(err)
          	}
          	if receipt.Disposition != DispositionUnsupportedOperationRefused {
          		t.Fatalf("unexpected disposition %q", receipt.Disposition)
          	}
          }

          func TestDecisionAndVerificationRemainSeparateFromFrozenO1Receipt(t *testing.T) {
          	in := validInput(t)
          	req, concrete, err := ComposeRequest(in)
          	if err != nil {
          		t.Fatal(err)
          	}
          	identity := *req.AdmissionRequestIdentityDigestSHA256
          	decision := admission.Decision{
          		SchemaVersion: admission.SchemaVersion,
          		GeneratedBy: admission.GeneratedBy,
          		AdmissionID: "admission.test",
          		PolicyID: admission.PolicyStrictID,
          		PolicyVersion: admission.PolicyStrictVersion,
          		Decision: admission.DecisionAdmitted,
          		RequestedMode: admission.ModeModify,
          		Binding: concrete.Binding,
          		RequestReceipt: admission.RequestReceipt{DigestSHA256: identity, Scope: concrete.Scope, Mode: concrete.Mode, TaskClass: concrete.TaskClass},
          		InspectionCapability: admission.CapabilityAdmitted,
          		MutationCapability: admission.CapabilityAdmitted,
          		Envelope: admission.ChangeEnvelope{ModifyPaths: []string{"a.txt"}},
          		ScopeOnly: true,
          		CorrectnessCertified: false,
          	}
          	canonical, err := admission.MarshalCanonicalDecisionJSON(decision)
          	if err != nil {
          		t.Fatal(err)
          	}
          	var decisionEnv struct { ArchitectureAdmissionDecision admission.Decision `json:"architecture_admission_decision"` }
          	if err := jsonUnmarshal(canonical, &decisionEnv); err != nil { t.Fatal(err) }
          	decision = decisionEnv.ArchitectureAdmissionDecision

          	receipt, err := ComposeDecisionReceipt(req, *concrete, decision, "2026-08-01T22:00:00Z")
          	if err != nil {
          		t.Fatal(err)
          	}
          	if in.SynthesisReceipt.AdmissionDecisionDigestSHA256 != nil || in.SynthesisReceipt.AdmissionVerificationDigestSHA256 != nil {
          		t.Fatal("O5 mutated the O1 receipt")
          	}

          	verification := admission.Verification{
          		SchemaVersion: admission.VerificationSchemaVersion,
          		GeneratedBy: admission.GeneratedBy,
          		AdmissionID: decision.AdmissionID,
          		DecisionDigestSHA256: decision.DecisionDigestSHA256,
          		Status: admission.VerificationScopeCompliant,
          		Binding: decision.Binding,
          		SessionID: "session",
          		IterationDigestSHA256: hex64("iteration"),
          		PatchDigestSHA256: hex64("patch"),
          		ScopeOnly: true,
          		CorrectnessCertified: false,
          	}
          	verificationJSON, err := admission.MarshalCanonicalVerificationJSON(verification)
          	if err != nil { t.Fatal(err) }
          	var verificationEnv struct { ArchitectureAdmissionVerification admission.Verification `json:"architecture_admission_verification"` }
          	if err := jsonUnmarshal(verificationJSON, &verificationEnv); err != nil { t.Fatal(err) }
          	verification = verificationEnv.ArchitectureAdmissionVerification

          	finalReceipt, err := AttachVerification(receipt, decision, verification, "2026-08-01T22:01:00Z")
          	if err != nil {
          		t.Fatal(err)
          	}
          	if finalReceipt.Disposition != DispositionVerificationRecorded || finalReceipt.AdmissionVerificationDigestSHA256 == nil {
          		t.Fatalf("verification not recorded: %#v", finalReceipt)
          	}
          }

          func validInput(t *testing.T) ComposeInput {
          	t.Helper()
          	base := []runnercomposition.CandidateManifestEntry{manifestEntry(t, "a.txt", []byte("old\n"), runnercomposition.ModeRegular)}
          	final := []runnercomposition.CandidateManifestEntry{manifestEntry(t, "a.txt", []byte("new\n"), runnercomposition.ModeRegular)}
          	inputDigest, err := runnercomposition.ManifestDigest(base)
          	if err != nil { t.Fatal(err) }
          	finalDigest, err := runnercomposition.ManifestDigest(final)
          	if err != nil { t.Fatal(err) }
          	attemptDigest := hex64("attempt")
          	evaluationDigest := hex64("evaluation")
          	sessionDigest := hex64("session")
          	artifact := runnercomposition.CandidateArtifact{
          		SchemaVersion: runnercomposition.CandidateArtifactSchemaVersion,
          		RepositoryDomain: "github.com/globulario/sensei",
          		BaseRevision: "0123456789012345678901234567890123456789",
          		WorkspaceIdentityDigestSHA256: hex64("workspace"),
          		SessionDigestSHA256: sessionDigest,
          		PlanDigestSHA256: hex64("plan"),
          		PlanGeneration: 1,
          		AttemptNumber: 1,
          		InputCandidateDigestSHA256: inputDigest,
          		ProposedChangeDigestSHA256: hex64("change"),
          		FinalCandidateContentDigestSHA256: finalDigest,
          		Manifest: final,
          	}
          	artifactDigest, err := runnercomposition.CandidateArtifactDigest(artifact)
          	if err != nil { t.Fatal(err) }
          	artifact.CandidateArtifactDigestSHA256 = artifactDigest
          	resultDigest := hex64("result")
          	o2ReceiptDigest := hex64("o2")
          	requestDigest := hex64("request")
          	cleanup := true
          	runner := runnercomposition.RunnerReceipt{
          		SchemaVersion: runnercomposition.RunnerReceiptSchemaVersion,
          		RunnerReceiptID: "runner.receipt",
          		RequestDigestSHA256: requestDigest,
          		ResultDigestSHA256: &resultDigest,
          		O2ReceiptDigestSHA256: &o2ReceiptDigest,
          		InputCandidateDigestSHA256: &inputDigest,
          		ProposedChangeDigestSHA256: &artifact.ProposedChangeDigestSHA256,
          		FinalCandidateContentDigestSHA256: &finalDigest,
          		CandidateArtifactDigestSHA256: &artifactDigest,
          		Disposition: runnercomposition.DispositionVerified,
          		CleanupSucceeded: &cleanup,
          		CompletedAt: "2026-08-01T21:00:00Z",
          	}
          	runnerDigest, err := runnercomposition.RunnerReceiptDigest(runner)
          	if err != nil { t.Fatal(err) }
          	runner.RunnerReceiptDigestSHA256 = runnerDigest
          	o1 := synthesis.Receipt{
          		SchemaVersion: synthesis.ReceiptSchemaVersion,
          		ReceiptID: "synthesis.receipt",
          		SessionDigestSHA256: sessionDigest,
          		TerminalReason: synthesis.ReasonCandidateReadyForAdmission,
          		FinalAttemptDigestSHA256: &attemptDigest,
          		FinalEvaluationDigestSHA256: &evaluationDigest,
          		RetryCount: 0,

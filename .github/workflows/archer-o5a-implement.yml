          }

          func manifestEntry(t *testing.T, path string, content []byte, mode runnercomposition.CandidateFileMode) runnercomposition.CandidateManifestEntry {
          	t.Helper()
          	sum := sha256.Sum256(content)
          	return runnercomposition.CandidateManifestEntry{Path: path, Mode: mode, Content: append([]byte{}, content...), SymlinkTarget: "", ContentDigestSHA256: hex.EncodeToString(sum[:])}
          }

          func hex64(seed string) string {
          	sum := sha256.Sum256([]byte(seed))
          	return hex.EncodeToString(sum[:])
          }

          func jsonUnmarshal(data []byte, out any) error {
          	return json.Unmarshal(data, out)
          }

name: O8 format and schema wiring

on:
  push:
    branches:
      - archer/o8-cognitive-command-providers

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archer/o8-cognitive-command-providers
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Wire schemas, format, and regenerate imports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('golang/architecture/cognitivecommand/provider.go')
          text = path.read_text()
          old_i = '''func decodeInterpretationProposal(data []byte) (InterpretationProposal, error) {
          \tvar proposal InterpretationProposal
          '''
          new_i = '''func decodeInterpretationProposal(data []byte) (InterpretationProposal, error) {
          \tif err := ValidateInterpretationProposalSchema(data); err != nil {
          \t\treturn InterpretationProposal{}, invalidOutput("interpretation proposal schema: %v", err)
          \t}
          \tvar proposal InterpretationProposal
          '''
          old_p = '''func decodePlanProposal(data []byte) (PlanProposal, error) {
          \tvar proposal PlanProposal
          '''
          new_p = '''func decodePlanProposal(data []byte) (PlanProposal, error) {
          \tif err := ValidatePlanProposalSchema(data); err != nil {
          \t\treturn PlanProposal{}, invalidOutput("plan proposal schema: %v", err)
          \t}
          \tvar proposal PlanProposal
          '''
          if old_i not in text or old_p not in text:
              raise SystemExit('proposal decoder target not found')
          path.write_text(text.replace(old_i, new_i, 1).replace(old_p, new_p, 1))
          PY
          gofmt -w golang/architecture/agentcommand/command_agent.go golang/architecture/cognitivecommand/*.go
          make import-graph
          rm -f .github/workflows/o8-format-schema.yml .github/o8-format-schema-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore(archer): format O8 and enforce proposal schemas'
          git push origin HEAD:archer/o8-cognitive-command-providers

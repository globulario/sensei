name: O4 final lifecycle hardening

on:
  push:
    branches:
      - agent/governed-evaluator-composition-o4
    paths:
      - .github/workflows/o4-final-lifecycle.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/governed-evaluator-composition-o4
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum
      - name: Apply and prove lifecycle hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"{label} not found")
              return text.replace(old, new, 1)

          surface = Path('golang/architecture/evaluatorcomposition/surface.go')
          text = surface.read_text()
          text = replace_once(text,
          '''\tif mode == SurfaceModeGitDiff {
          \t\tif err := validateGitControlPaths(artifact.Manifest); err != nil {
          \t\t\treturn nil, fmt.Errorf("CandidateMaterializer.Materialize: %w", err)
          \t\t}
          \t}
          ''',
          '''\tif err := validateGitControlPaths(artifact.Manifest); err != nil {
          \t\treturn nil, fmt.Errorf("CandidateMaterializer.Materialize: %w", err)
          \t}
          ''', 'all-mode Git control validation')
          old_helper = '''func validateGitControlPaths(entries []runnercomposition.CandidateManifestEntry) error {
          \tfor _, entry := range entries {
          \t\tfolded := strings.ToLower(entry.Path)
          \t\tif folded == ".git" || strings.HasPrefix(folded, ".git/") {
          \t\t\treturn fmt.Errorf("candidate manifest path %q targets the disposable Git control directory", entry.Path)
          \t\t}
          \t}
          \treturn nil
          }
          '''
          new_helper = '''func validateGitControlPaths(entries []runnercomposition.CandidateManifestEntry) error {
          \tfor _, entry := range entries {
          \t\tfolded := strings.ToLower(entry.Path)
          \t\tif folded == ".git" || strings.HasPrefix(folded, ".git/") {
          \t\t\treturn fmt.Errorf("candidate manifest path %q targets the reserved Git control directory", entry.Path)
          \t\t}
          \t\tif entry.Mode == runnercomposition.ModeSymlink {
          \t\t\tresolved := strings.ToLower(path.Clean(path.Join(path.Dir(entry.Path), entry.SymlinkTarget)))
          \t\t\tif resolved == ".git" || strings.HasPrefix(resolved, ".git/") {
          \t\t\t\treturn fmt.Errorf("candidate symlink %q targets the reserved Git control directory through %q", entry.Path, entry.SymlinkTarget)
          \t\t\t}
          \t\t}
          \t}
          \treturn nil
          }
          '''
          text = replace_once(text, old_helper, new_helper, 'Git path and symlink validation')
          surface.write_text(text)

          evaluator = Path('golang/architecture/evaluatorcomposition/evaluator.go')
          text = evaluator.read_text()
          text = replace_once(text,
          '''\tif evaluator == nil {
          \t\treturn EvaluatorExecution{}, fmt.Errorf("ExecuteEvaluator: nil evaluator")
          \t}
          \tif surface == nil {
          \t\treturn EvaluatorExecution{}, fmt.Errorf("ExecuteEvaluator: nil surface")
          \t}
          \tif input.EvaluatorSurfaceRef != surface.Ref() {
          \t\treturn EvaluatorExecution{}, fmt.Errorf("ExecuteEvaluator: input surface ref %q does not match surface %q", input.EvaluatorSurfaceRef, surface.Ref())
          \t}
          \tif err := ValidateEvaluationInput(input); err != nil {
          \t\treturn EvaluatorExecution{}, fmt.Errorf("ExecuteEvaluator: invalid input: %w", err)
          \t}
          ''',
          '''\tif surface == nil {
          \t\treturn EvaluatorExecution{}, fmt.Errorf("ExecuteEvaluator: nil surface")
          \t}
          \tif evaluator == nil {
          \t\treturn EvaluatorExecution{}, closeEvaluatorFailure(surface, fmt.Errorf("ExecuteEvaluator: nil evaluator"))
          \t}
          \tif input.EvaluatorSurfaceRef != surface.Ref() {
          \t\treturn EvaluatorExecution{}, closeEvaluatorFailure(surface, fmt.Errorf("ExecuteEvaluator: input surface ref %q does not match surface %q", input.EvaluatorSurfaceRef, surface.Ref()))
          \t}
          \tif err := ValidateEvaluationInput(input); err != nil {
          \t\treturn EvaluatorExecution{}, closeEvaluatorFailure(surface, fmt.Errorf("ExecuteEvaluator: invalid input: %w", err))
          \t}
          ''', 'early evaluator cleanup')
          evaluator.write_text(text)

          surface_test = Path('golang/architecture/evaluatorcomposition/surface_test.go')
          text = surface_test.read_text()
          start = text.index('func TestCandidateMaterializerGitDiffRejectsCandidateGitControlPaths')
          end = text.index('func TestInitializeDisposableGitBaseAllowsEmptySnapshot')
          replacement = '''func TestCandidateMaterializerRejectsCandidateGitControlPathsAndSymlinks(t *testing.T) {
          \tartifact, _, _, repoRoot := checkpoint4Fixture(t)
          \tmaterializer, err := NewCandidateMaterializer(artifact.RepositoryDomain, repoRoot)
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \ttests := []struct {
          \t\tname  string
          \t\tentry runnercomposition.CandidateManifestEntry
          \t}{
          \t\t{name: "direct lower", entry: gitControlRegularEntry(t, ".git/config")},
          \t\t{name: "direct folded", entry: gitControlRegularEntry(t, ".GIT/hooks/pre-commit")},
          \t\t{name: "symlink", entry: gitControlSymlinkEntry(t, "leak", ".git/config")},
          \t}
          \tfor _, test := range tests {
          \t\tt.Run(test.name, func(t *testing.T) {
          \t\t\ttampered := artifact
          \t\t\ttampered.Manifest = append(tampered.Manifest, test.entry)
          \t\t\tfinalDigest, err := runnercomposition.ManifestDigest(tampered.Manifest)
          \t\t\tif err != nil {
          \t\t\t\tt.Fatal(err)
          \t\t\t}
          \t\t\ttampered.FinalCandidateContentDigestSHA256 = finalDigest
          \t\t\ttampered = finishSurfaceArtifact(t, tampered)
          \t\t\tfor _, mode := range []SurfaceMode{SurfaceModePlain, SurfaceModeGitDiff} {
          \t\t\t\tif _, err := materializer.Materialize(context.Background(), tampered, "evaluator", mode); err == nil || !strings.Contains(err.Error(), "Git control directory") {
          \t\t\t\t\tt.Fatalf("mode %q candidate Git control rejection = %v", mode, err)
          \t\t\t\t}
          \t\t\t}
          \t\t})
          \t}
          }

          func gitControlRegularEntry(t *testing.T, candidatePath string) runnercomposition.CandidateManifestEntry {
          \tt.Helper()
          \tcontent := []byte("candidate-controlled Git configuration\\n")
          \tsum := sha256.Sum256(content)
          \treturn runnercomposition.CandidateManifestEntry{
          \t\tPath: candidatePath, Mode: runnercomposition.ModeRegular,
          \t\tContent: content, SymlinkTarget: "", ContentDigestSHA256: hex.EncodeToString(sum[:]),
          \t}
          }

          func gitControlSymlinkEntry(t *testing.T, candidatePath, target string) runnercomposition.CandidateManifestEntry {
          \tt.Helper()
          \tsum := sha256.Sum256([]byte(target))
          \treturn runnercomposition.CandidateManifestEntry{
          \t\tPath: candidatePath, Mode: runnercomposition.ModeSymlink,
          \t\tContent: []byte{}, SymlinkTarget: target, ContentDigestSHA256: hex.EncodeToString(sum[:]),
          \t}
          }

          '''
          text = text[:start] + replacement + text[end:]
          surface_test.write_text(text)

          evaluator_test = Path('golang/architecture/evaluatorcomposition/evaluator_test.go')
          text = evaluator_test.read_text()
          append_test = '''
          func TestExecuteEvaluatorRevokesSurfaceOnEarlyInputRefusal(t *testing.T) {
          \tt.Run("nil evaluator", func(t *testing.T) {
          \t\tsurface := &recordingEvaluatorSurface{ref: "surface://test/nil-evaluator/plain", root: t.TempDir(), mode: SurfaceModePlain}
          \t\tinput := evaluationInputForSurface(t, surface)
          \t\tif _, err := ExecuteEvaluator(context.Background(), nil, input, surface); err == nil {
          \t\t\tt.Fatal("nil evaluator was accepted")
          \t\t}
          \t\tif surface.closed != 1 {
          \t\t\tt.Fatalf("surface Close calls = %d, want 1", surface.closed)
          \t\t}
          \t})
          \tt.Run("surface ref mismatch", func(t *testing.T) {
          \t\tsurface := &recordingEvaluatorSurface{ref: "surface://test/ref-mismatch/plain", root: t.TempDir(), mode: SurfaceModePlain}
          \t\tinput := evaluationInputForSurface(t, surface)
          \t\tinput.EvaluatorSurfaceRef = "surface://different"
          \t\tevaluator := EvaluatorFunc{}
          \t\tif _, err := ExecuteEvaluator(context.Background(), evaluator, input, surface); err == nil || !strings.Contains(err.Error(), "surface ref") {
          \t\t\tt.Fatalf("surface ref refusal = %v", err)
          \t\t}
          \t\tif surface.closed != 1 {
          \t\t\tt.Fatalf("surface Close calls = %d, want 1", surface.closed)
          \t\t}
          \t})
          \tt.Run("invalid input", func(t *testing.T) {
          \t\tsurface := &recordingEvaluatorSurface{ref: "surface://test/invalid-input/plain", root: t.TempDir(), mode: SurfaceModePlain}
          \t\tinput := evaluationInputForSurface(t, surface)
          \t\tinput.EvaluationInputDigestSHA256 = strings.Repeat("0", 64)
          \t\tevaluator := EvaluatorFunc{}
          \t\tif _, err := ExecuteEvaluator(context.Background(), evaluator, input, surface); err == nil || !strings.Contains(err.Error(), "invalid input") {
          \t\t\tt.Fatalf("invalid input refusal = %v", err)
          \t\t}
          \t\tif surface.closed != 1 {
          \t\t\tt.Fatalf("surface Close calls = %d, want 1", surface.closed)
          \t\t}
          \t})
          }
          '''
          text += append_test
          evaluator_test.write_text(text)
          PY
          gofmt -w golang/architecture/evaluatorcomposition/surface.go golang/architecture/evaluatorcomposition/evaluator.go golang/architecture/evaluatorcomposition/surface_test.go golang/architecture/evaluatorcomposition/evaluator_test.go
          go test ./golang/architecture/evaluatorcomposition -count=1 -timeout 120s
          make import-graph-check
          git config user.name "sensei-o4-maintenance"
          git config user.email "sensei-o4-maintenance@users.noreply.github.com"
          git add golang/architecture/evaluatorcomposition
          git commit -m "fix(synthesis): revoke early surfaces and reserve Git controls"
          git push origin HEAD:agent/governed-evaluator-composition-o4

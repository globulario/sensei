name: O8 focused tests

on:
  push:
    branches:
      - archer/o8-cognitive-command-providers

permissions:
  contents: write

jobs:
  focused:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archer/o8-cognitive-command-providers
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run focused packages
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          go test ./golang/architecture/agentcommand ./golang/architecture/cognitivecommand ./golang/architecture/synthesisdriver -v -count=1 -timeout 5m 2>&1 | tee /tmp/o8-focused.log
      - name: Publish outcome
        shell: bash
        run: |
          rm -f .github/workflows/o8-focused-tests.yml .github/o8-focused-trigger
          if [ "${{ steps.test.outcome }}" != "success" ]; then
            cp /tmp/o8-focused.log .github/o8-focused-failure.log
          else
            rm -f .github/o8-focused-failure.log
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            if [ "${{ steps.test.outcome }}" = "success" ]; then
              git commit -m 'chore(archer): remove successful O8 focused lane'
            else
              git commit -m 'test(archer): publish focused O8 failure evidence'
            fi
            git push origin HEAD:archer/o8-cognitive-command-providers
          fi
          if [ "${{ steps.test.outcome }}" != "success" ]; then
            exit 1
          fi

name: O8 final formatting

on:
  push:
    branches:
      - archer/o8-cognitive-command-providers

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archer/o8-cognitive-command-providers
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Format and regenerate
        shell: bash
        run: |
          gofmt -w \
            golang/architecture/agentcommand/*.go \
            golang/architecture/cognitivecommand/*.go \
            golang/architecture/synthesisdriver/cognitive_o8_integration_test.go
          make import-graph
          rm -f .github/workflows/o8-format-final.yml .github/o8-format-final-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore(archer): format O8 and refresh import graph'
          git push origin HEAD:archer/o8-cognitive-command-providers

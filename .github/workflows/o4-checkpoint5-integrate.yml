name: O4 checkpoint 5 integrate

on:
  push:
    branches:
      - agent/governed-evaluator-composition-o4
    paths:
      - .github/workflows/o4-checkpoint5-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/governed-evaluator-composition-o4
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum
      - name: Apply and prove integration
        shell: bash
        run: |
          set +e
          {
            python scripts/o4_checkpoint5_integrate.py
            gofmt -w golang/architecture/evaluatorcomposition/compose.go golang/architecture/evaluatorcomposition/complete.go golang/architecture/evaluatorcomposition/run.go golang/architecture/evaluatorcomposition/command.go
            go test ./golang/architecture/evaluatorcomposition -count=1 -timeout 120s
            make import-graph
          } > /tmp/o4-checkpoint5.log 2>&1
          status=$?

          git config user.name "sensei-o4-maintenance"
          git config user.email "sensei-o4-maintenance@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            cp /tmp/o4-checkpoint5.log o4-checkpoint5-error.log
            git add o4-checkpoint5-error.log
            git commit -m "test(synthesis): capture checkpoint-5 integration failure"
            git push origin HEAD:agent/governed-evaluator-composition-o4
            exit "$status"
          fi

          git add golang/architecture/evaluatorcomposition docs/awareness/generated/awareness_graph_go_import_graph.yaml
          git commit -m "feat(synthesis): integrate deterministic O4 composition and completion"
          git push origin HEAD:agent/governed-evaluator-composition-o4

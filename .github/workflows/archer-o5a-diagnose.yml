name: ARCHER O5A observable executor

on:
  push:
    branches:
      - archer/o5a-admission-composition

permissions:
  contents: write

jobs:
  diagnose-and-publish:
    if: contains(github.event.head_commit.message, '[o5a-diagnose]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archer/o5a-admission-composition
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum

      - name: Extract implementation from the accepted executor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap

          source = Path('.github/workflows/archer-o5a-implement.yml').read_text()
          for path in [
              'golang/architecture/admissioncomposition/admissioncomposition.go',
              'golang/architecture/admissioncomposition/admissioncomposition_test.go',
          ]:
              marker = "cat > %s <<'EOF'" % path
              start = source.index(marker) + len(marker)
              start = source.index('\n', start) + 1
              end = source.index('\n          EOF', start)
              body = textwrap.dedent(source[start:end])
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(body)

          test = Path('golang/architecture/admissioncomposition/admissioncomposition_test.go')
          body = test.read_text()
          if '"encoding/json"' not in body:
              body = body.replace('"encoding/hex"\n\t"testing"', '"encoding/hex"\n\t"encoding/json"\n\t"testing"')
          test.write_text(body)
          PY

      - name: Run focused proof and publish evidence
        id: proof
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          {
            gofmt -w golang/architecture/admissioncomposition/*.go
            go test ./golang/architecture/admissioncomposition -count=1
            make import-graph
            make import-graph-check
          } 2>&1 | tee /tmp/o5a-proof.log

      - name: Publish diagnostic failure
        if: steps.proof.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sensei-archer-o5a"
          git config user.email "sensei-archer-o5a@users.noreply.github.com"
          cp /tmp/o5a-proof.log o5a-diagnostic.log
          git add o5a-diagnostic.log
          git commit -m "test(archer): capture O5A implementation failure"
          git push origin HEAD:archer/o5a-admission-composition
          exit 1

      - name: Run complete repository proof
        if: steps.proof.outcome == 'success'
        shell: bash
        run: go test ./... -count=1 -timeout 8m -p 2

      - name: Publish verified implementation
        if: steps.proof.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sensei-archer-o5a"
          git config user.email "sensei-archer-o5a@users.noreply.github.com"
          git rm .github/workflows/archer-o5a-implement.yml
          git rm .github/workflows/archer-o5a-diagnose.yml
          git rm -f .archer-o5a-trigger .archer-o5a-diagnose-trigger
          git add -A
          git commit -m "feat(archer): compose candidate-ready admission evidence"
          git push origin HEAD:archer/o5a-admission-composition

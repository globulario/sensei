name: O8 full diagnostic

on:
  push:
    branches:
      - archer/o8-cognitive-command-providers

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archer/o8-cognitive-command-providers
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run repository tests as JSON
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          go test ./... -json -count=1 -timeout 120s 2>&1 | tee /tmp/o8-full.jsonl
      - name: Publish concise failure evidence
        shell: bash
        run: |
          rm -f .github/workflows/o8-full-diagnostic.yml .github/o8-full-diagnostic-trigger
          if [ "${{ steps.test.outcome }}" != "success" ]; then
            python3 - <<'PY'
          import json
          from collections import defaultdict, deque
          src = '/tmp/o8-full.jsonl'
          history = defaultdict(lambda: deque(maxlen=35))
          failed = []
          package_failed = []
          with open(src, errors='replace') as f:
              for line in f:
                  line=line.rstrip('\n')
                  try:
                      event=json.loads(line)
                  except Exception:
                      continue
                  pkg=event.get('Package','<unknown>')
                  out=event.get('Output')
                  if out:
                      history[pkg].append(out.rstrip())
                  if event.get('Action')=='fail':
                      if event.get('Test'):
                          failed.append((pkg,event['Test'],list(history[pkg])))
                      else:
                          package_failed.append((pkg,list(history[pkg])))
          with open('.github/o8-full-failure.log','w') as out:
              out.write('FAILED TESTS\n')
              for pkg,test,lines in failed:
                  out.write(f'\n## {pkg} :: {test}\n')
                  out.write('\n'.join(lines[-25:])+'\n')
              out.write('\nFAILED PACKAGES\n')
              for pkg,lines in package_failed:
                  out.write(f'\n## {pkg}\n')
                  out.write('\n'.join(lines[-25:])+'\n')
          PY
          else
            rm -f .github/o8-full-failure.log
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            if [ "${{ steps.test.outcome }}" = "success" ]; then
              git commit -m 'chore(archer): remove successful O8 full diagnostic'
            else
              git commit -m 'test(archer): publish repository-wide O8 failure evidence'
            fi
            git push origin HEAD:archer/o8-cognitive-command-providers
          fi
          if [ "${{ steps.test.outcome }}" != "success" ]; then
            exit 1
          fi

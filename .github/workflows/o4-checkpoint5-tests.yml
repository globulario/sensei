name: O4 checkpoint 5 tests

on:
  push:
    branches:
      - agent/governed-evaluator-composition-o4
    paths:
      - .github/workflows/o4-checkpoint5-tests.yml

permissions:
  contents: write

jobs:
  checkpoint5-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/governed-evaluator-composition-o4
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum
      - name: Apply corrections and run package proofs
        shell: bash
        run: |
          set +e
          {
            python - <<'PY'
            from pathlib import Path

            def replace_once(text, old, new, label):
                if old not in text:
                    raise SystemExit(f"{label} not found")
                return text.replace(old, new, 1)

            compose = Path('golang/architecture/evaluatorcomposition/compose.go')
            text = compose.read_text()
            text = replace_once(text,
            '''\t\t\tlimitations = append(limitations, synthesis.Limitation{
            \t\t\t\tSource: "evaluatorcomposition", Scope: id,
            \t\t\t\tReason: fmt.Sprintf("optional evaluator ended with terminal outcome %q", execution.Result.TerminalOutcome),
            \t\t\t\tBlocking: true,
            \t\t\t})
            ''',
            '''\t\t\tlimitations = append(limitations, synthesis.Limitation{
            \t\t\t\tSource: "evaluatorcomposition", Scope: id,
            \t\t\t\tReason: fmt.Sprintf("optional evaluator ended with terminal outcome %q", execution.Result.TerminalOutcome),
            \t\t\t\tBlocking: false,
            \t\t\t})
            ''', 'optional completed limitation')
            text = replace_once(text,
            '''\t\tlimitations = append(limitations, synthesis.Limitation{
            \t\t\tSource: "evaluatorcomposition", Scope: spec.EvaluatorID,
            \t\t\tReason: "optional evaluator produced no finalized result", Blocking: true,
            \t\t})
            ''',
            '''\t\tlimitations = append(limitations, synthesis.Limitation{
            \t\t\tSource: "evaluatorcomposition", Scope: spec.EvaluatorID,
            \t\t\tReason: "optional evaluator produced no finalized result", Blocking: false,
            \t\t})
            ''', 'optional missing limitation')
            text = replace_once(text,
            '''\t\tlimitations = canonicalLimitations(append(limitations, synthesis.Limitation{
            \t\t\tSource: "evaluatorcomposition", Scope: "required-checks", Reason: reason, Blocking: true,
            \t\t}))
            ''',
            '''\t\tlimitations = canonicalLimitations(append(limitations, synthesis.Limitation{
            \t\t\tSource: "evaluatorcomposition", Scope: "required-checks", Reason: reason, Blocking: false,
            \t\t}))
            ''', 'required check limitation')
            compose.write_text(text)

            complete_test = Path('golang/architecture/evaluatorcomposition/complete_test.go')
            text = complete_test.read_text()
            text = text.replace('synthesis.ReasonArchitectReview,', 'synthesis.ReasonArchitectReviewRequired,')
            text = text.replace('synthesis.ReasonAbort,', 'synthesis.ReasonExplicitlyAborted,')
            complete_test.write_text(text)

            proof_test = Path('golang/architecture/evaluatorcomposition/compose_proof_test.go')
            text = proof_test.read_text()
            start = text.index('func proofExecution(')
            end = text.index('func TestComposeEvaluationValidatesExactClosureProofDischargeBytes')
            replacement = '''func proofExecution(t *testing.T, checkpoint Result, policy EvaluationPolicy, reference EvidenceReference) EvaluatorExecution {
            \tt.Helper()
            \tsurface := &recordingEvaluatorSurface{
            \t\tref: "surface://checkpoint5/proof.evaluator/plain",
            \t\troot: t.TempDir(),
            \t\tmode: SurfaceModePlain,
            \t}
            \tinput, err := BuildEvaluationInput(checkpoint.SessionState, *checkpoint.Candidate, policy, surface)
            \tif err != nil {
            \t\tt.Fatal(err)
            \t}
            \tdescriptor := evaluatorDescriptorForExecution(t, "proof.evaluator")
            \tdescriptor.SupportedCheckIDs = []string{"proof-check"}
            \tdescriptor.Limitations = []synthesis.Limitation{}
            \tdescriptor = NormalizeEvaluatorDescriptor(descriptor)
            \tdescriptorDigest, err := EvaluatorDescriptorDigest(descriptor)
            \tif err != nil {
            \t\tt.Fatal(err)
            \t}
            \tdescriptor.DescriptorDigestSHA256 = descriptorDigest
            \tcleanupSucceeded := true
            \tresult := EvaluatorResult{
            \t\tSchemaVersion: EvaluatorResultSchemaVersion,
            \t\tEvaluatorID: descriptor.EvaluatorID,
            \t\tEvaluatorDescriptorDigestSHA256: descriptor.DescriptorDigestSHA256,
            \t\tEvaluationInputDigestSHA256: input.EvaluationInputDigestSHA256,
            \t\tTerminalOutcome: EvaluatorOutcomeCompleted,
            \t\tChecks: []synthesis.CheckObservation{{
            \t\t\tCheckID: "proof-check", Status: synthesis.CheckPassed,
            \t\t\tDetail: "closure proof discharged",
            \t\t\tEvidenceReferences: []string{reference.Reference},
            \t\t}},
            \t\tEvidenceReferences: []EvidenceReference{reference},
            \t\tClassifiedFailureReasons: []string{},
            \t\tLimitations: []synthesis.Limitation{},
            \t\tCleanupSucceeded: &cleanupSucceeded,
            \t}
            \tresult = NormalizeEvaluatorResult(result)
            \tresultDigest, err := EvaluatorResultDigest(result)
            \tif err != nil {
            \t\tt.Fatal(err)
            \t}
            \tresult.ResultDigestSHA256 = resultDigest
            \tif err := ValidateEvaluatorResult(result); err != nil {
            \t\tt.Fatalf("proof execution result invalid: %v", err)
            \t}
            \treturn EvaluatorExecution{Descriptor: descriptor, Input: input, Result: result}
            }

            '''
            text = text[:start] + replacement + text[end:]
            proof_test.write_text(text)
            PY
            gofmt -w golang/architecture/evaluatorcomposition/compose.go golang/architecture/evaluatorcomposition/compose_test.go golang/architecture/evaluatorcomposition/compose_proof_test.go golang/architecture/evaluatorcomposition/complete_test.go
            go test ./golang/architecture/evaluatorcomposition -count=1 -timeout 180s
            make import-graph
          } > /tmp/o4-checkpoint5-tests.log 2>&1
          status=$?

          git config user.name "sensei-o4-maintenance"
          git config user.email "sensei-o4-maintenance@users.noreply.github.com"
          if [ "$status" -ne 0 ]; then
            cp /tmp/o4-checkpoint5-tests.log o4-checkpoint5-tests-error.log
            git add o4-checkpoint5-tests-error.log
            git commit -m "test(synthesis): capture checkpoint-5 package failure"
            git push origin HEAD:agent/governed-evaluator-composition-o4
            exit "$status"
          fi
          git add golang/architecture/evaluatorcomposition docs/awareness/generated/awareness_graph_go_import_graph.yaml
          git commit -m "test(synthesis): close O4 composition and transition matrix"
          git push origin HEAD:agent/governed-evaluator-composition-o4

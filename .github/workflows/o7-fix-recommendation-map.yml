name: O7 recommendation map repair

on:
  push:
    branches:
      - archer/o7-bounded-synthesis-driver

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archer/o7-bounded-synthesis-driver
          fetch-depth: 0
      - name: Map O4 required-check class explicitly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('golang/architecture/synthesisdriver/lifecycle_test.go')
          text = path.read_text()
          old = '''\t\tif failureClass != "" {
          \t\t\tmappings = append(mappings, evaluatorcomposition.FailureClassRecommendation{
          \t\t\t\tFailureClass: failureClass, Recommendation: recommendation,
          \t\t\t})
          \t\t}
          '''
          new = '''\t\tif failureClass != "" {
          \t\t\tmappings = append(mappings,
          \t\t\t\tevaluatorcomposition.FailureClassRecommendation{
          \t\t\t\t\tFailureClass: failureClass, Recommendation: recommendation,
          \t\t\t\t},
          \t\t\t\tevaluatorcomposition.FailureClassRecommendation{
          \t\t\t\t\tFailureClass: evaluatorcomposition.FailureClassRequiredCheckUnsatisfied,
          \t\t\t\t\tRecommendation: recommendation,
          \t\t\t\t},
          \t\t\t)
          \t\t}
          '''
          if old not in text:
              raise SystemExit('target policy block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w golang/architecture/synthesisdriver/lifecycle_test.go
          rm -f .github/workflows/o7-fix-recommendation-map.yml .github/o7-fix-recommendation-map-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(archer): map O4 required-check failures for lifecycle retries'
          git push origin HEAD:archer/o7-bounded-synthesis-driver

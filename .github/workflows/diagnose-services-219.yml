name: Diagnose services 219 seed ownership

on:
  push:
    branches:
      - agent/refresh-seed-for-services-219
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sensei
        uses: actions/checkout@v4
        with:
          ref: agent/refresh-seed-for-services-219
          path: sensei

      - name: Checkout services PR 219
        uses: actions/checkout@v4
        with:
          repository: globulario/services
          ref: agent/doctor-finding-scoped-evidence-closure
          path: services

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: sensei/go.sum

      - name: Print combined ownership-aware audit
        working-directory: sensei
        run: go run ./cmd/awg audit -verbose -services-repo ../services -ag-repo .

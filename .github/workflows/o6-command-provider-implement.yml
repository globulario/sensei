name: O6 command provider implementation

on:
  push:
    branches:
      - agent/o6-command-provider

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/o6-command-provider
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Implement and verify O6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p golang/architecture/commandprovider
          cat > golang/architecture/commandprovider/commandprovider.go <<'GO'
          // SPDX-License-Identifier: AGPL-3.0-only

          // Package commandprovider implements the generic O6 command-backed
          // providerport.Provider adapter. It executes a directly configured argv,
          // exchanges one closed O2 request/result pair over stdin/stdout, and treats
          // bounded stderr as observation evidence only.
          package commandprovider

          import (
          	"bytes"
          	"context"
          	"encoding/json"
          	"errors"
          	"fmt"
          	"io"
          	"os"
          	"os/exec"
          	"sort"
          	"strings"
          	"sync"

          	"github.com/globulario/sensei/golang/architecture/providerport"
          	"github.com/globulario/sensei/golang/architecture/synthesis"
          )

          const defaultProviderKind = "command"

          // Config is the immutable command adapter configuration. Command and Args
          // are executed directly, never through a shell. Environment names are an
          // allowlist over the parent process environment; values are copied only for
          // listed names. WorkDir is optional and must already exist when Execute runs.
          type Config struct {
          	ProviderID          string
          	ProviderKind        string
          	ModelIdentifier     string
          	Command             string
          	Args                []string
          	WorkDir             string
          	EnvironmentAllowlist []string
          	SupportedOperations []providerport.Operation
          	MaxStdoutBytes      int64
          	MaxStderrBytes      int64
          }

          // Adapter is a generic command-backed providerport.Provider.
          type Adapter struct {
          	config       Config
          	capabilities providerport.Capabilities
          }

          // New validates and freezes cfg. It computes the O2 capability snapshot
          // once, so Describe is deterministic and cannot consult ambient state.
          func New(cfg Config) (*Adapter, error) {
          	cfg = normalizeConfig(cfg)
          	if err := validateConfig(cfg); err != nil {
          		return nil, err
          	}
          	caps := providerport.Capabilities{
          		SchemaVersion: providerport.CapabilitiesSchemaVersion,
          		ProviderObservation: synthesis.ProviderObservation{
          			ProviderID:      cfg.ProviderID,
          			ProviderKind:    cfg.ProviderKind,
          			ModelIdentifier: cfg.ModelIdentifier,
          			ObservedAt:      "configuration",
          		},
          		SupportedOperations: append([]providerport.Operation(nil), cfg.SupportedOperations...),
          	}
          	digest, err := providerport.CapabilitiesDigest(caps)
          	if err != nil {
          		return nil, fmt.Errorf("commandprovider: compute capabilities digest: %w", err)
          	}
          	caps.CapabilitiesDigestSHA256 = digest
          	return &Adapter{config: cfg, capabilities: caps}, nil
          }

          // Describe returns a detached copy of the deterministic capability snapshot.
          func (a *Adapter) Describe(ctx context.Context) (providerport.Capabilities, error) {
          	if err := ctx.Err(); err != nil {
          		return providerport.Capabilities{}, err
          	}
          	c := a.capabilities
          	c.SupportedOperations = append([]providerport.Operation(nil), c.SupportedOperations...)
          	return c, nil
          }

          // Execute sends one closed O2 request on stdin and accepts one closed O2
          // result on stdout. Protocol violations are returned as typed invalid-output
          // data rather than as Go errors. Go errors are reserved for failures where no
          // process/result evidence could be constructed.
          func (a *Adapter) Execute(ctx context.Context, request providerport.Request, observer providerport.Observer) (providerport.Result, error) {
          	if !supports(a.config.SupportedOperations, request.Operation) {
          		return terminalResult(request, providerport.OutcomeUnsupportedCapability,
          			fmt.Sprintf("configured command does not support operation %q", request.Operation))
          	}
          	stdin, err := json.Marshal(request)
          	if err != nil {
          		return providerport.Result{}, fmt.Errorf("commandprovider: encode request: %w", err)
          	}
          	stdin = append(stdin, '\n')

          	cmd := exec.CommandContext(ctx, a.config.Command, a.config.Args...)
          	cmd.Dir = a.config.WorkDir
          	cmd.Env = allowedEnvironment(a.config.EnvironmentAllowlist)
          	configureProcessGroup(cmd)
          	cmd.Stdin = bytes.NewReader(stdin)

          	stdout := newLimitedBuffer(a.config.MaxStdoutBytes)
          	stderr := newObservationWriter(a.config.MaxStderrBytes, observer)
          	cmd.Stdout = stdout
          	cmd.Stderr = stderr

          	if err := cmd.Start(); err != nil {
          		return providerport.Result{}, fmt.Errorf("commandprovider: start %q: %w", a.config.Command, err)
          	}

          	waitErr := waitProcess(ctx, cmd)
          	if ctx.Err() != nil {
          		return providerport.Result{}, ctx.Err()
          	}
          	if stdout.exceeded() {
          		return terminalResult(request, providerport.OutcomeInvalidOutput,
          			fmt.Sprintf("stdout exceeded configured limit of %d bytes", a.config.MaxStdoutBytes))
          	}
          	if stderr.exceeded() {
          		_ = observer.Observe(fmt.Sprintf("stderr truncated at configured limit of %d bytes", a.config.MaxStderrBytes))
          	}
          	if waitErr != nil {
          		return providerport.Result{}, fmt.Errorf("commandprovider: command failed: %w", waitErr)
          	}

          	result, detail := decodeSingleResult(stdout.bytes(), request)
          	if detail != "" {
          		return terminalResult(request, providerport.OutcomeInvalidOutput, detail)
          	}
          	return result, nil
          }

          func decodeSingleResult(data []byte, request providerport.Request) (providerport.Result, string) {
          	dec := json.NewDecoder(bytes.NewReader(data))
          	dec.DisallowUnknownFields()
          	var result providerport.Result
          	if err := dec.Decode(&result); err != nil {
          		return providerport.Result{}, "decode result: " + err.Error()
          	}
          	var extra any
          	if err := dec.Decode(&extra); err != io.EOF {
          		if err == nil {
          			return providerport.Result{}, "stdout contained multiple JSON documents"
          		}
          		return providerport.Result{}, "stdout contained trailing non-whitespace or another JSON value: " + err.Error()
          	}
          	if result.RequestDigestSHA256 != request.RequestDigestSHA256 {
          		return providerport.Result{}, "result request_digest_sha256 does not match the request"
          	}
          	if result.Operation != request.Operation {
          		return providerport.Result{}, "result operation does not match the request"
          	}
          	digest, err := providerport.ResultDigest(result)
          	if err != nil {
          		return providerport.Result{}, "compute result digest: " + err.Error()
          	}
          	if digest != result.ResultDigestSHA256 {
          		return providerport.Result{}, fmt.Sprintf("result declares digest %q but computed %q", result.ResultDigestSHA256, digest)
          	}
          	return result, ""
          }

          func terminalResult(request providerport.Request, outcome providerport.TerminalOutcome, detail string) (providerport.Result, error) {
          	r := providerport.Result{
          		SchemaVersion:       providerport.ResultSchemaVersion,
          		RequestDigestSHA256: request.RequestDigestSHA256,
          		Operation:           request.Operation,
          		TerminalOutcome:     outcome,
          		Detail:              detail,
          	}
          	digest, err := providerport.ResultDigest(r)
          	if err != nil {
          		return providerport.Result{}, fmt.Errorf("commandprovider: compute terminal result digest: %w", err)
          	}
          	r.ResultDigestSHA256 = digest
          	return r, nil
          }

          func normalizeConfig(cfg Config) Config {
          	cfg.ProviderID = strings.TrimSpace(cfg.ProviderID)
          	cfg.ProviderKind = strings.TrimSpace(cfg.ProviderKind)
          	if cfg.ProviderKind == "" {
          		cfg.ProviderKind = defaultProviderKind
          	}
          	cfg.Command = strings.TrimSpace(cfg.Command)
          	cfg.WorkDir = strings.TrimSpace(cfg.WorkDir)
          	cfg.Args = append([]string(nil), cfg.Args...)
          	cfg.EnvironmentAllowlist = uniqueSortedStrings(cfg.EnvironmentAllowlist)
          	cfg.SupportedOperations = uniqueSortedOperations(cfg.SupportedOperations)
          	return cfg
          }

          func validateConfig(cfg Config) error {
          	if cfg.ProviderID == "" {
          		return errors.New("commandprovider: provider id is required")
          	}
          	if cfg.Command == "" {
          		return errors.New("commandprovider: command is required")
          	}
          	if len(cfg.SupportedOperations) == 0 {
          		return errors.New("commandprovider: at least one supported operation is required")
          	}
          	for _, op := range cfg.SupportedOperations {
          		if !validOperation(op) {
          			return fmt.Errorf("commandprovider: unsupported configured operation %q", op)
          		}
          	}
          	if cfg.MaxStdoutBytes <= 0 {
          		return errors.New("commandprovider: max stdout bytes must be positive")
          	}
          	if cfg.MaxStderrBytes <= 0 {
          		return errors.New("commandprovider: max stderr bytes must be positive")
          	}
          	for _, name := range cfg.EnvironmentAllowlist {
          		if name == "" || strings.ContainsRune(name, '=') {
          			return fmt.Errorf("commandprovider: invalid environment variable name %q", name)
          		}
          	}
          	return nil
          }

          func validOperation(op providerport.Operation) bool {
          	switch op {
          	case providerport.OperationInterpretation, providerport.OperationPlanning,
          		providerport.OperationGeneration, providerport.OperationEvaluationObservation:
          		return true
          	default:
          		return false
          	}
          }

          func supports(ops []providerport.Operation, want providerport.Operation) bool {
          	for _, op := range ops {
          		if op == want {
          			return true
          		}
          	}
          	return false
          }

          func allowedEnvironment(names []string) []string {
          	env := make([]string, 0, len(names))
          	for _, name := range names {
          		if value, ok := os.LookupEnv(name); ok {
          			env = append(env, name+"="+value)
          		}
          	}
          	sort.Strings(env)
          	return env
          }

          func uniqueSortedStrings(in []string) []string {
          	set := map[string]struct{}{}
          	for _, item := range in {
          		item = strings.TrimSpace(item)
          		if item != "" {
          			set[item] = struct{}{}
          		}
          	}
          	out := make([]string, 0, len(set))
          	for item := range set {
          		out = append(out, item)
          	}
          	sort.Strings(out)
          	return out
          }

          func uniqueSortedOperations(in []providerport.Operation) []providerport.Operation {
          	set := map[providerport.Operation]struct{}{}
          	for _, item := range in {
          		set[item] = struct{}{}
          	}
          	out := make([]providerport.Operation, 0, len(set))
          	for item := range set {
          		out = append(out, item)
          	}
          	sort.Slice(out, func(i, j int) bool { return out[i] < out[j] })
          	return out
          }

          type limitedBuffer struct {
          	mu       sync.Mutex
          	limit    int64
          	buf      bytes.Buffer
          	overflow bool
          }

          func newLimitedBuffer(limit int64) *limitedBuffer { return &limitedBuffer{limit: limit} }

          func (b *limitedBuffer) Write(p []byte) (int, error) {
          	b.mu.Lock()
          	defer b.mu.Unlock()
          	n := len(p)
          	remaining := b.limit - int64(b.buf.Len())
          	if remaining <= 0 {
          		b.overflow = true
          		return n, nil
          	}
          	keep := p
          	if int64(len(keep)) > remaining {
          		keep = keep[:remaining]
          		b.overflow = true
          	}
          	_, _ = b.buf.Write(keep)
          	return n, nil
          }

          func (b *limitedBuffer) bytes() []byte {
          	b.mu.Lock()
          	defer b.mu.Unlock()
          	return append([]byte(nil), b.buf.Bytes()...)
          }

          func (b *limitedBuffer) exceeded() bool {
          	b.mu.Lock()
          	defer b.mu.Unlock()
          	return b.overflow
          }

          type observationWriter struct {
          	limit    int64
          	observer providerport.Observer
          	mu       sync.Mutex
          	used     int64
          	overflow bool
          	pending  string
          }

          func newObservationWriter(limit int64, observer providerport.Observer) *observationWriter {
          	return &observationWriter{limit: limit, observer: observer}
          }

          func (w *observationWriter) Write(p []byte) (int, error) {
          	w.mu.Lock()
          	defer w.mu.Unlock()
          	n := len(p)
          	remaining := w.limit - w.used
          	if remaining <= 0 {
          		w.overflow = true
          		return n, nil
          	}
          	keep := p
          	if int64(len(keep)) > remaining {
          		keep = keep[:remaining]
          		w.overflow = true
          	}
          	w.used += int64(len(keep))
          	w.pending += string(keep)
          	for {
          		idx := strings.IndexByte(w.pending, '\n')
          		if idx < 0 {
          			break
          		}
          		line := strings.TrimSpace(w.pending[:idx])
          		w.pending = w.pending[idx+1:]
          		if line != "" {
          			if err := w.observer.Observe(line); err != nil {
          				return n, err
          			}
          		}
          	}
          	return n, nil
          }

          func (w *observationWriter) exceeded() bool {
          	w.mu.Lock()
          	defer w.mu.Unlock()
          	if strings.TrimSpace(w.pending) != "" {
          		_ = w.observer.Observe(strings.TrimSpace(w.pending))
          		w.pending = ""
          	}
          	return w.overflow
          }
          GO

          cat > golang/architecture/commandprovider/process_unix.go <<'GO'
          // SPDX-License-Identifier: AGPL-3.0-only

          //go:build unix

          package commandprovider

          import (
          	"context"
          	"errors"
          	"os/exec"
          	"syscall"
          )

          func configureProcessGroup(cmd *exec.Cmd) {
          	cmd.SysProcAttr = &syscall.SysProcAttr{Setpgid: true}
          }

          func waitProcess(ctx context.Context, cmd *exec.Cmd) error {
          	done := make(chan error, 1)
          	go func() { done <- cmd.Wait() }()
          	select {
          	case err := <-done:
          		return err
          	case <-ctx.Done():
          		if cmd.Process != nil {
          			_ = syscall.Kill(-cmd.Process.Pid, syscall.SIGKILL)
          		}
          		err := <-done
          		if err == nil || errors.Is(err, os.ErrProcessDone) {
          			return ctx.Err()
          		}
          		return ctx.Err()
          	}
          }
          GO

          cat > golang/architecture/commandprovider/process_other.go <<'GO'
          // SPDX-License-Identifier: AGPL-3.0-only

          //go:build !unix

          package commandprovider

          import (
          	"context"
          	"os/exec"
          )

          func configureProcessGroup(cmd *exec.Cmd) {}

          func waitProcess(ctx context.Context, cmd *exec.Cmd) error {
          	done := make(chan error, 1)
          	go func() { done <- cmd.Wait() }()
          	select {
          	case err := <-done:
          		return err
          	case <-ctx.Done():
          		if cmd.Process != nil {
          			_ = cmd.Process.Kill()
          		}
          		<-done
          		return ctx.Err()
          	}
          }
          GO

          cat > golang/architecture/commandprovider/commandprovider_test.go <<'GO'
          // SPDX-License-Identifier: AGPL-3.0-only

          package commandprovider

          import (
          	"context"
          	"encoding/json"
          	"fmt"
          	"os"
          	"os/exec"
          	"strings"
          	"testing"
          	"time"

          	"github.com/globulario/sensei/golang/architecture/providerport"
          )

          type collectingObserver struct{ details []string }
          func (o *collectingObserver) Observe(detail string) error {
          	o.details = append(o.details, detail)
          	return nil
          }

          func TestMain(m *testing.M) {
          	if os.Getenv("SENSEI_COMMANDPROVIDER_HELPER") == "1" {
          		helperProcess()
          		os.Exit(0)
          	}
          	os.Exit(m.Run())
          }

          func helperProcess() {
          	mode := os.Getenv("SENSEI_COMMANDPROVIDER_MODE")
          	var request providerport.Request
          	_ = json.NewDecoder(os.Stdin).Decode(&request)
          	switch mode {
          	case "malformed":
          		fmt.Print("{")
          	case "multiple":
          		fmt.Print("{} {}")
          	case "unknown":
          		fmt.Printf(`{"schema_version":"%s","request_digest_sha256":"%s","operation":"%s","terminal_outcome":"unavailable","detail":"x","result_digest_sha256":"%s","unknown":true}`,
          			providerport.ResultSchemaVersion, request.RequestDigestSHA256, request.Operation, strings.Repeat("0", 64))
          	case "oversized":
          		fmt.Print(strings.Repeat("x", 8192))
          	case "stderr":
          		fmt.Fprintln(os.Stderr, "provider diagnostic")
          		writeUnavailable(request, "done")
          	case "env":
          		writeUnavailable(request, os.Getenv("COMMANDPROVIDER_ALLOWED")+"|"+os.Getenv("COMMANDPROVIDER_DENIED"))
          	case "sleep":
          		cmd := exec.Command(os.Args[0], "-test.run=TestMain")
          		cmd.Env = append(os.Environ(), "SENSEI_COMMANDPROVIDER_HELPER=1", "SENSEI_COMMANDPROVIDER_MODE=child-sleep")
          		_ = cmd.Start()
          		time.Sleep(10 * time.Second)
          	case "child-sleep":
          		time.Sleep(10 * time.Second)
          	default:
          		writeUnavailable(request, "ok")
          	}
          }

          func writeUnavailable(request providerport.Request, detail string) {
          	r := providerport.Result{
          		SchemaVersion: providerport.ResultSchemaVersion,
          		RequestDigestSHA256: request.RequestDigestSHA256,
          		Operation: request.Operation,
          		TerminalOutcome: providerport.OutcomeUnavailable,
          		Detail: detail,
          	}
          	d, _ := providerport.ResultDigest(r)
          	r.ResultDigestSHA256 = d
          	_ = json.NewEncoder(os.Stdout).Encode(r)
          }

          func newTestAdapter(t *testing.T, mode string, allow []string) *Adapter {
          	t.Helper()
          	t.Setenv("SENSEI_COMMANDPROVIDER_HELPER", "1")
          	t.Setenv("SENSEI_COMMANDPROVIDER_MODE", mode)
          	a, err := New(Config{
          		ProviderID: "test.command",
          		Command: os.Args[0],
          		Args: []string{"-test.run=TestMain"},
          		EnvironmentAllowlist: append([]string{"SENSEI_COMMANDPROVIDER_HELPER", "SENSEI_COMMANDPROVIDER_MODE"}, allow...),
          		SupportedOperations: []providerport.Operation{providerport.OperationInterpretation},
          		MaxStdoutBytes: 4096,
          		MaxStderrBytes: 4096,
          	})
          	if err != nil { t.Fatal(err) }
          	return a
          }

          func requestFixture(t *testing.T) providerport.Request {
          	t.Helper()
          	r := providerport.Request{
          		SchemaVersion: providerport.RequestSchemaVersion,
          		RequestID: "request.commandprovider.test",
          		Operation: providerport.OperationInterpretation,
          		SessionDigestSHA256: strings.Repeat("1", 64),
          		RepositoryDomain: "github.com/globulario/sensei",
          		BaseRevision: strings.Repeat("2", 40),
          		ParentArtifactDigestSHA256: strings.Repeat("1", 64),
          		DeadlineAt: time.Now().Add(time.Minute).UTC().Format(time.RFC3339),
          		MaxObservationCount: 8,
          		MaxObservationBytes: 4096,
          	}
          	d, err := providerport.RequestDigest(r)
          	if err != nil { t.Fatal(err) }
          	r.RequestDigestSHA256 = d
          	return r
          }

          func TestDescribeIsDeterministicAndDetached(t *testing.T) {
          	a := newTestAdapter(t, "valid", nil)
          	first, err := a.Describe(context.Background())
          	if err != nil { t.Fatal(err) }
          	first.SupportedOperations[0] = providerport.OperationPlanning
          	second, err := a.Describe(context.Background())
          	if err != nil { t.Fatal(err) }
          	if second.SupportedOperations[0] != providerport.OperationInterpretation {
          		t.Fatal("Describe leaked mutable capability state")
          	}
          }

          func TestExecuteClosedProtocol(t *testing.T) {
          	cases := []struct{ mode, contains string }{
          		{"malformed", "decode result"},
          		{"multiple", "trailing"},
          		{"unknown", "unknown field"},
          		{"oversized", "stdout exceeded"},
          	}
          	for _, tc := range cases {
          		t.Run(tc.mode, func(t *testing.T) {
          			a := newTestAdapter(t, tc.mode, nil)
          			r, err := a.Execute(context.Background(), requestFixture(t), &collectingObserver{})
          			if err != nil { t.Fatal(err) }
          			if r.TerminalOutcome != providerport.OutcomeInvalidOutput || !strings.Contains(r.Detail, tc.contains) {
          				t.Fatalf("outcome=%q detail=%q", r.TerminalOutcome, r.Detail)
          			}
          		})
          	}
          }

          func TestStderrIsObservationOnly(t *testing.T) {
          	a := newTestAdapter(t, "stderr", nil)
          	o := &collectingObserver{}
          	r, err := a.Execute(context.Background(), requestFixture(t), o)
          	if err != nil { t.Fatal(err) }
          	if r.TerminalOutcome != providerport.OutcomeUnavailable { t.Fatalf("outcome=%q", r.TerminalOutcome) }
          	if len(o.details) != 1 || o.details[0] != "provider diagnostic" { t.Fatalf("observations=%v", o.details) }
          }

          func TestEnvironmentIsExplicitlyAllowlisted(t *testing.T) {
          	t.Setenv("COMMANDPROVIDER_ALLOWED", "visible")
          	t.Setenv("COMMANDPROVIDER_DENIED", "secret")
          	a := newTestAdapter(t, "env", []string{"COMMANDPROVIDER_ALLOWED"})
          	r, err := a.Execute(context.Background(), requestFixture(t), &collectingObserver{})
          	if err != nil { t.Fatal(err) }
          	if r.Detail != "visible|" { t.Fatalf("detail=%q", r.Detail) }
          }

          func TestUnsupportedOperationIsTypedData(t *testing.T) {
          	a := newTestAdapter(t, "valid", nil)
          	rq := requestFixture(t)
          	rq.Operation = providerport.OperationPlanning
          	d, _ := providerport.RequestDigest(rq)
          	rq.RequestDigestSHA256 = d
          	r, err := a.Execute(context.Background(), rq, &collectingObserver{})
          	if err != nil { t.Fatal(err) }
          	if r.TerminalOutcome != providerport.OutcomeUnsupportedCapability { t.Fatalf("outcome=%q", r.TerminalOutcome) }
          }

          func TestCancellationTerminatesCommand(t *testing.T) {
          	a := newTestAdapter(t, "sleep", nil)
          	ctx, cancel := context.WithTimeout(context.Background(), 100*time.Millisecond)
          	defer cancel()
          	start := time.Now()
          	_, err := a.Execute(ctx, requestFixture(t), &collectingObserver{})
          	if !errors.Is(err, context.DeadlineExceeded) { t.Fatalf("err=%v", err) }
          	if time.Since(start) > 3*time.Second { t.Fatal("cancelled command did not terminate promptly") }
          }

          func TestNewRejectsUnsafeIncompleteConfiguration(t *testing.T) {
          	_, err := New(Config{})
          	if err == nil { t.Fatal("empty configuration must fail") }
          }
          GO

          # Repair platform import and run focused checks.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('golang/architecture/commandprovider/process_unix.go')
          s = p.read_text().replace('"os/exec"\n', '"os"\n\t"os/exec"\n')
          p.write_text(s)
          p = Path('golang/architecture/commandprovider/commandprovider_test.go')
          s = p.read_text().replace('"context"\n', '"context"\n\t"errors"\n')
          p.write_text(s)
          PY

          gofmt -w golang/architecture/commandprovider
          go test ./golang/architecture/commandprovider -count=1
          go test ./golang/architecture/providerport -count=1

          rm -f .github/workflows/o6-command-provider-implement.yml .github/o6-command-provider.scope
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add golang/architecture/commandprovider docs/design/o6-command-provider-implementation.md .github
          git commit -m 'feat(archer): implement command-backed provider adapter (O6)'
          git push origin HEAD:agent/o6-command-provider

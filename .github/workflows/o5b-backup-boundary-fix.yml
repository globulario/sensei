name: O5B backup observation repair

on:
  push:
    branches:
      - archer/o5b-governed-candidate-apply

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[o5b-backup-fix]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: archer/o5b-governed-candidate-apply
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum
      - name: Move backup cleanup before governed change capture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('golang/architecture/candidateapply/apply.go')
          s = p.read_text()
          old = '''\tchanges, patchDigest, err := admission.CaptureChanges(root, req.BaseRevision)
\tif err != nil {
\t\trollback(staged)
\t\treturn Request{}, Receipt{}, fmt.Errorf("candidateapply: capture changes: %w", err)
\t}
\tif err := verifyCapturedChanges(req.ModifyPaths, changes); err != nil {
\t\trollback(staged)
\t\treturn Request{}, Receipt{}, err
\t}
\tfor _, item := range staged {
\t\tif err := os.Remove(item.backup); err != nil {
\t\t\treturn Request{}, Receipt{}, fmt.Errorf("candidateapply: remove backup for %q: %w", item.path, err)
\t\t}
\t\titem.applied = false
\t}
'''
          new = '''\tfor _, item := range staged {
\t\tif err := os.Remove(item.backup); err != nil {
\t\t\trollback(staged)
\t\t\treturn Request{}, Receipt{}, fmt.Errorf("candidateapply: remove backup for %q: %w", item.path, err)
\t\t}
\t\titem.backup = ""
\t}

\tchanges, patchDigest, err := admission.CaptureChanges(root, req.BaseRevision)
\tif err != nil {
\t\trollback(staged)
\t\treturn Request{}, Receipt{}, fmt.Errorf("candidateapply: capture changes: %w", err)
\t}
\tif err := verifyCapturedChanges(req.ModifyPaths, changes); err != nil {
\t\trollback(staged)
\t\treturn Request{}, Receipt{}, err
\t}
\tfor _, item := range staged {
\t\titem.applied = false
\t}
'''
          if old not in s:
              raise SystemExit('capture/cleanup block not found')
          s = s.replace(old, new, 1)
          old_rb = '''func rollback(items []*stagedReplacement) {
\tfor i := len(items) - 1; i >= 0; i-- {
\t\titem := items[i]
\t\tif !item.applied {
\t\t\tcontinue
\t\t}
\t\t_ = os.Remove(item.destination)
\t\t_ = os.Rename(item.backup, item.destination)
\t\titem.applied = false
\t}
}
'''
          new_rb = '''func rollback(items []*stagedReplacement) {
\tfor i := len(items) - 1; i >= 0; i-- {
\t\titem := items[i]
\t\tif !item.applied {
\t\t\tcontinue
\t\t}
\t\t_ = os.Remove(item.destination)
\t\tif item.backup != "" {
\t\t\tif err := os.Rename(item.backup, item.destination); err == nil {
\t\t\t\titem.backup = ""
\t\t\t\titem.applied = false
\t\t\t\tcontinue
\t\t\t}
\t\t}
\t\t_ = restoreManifestEntry(item.destination, item.before)
\t\titem.applied = false
\t}
}

func restoreManifestEntry(destination string, entry runnercomposition.CandidateManifestEntry) error {
\tdir := filepath.Dir(destination)
\ttmp, err := os.CreateTemp(dir, ".sensei-candidateapply-restore-*")
\tif err != nil {
\t\treturn err
\t}
\ttmpName := tmp.Name()
\tdefer os.Remove(tmpName)
\tif _, err := tmp.Write(entry.Content); err != nil {
\t\t_ = tmp.Close()
\t\treturn err
\t}
\tif err := tmp.Sync(); err != nil {
\t\t_ = tmp.Close()
\t\treturn err
\t}
\tif err := tmp.Close(); err != nil {
\t\treturn err
\t}
\tif err := os.Chmod(tmpName, fileMode(entry.Mode)); err != nil {
\t\treturn err
\t}
\t_ = os.Remove(destination)
\treturn os.Rename(tmpName, destination)
}
'''
          if old_rb not in s:
              raise SystemExit('rollback block not found')
          p.write_text(s.replace(old_rb, new_rb, 1))
          PY
          gofmt -w golang/architecture/candidateapply/*.go
          go test ./golang/architecture/candidateapply -count=1
          make import-graph
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/workflows/o5b-backup-boundary-fix.yml
          git rm -f --ignore-unmatch .o5b-backup-repair-trigger
      - name: Publish repaired clean head
        run: |
          git config user.name "sensei-archer-o5b"
          git config user.email "sensei-archer-o5b@users.noreply.github.com"
          git add -A
          git commit -m "fix(archer): hide O5B transaction backups from governance"
          git push origin HEAD:archer/o5b-governed-candidate-apply

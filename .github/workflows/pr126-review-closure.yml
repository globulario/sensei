name: PR 126 review closure

on:
  push:
    branches:
      - agent/governed-evaluator-composition-o4
    paths:
      - .github/workflows/pr126-review-closure.yml

permissions:
  contents: write

jobs:
  repair-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/governed-evaluator-composition-o4
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum
      - name: Apply, format, and prove repair
        shell: bash
        run: |
          set +e
          {
            python scripts/pr126_checkpoint5_review_fix.py
            gofmt -w golang/architecture/evaluatorcomposition/compose.go \
                      golang/architecture/evaluatorcomposition/complete.go \
                      golang/architecture/evaluatorcomposition/complete_test.go
            go test ./golang/architecture/evaluatorcomposition -count=1 -timeout 240s
          } > /tmp/pr126-review-closure.log 2>&1
          status=$?

          git config user.name "sensei-pr126-review"
          git config user.email "sensei-pr126-review@users.noreply.github.com"
          if [ "$status" -ne 0 ]; then
            cp /tmp/pr126-review-closure.log pr126-review-closure-error.log
            git add pr126-review-closure-error.log
            git commit -m "test(synthesis): capture PR 126 closure failure"
            git push origin HEAD:agent/governed-evaluator-composition-o4
            exit "$status"
          fi

          git add golang/architecture/evaluatorcomposition/compose.go \
                  golang/architecture/evaluatorcomposition/complete.go \
                  golang/architecture/evaluatorcomposition/complete_test.go
          git commit -m "fix(synthesis): preserve accepted evaluator bindings on terminal paths"
          git push origin HEAD:agent/governed-evaluator-composition-o4

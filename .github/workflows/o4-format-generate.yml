name: O4 format and generate

on:
  push:
    branches:
      - agent/governed-evaluator-composition-o4
    paths:
      - .github/workflows/o4-format-generate.yml
      - golang/architecture/evaluatorcomposition/*.go

permissions:
  contents: write

jobs:
  format-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/governed-evaluator-composition-o4
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum
      - name: Format and regenerate
        run: |
          gofmt -w golang/architecture/evaluatorcomposition/*.go
          make import-graph
          if git diff --quiet; then
            echo "No mechanical changes required."
            exit 0
          fi
          git config user.name "sensei-o4-maintenance"
          git config user.email "sensei-o4-maintenance@users.noreply.github.com"
          git add golang/architecture/evaluatorcomposition docs/awareness/generated/awareness_graph_go_import_graph.yaml
          git commit -m "chore(synthesis): format O4 and refresh import graph"
          git push origin HEAD:agent/governed-evaluator-composition-o4

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  # Every other gate in this repo runs on Linux, so platform-specific code was
  # only ever compiled by the release job -- i.e. after a tag already existed.
  # That let cmd/awg/lock_windows.go ship calling syscall.LockFile (Linux-only in
  # Go's stdlib, despite compiling fine on Linux where the file is excluded), and
  # it broke the Windows release build twice: before v1.5.0 in
  # graph_publication_lock_windows.go, and again before v1.6.0, where it blocked
  # the tag outright. These jobs compile the non-Linux side on every push instead.
  #
  # The matrix covers every non-Linux platform release.yml ships, on the same
  # runners it uses, so a release can no longer fail on a platform CI never
  # compiled. Linux itself is already covered by build-and-test below.
  # See failure.sensei.platform_specific_source_never_compiled_by_ci.
  platform-compile:
    name: ${{ matrix.platform }} compiles
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      # Never cancel a sibling: if two platforms are broken, one run must report
      # both, or fixing the first just uncovers the second on the next push.
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-latest
          - platform: darwin-arm64
            runner: macos-14

    steps:
      - name: Checkout awareness-graph
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum

      - name: Compile every package for ${{ matrix.platform }}
        # Native runners, not cross-compiles: the tree-sitter parsers are cgo, so
        # GOOS=windows from Linux cannot build them without a mingw toolchain.
        # This mirrors exactly what release.yml does on these same runners.
        run: go build ./...

      - name: Type-check the tests too
        # `go build ./...` never compiles _test.go files. The same syscall.LockFile
        # defect was present in cmd/awg/lock_windows_test.go, and this gate's very
        # first run caught syscall.Mkfifo in two more _test.go files, so a
        # build-only gate would miss half the class. `go vet` type-checks tests.
        run: go vet ./...

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout awareness-graph
        uses: actions/checkout@v4
        with:
          # Full history, for two reasons.
          #
          # The commit-scope guard needs HEAD against its parent, which depth 2
          # gave. But the promotion-gate tests need the ADMITTED BRANCH, and
          # depth 2 never fetched it: on a push event HEAD is the branch tip,
          # not a merge commit, and `origin/main` is absent, so no promotion
          # base could be resolved and FOUR independence tests silently skipped
          # in every CI run. They were not weak; they never executed.
          #
          # That was invisible until the helper was changed to fail rather than
          # skip when it cannot resolve a base. The fix is to remove the cause,
          # not to label the silence: the pack is ~60 MB, so full history costs
          # seconds and buys back the coverage.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum

      # ruleguard must be installed for the positive-control attestation to run.
      #
      # No workflow installed it, so TestRuleguardRulesHavePositiveControl
      # skipped in EVERY CI run -- while its own comment said "CI MUST install
      # it so this attestation actually runs". The rules proving each principle
      # fires on known-bad code were never exercised here, and a rule that
      # cannot load reports zero findings exactly like a clean tree.
      - name: Install ruleguard (positive-control attestation)
        run: GOTOOLCHAIN=go1.25.0 go install github.com/quasilyte/go-ruleguard/cmd/ruleguard@latest

      - name: gofmt is clean
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -vE '\.pb\.go$|/pb/|/testdata/'))
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Corpus is valid and the embedded seed is fresh (self-only build)
        # Standalone build: no services repo. yaml2nt runs -strict / -validate-refs
        # / -validate-promotion / -validate-contradictions, so a broken corpus
        # fails here; --check also fails if the committed seed drifted.
        run: scripts/build-awareness-graph-self.sh --check

      - name: The freshness gate actually rejects drifted committed artifacts
        # POSITIVE CONTROL for the step above, and the only proof that the gate
        # INVOKES its comparison rather than merely containing the call.
        #
        # A Go test can execute check-generated-freshness.sh directly, and does.
        # It cannot establish that the gate calls it: wrapping the invocation in
        # `if false; then ... fi` preserves every token a source scan searches
        # for while the comparison never runs. Review found exactly that, twice,
        # on two successive attempts to prove it from source.
        #
        # So the chain is proven where it actually matters: corrupt a committed
        # load-bearing artifact, run the real gate, require a non-zero exit.
        # The step above proves the gate passes on a clean tree; this one proves
        # it can fail. Neither alone is a check.
        run: |
          set -euo pipefail
          f=docs/awareness/generated/awareness_graph_code_symbols.yaml
          cp "$f" /tmp/committed.bak
          printf '\n# injected drift for the positive control\n' >> "$f"
          if scripts/build-awareness-graph-self.sh --check >/tmp/drift.out 2>&1; then
            cp /tmp/committed.bak "$f"
            echo "::error::the freshness gate PASSED with a drifted committed artifact"
            tail -20 /tmp/drift.out
            exit 1
          fi
          cp /tmp/committed.bak "$f"
          grep -q "STALE" /tmp/drift.out || {
            echo "::error::gate failed but not for the drift it was given"; tail -20 /tmp/drift.out; exit 1; }
          echo "gate correctly rejected a drifted committed artifact"
          git diff --quiet -- "$f" || { echo "::error::control did not restore the tree"; exit 1; }

      - name: Inferred proto contracts are fresh (architectural spine Stage B)
        # contract.* nodes inferred from proto/awareness_graph.proto are generated
        # by cmd/proto-scan and committed. Fails if the committed YAML drifts.
        run: make proto-contracts-check

      - name: Inferred import graphs are fresh (component dependsOn edges)
        # component.* dependsOn edges inferred from Go + TypeScript/JS imports are
        # generated by cmd/import-scan and committed. Fails if the YAML drifts.
        run: make import-graph-check

      - name: No hypothesis is past its horizon unobserved, and no guess became law by sediment
        # globulario/sensei#288, design doc §6. A hypothesis whose horizon
        # passed with nothing recorded against it is OVERDUE -- never
        # "unrefuted", and never SUPPORTED by silence. Without this the overdue
        # count is a number nobody is obliged to look at, and the hypothesis
        # table becomes a filing cabinet that looks like learning.
        #
        # Clearing it means recording an observation, or moving the horizon and
        # saying why. Letting the date pass is not one of the options.
        #
        # The same target also runs `epistemic scope`, which reports code that
        # exists only to test an OPEN hypothesis while canonical architecture
        # has already begun to defend it. Without that, the loop closes on
        # itself: an agent guesses B, implements B, extraction records that B
        # exists, B becomes architecture, and the agent can no longer replace
        # its own guess. Promotion to architecture is an epistemic event, not a
        # side effect of implementation.
        run: make epistemic-check

      - name: Commit scope matches its message (no engine drift in docs-only commits)
        # If HEAD's message claims docs-only scope but the diff touches
        # golang/ cmd/ internal/, that is engine drift. Add [engine-ack] to
        # acknowledge an intentional engine change in an otherwise-docs commit.
        run: scripts/check-commit-scope.sh HEAD

      - name: Onboarding docs claim the real principle count (self-updating)
        # The shipping pack is the source of truth. Any doc stating a TOTAL
        # principle count must state the pack's count. (The former README
        # category-table check was retired when the principle catalog moved to
        # docs/meta-principles.md in the Sensei doc reframing.)
        run: |
          DOCS="README.md QUICKSTART.md INSTALL.md docs/quickstart.md docs/meta-principles.md docs/case-study-cold-start.md docs/blog/awg-introduction.md examples/payment-cold-start/README.md"
          PACK=$(grep -cE '^  - id: meta\.' cmd/awg/templates/awareness/meta_principles.yaml)
          echo "authoritative pack count: ${PACK}"
          PAT='[0-9]+ universal principles|[0-9]+ portable principles|[0-9]+ battle-validated meta-principles|[0-9]+ meta-principles organized|[0-9]+ principles across|grown to [0-9]+ across|all [0-9]+ principles|all [0-9]+ is the generated|categories, [0-9]+ principles|the [0-9]+ meta-principles in'
          bad=$(grep -rhoE "$PAT" $DOCS 2>/dev/null | grep -oE '[0-9]+' | sort -u | grep -vx "${PACK}" || true)
          if [ -n "$bad" ]; then
            echo "::error::docs state principle-count(s) [$bad] but the pack has ${PACK}. Update the headline + category tables."
            grep -rnoE "$PAT" $DOCS 2>/dev/null || true
            exit 1
          fi
          echo "onboarding docs: total principle count matches the pack (${PACK})"

      - name: Run tests
        run: go test ./... -count=1 -timeout 300s

      - name: "Sensei gates its own diff (report-only)"
        # Advisory only: never blocks CI (see --report-only in `sensei gate
        # --help`). This repo has never gated its own PRs before -- this step
        # exists to let real findings accumulate and be seen before any future
        # decision to switch this same diff check to --enforce.
        run: |
          scripts/fetch-oxigraph.sh
          make sensei
          DATA_DIR="$(mktemp -d)"
          MARKER_FILE="$(mktemp)"
          ./bin/sensei serve -no-seed -allow-stale-seed \
            -data "$DATA_DIR" -addr :19120 -oxigraph-bind 127.0.0.1:19878 \
            -graph-marker-file "$MARKER_FILE" \
            > /tmp/sensei-gate-serve.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 3
          ./bin/sensei build --all -store-url "http://127.0.0.1:19878/store?default" -graph-marker-file "$MARKER_FILE"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=200 --quiet
            DIFF_RANGE="origin/${{ github.event.pull_request.base.ref }}...HEAD"
          else
            DIFF_RANGE="HEAD~1...HEAD"
          fi
          echo "diff range: ${DIFF_RANGE}"
          ./bin/sensei gate --diff "${DIFF_RANGE}" --report-only --addr localhost:19120

      - name: "Cold-start smoke (stranger path: init -> serve -no-seed -> build -> briefing)"
        # Fetches the upstream Oxigraph binary, scaffolds a throwaway project in
        # /tmp, and proves the standalone path end to end.
        run: |
          scripts/fetch-oxigraph.sh
          scripts/smoke-cold-start.sh

      - name: "Example smoke: money-scar cold-start proof (examples/orders-money-scar)"
        run: examples/orders-money-scar/run.sh

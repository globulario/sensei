name: Sensei architect activation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: sensei-architect-activation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  activation:
    runs-on: ubuntu-latest
    # Ceilings, not expected cost: a typical run finishes in ~4 minutes. They
    # are sized so a MIGRATION-sized diff still completes, because a ceiling
    # that a large-but-healthy change cannot fit inside does not measure the
    # change — it measures the diff, and reports the difference as a failure.
    timeout-minutes: 20
    steps:
      - name: Checkout exact change head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum

      - name: Build Sensei
        run: make sensei

      - name: Start private governed graph
        shell: bash
        run: |
          set -euo pipefail
          scripts/fetch-oxigraph.sh
          DATA_DIR="$(mktemp -d)"
          MARKER_FILE="$(mktemp)"
          ./bin/sensei serve -no-seed -allow-stale-seed \
            -data "$DATA_DIR" -addr :19120 -oxigraph-bind 127.0.0.1:19878 \
            -graph-marker-file "$MARKER_FILE" \
            -home-domain "github.com/globulario/sensei" \
            > /tmp/sensei-architect-serve.log 2>&1 &
          echo "SENSEI_SERVER_PID=$!" >> "$GITHUB_ENV"
          echo "SENSEI_MARKER_FILE=$MARKER_FILE" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if ./bin/sensei metadata --addr localhost:19120 >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          # REGISTER the governed domain before publishing it.
          #
          # This is operator CONFIGURATION -- repository identity and allowed corpus roots -- and
          # deliberately NOT the ACTIVE generation. recordActiveGeneration refuses to invent an entry
          # ("Not registered: nothing to update, and nothing to invent"), so without this the
          # publication below silently records no pointer. The runner's HOME is ephemeral, so this
          # registry is isolated by construction and no operator state is touched.
          REGISTRY="$HOME/.sensei/domains.yaml"
          mkdir -p "$(dirname "$REGISTRY")"
          cat > "$REGISTRY" <<YAML
          domains:
              github.com/globulario/sensei:
                  repository_identity: globulario/sensei
                  allowed_corpus_roots:
                      - docs/awareness
          YAML
          echo "SENSEI_CI_REGISTRY=$REGISTRY" >> "$GITHUB_ENV"

          # PUBLISH through the canonical owner, naming the governed domain.
          #
          # --repo is the domain-scoped path build itself calls recommended, and it is the ONLY build
          # mode that names a governed domain: publishedDomain reads --repo, while --domain on build is
          # the node tagging KIND (repo|shared), not a domain name. --all cannot name one, which is why
          # it published a graph no reader could verify and left the pointer unset.
          #
          # activateGeneration writes the marker first and only then records the pointer, so the
          # pointer can never name a generation whose marker was never published.
          ./bin/sensei build --repo "github.com/globulario/sensei" \
            -store-url "http://127.0.0.1:19878/store?default" \
            -graph-marker-file "$MARKER_FILE"

      - name: Prove the governed domain has an ACTIVE generation matching the served graph
        shell: bash
        run: |
          set -euo pipefail
          # Activation consumes authoritative preflight output, and since Category C a production
          # reader REFUSES a served generation the registry does not declare ACTIVE. Prove the four
          # preconditions here rather than discovering them as 14 refused files downstream.
          REGISTRY="${SENSEI_CI_REGISTRY:-$HOME/.sensei/domains.yaml}"
          domain="github.com/globulario/sensei"

          # The served generation comes from metadata --json's live_store_graph_digest_sha256, the SAME
          # field the guard compares. The human-readable block does not print it, so parsing prose
          # here would be reading a different thing than the check reads.
          ./bin/sensei metadata --addr localhost:19120 --domain "$domain" --json > /tmp/ci-metadata.json
          ./bin/sensei metadata --addr localhost:19120 --domain "$domain" 2>&1 | sed -n '1,16p' || true

          declared=$(python3 - "$REGISTRY" "$domain" <<'PY'
          import sys, yaml
          reg = yaml.safe_load(open(sys.argv[1])) or {}
          print(((reg.get("domains") or {}).get(sys.argv[2]) or {}).get("active_generation", ""))
          PY
          )
          served=$(python3 -c "import json;print(json.load(open('/tmp/ci-metadata.json')).get('live_store_graph_digest_sha256',''))")
          if [[ -z "$declared" ]]; then
            echo "FAIL: no ACTIVE generation declared for $domain after publication." >&2
            echo "  The canonical owner records it only for a REGISTERED domain; check the registry." >&2
            exit 1
          fi
          if [[ -z "$served" ]]; then
            echo "FAIL: metadata reported no served graph digest." >&2
            exit 1
          fi
          if [[ "$declared" != "$served" ]]; then
            echo "FAIL: declared ACTIVE generation != served generation." >&2
            echo "  declared: $declared" >&2
            echo "  served:   $served" >&2
            exit 1
          fi
          echo "ACTIVE generation established for $domain"
          echo "  declared == served: $declared"

          # And the consumer contract: a verified preflight emits its ordinary payload, classified ok
          # or degraded -- never refused, never malformed -- AND exits zero.
          #
          # BOTH SIGNALS, in both directions. An earlier version of these probes used `|| true` and
          # then read only the verdict, so "not refused" stood in for "succeeded": a nonzero exit
          # beside an otherwise-consumable payload would have passed. That is the same half-signal
          # this family refuses in production, where a refusal must be a typed payload AND a nonzero
          # exit because either alone is ambiguous. Blind review P2 on fa2ddbe6, and it held.
          source scripts/lib/preflight-verdict.sh
          probe_consumable() {
            local label=$1 out rc v
            out=$(mktemp)
            set +e
            ./bin/sensei preflight --task "authority precondition probe" --file cmd/awg/main.go \
              --domain "$domain" --addr localhost:19120 --json >"$out" 2>/dev/null
            rc=$?
            set -e
            v=$(preflight_verdict "$out")
            echo "  $label: exit=$rc verdict=$v"
            if ((rc != 0)); then
              echo "FAIL: $label exited $rc; a consumable answer must succeed, and an exit code is not" >&2
              echo "      redundant with the payload -- that is why a refusal carries both." >&2
              sed -n '1,12p' "$out" >&2
              exit 1
            fi
            case "$v" in
              refused:*|malformed:*)
                echo "FAIL: $label did not produce a consumable payload ($v)." >&2
                sed -n '1,12p' "$out" >&2
                exit 1
                ;;
            esac
          }
          probe_consumable "positive case"

          # AUTHORITY-NEGATIVE CONTROLS.
          #
          # The positive case above proves consumption works. These prove the guard is wired to THIS
          # workflow's canonical publication identity rather than passing for some unrelated reason:
          # perturb the AUTHORITY STATE only -- never production code -- and require a typed refusal.
          #
          # A control that cannot fail proves nothing, so each asserts the verdict, a nonzero exit, and
          # the absence of a consumable payload. The registry is restored from a copy afterwards, and
          # the positive case is re-run to prove the perturbation was reversible.
          cp "$REGISTRY" /tmp/ci-registry.bak
          probe_refusal() {
            local want=$1 label=$2 out rc v
            out=$(mktemp)
            set +e
            ./bin/sensei preflight --task "authority negative control" --file cmd/awg/main.go \
              --domain "$domain" --addr localhost:19120 --json >"$out" 2>/dev/null
            rc=$?
            set -e
            v=$(preflight_verdict "$out")
            echo "  $label: exit=$rc verdict=$v"
            if [[ "$v" != "$want" ]]; then
              echo "FAIL: $label expected $want, got $v" >&2
              sed -n '1,12p' "$out" >&2
              exit 1
            fi
            if ((rc == 0)); then
              echo "FAIL: $label refused but exited 0; a payload with a zero exit reads as success" >&2
              exit 1
            fi
            if python3 -c "import json,sys;d=json.load(open('$out'));sys.exit(0 if 'refusal' in d and not any(k in d for k in ('status','risk_class','coverage')) else 1)"; then
              :
            else
              echo "FAIL: $label emitted something mistakable for a consumable payload" >&2
              exit 1
            fi
          }

          # (1) Remove the ACTIVE declaration the canonical publication just recorded.
          python3 - "$REGISTRY" "$domain" <<'PY'
          import sys, yaml
          reg = yaml.safe_load(open(sys.argv[1])) or {}
          entry = (reg.get("domains") or {}).get(sys.argv[2]) or {}
          entry.pop("active_generation", None)
          reg["domains"][sys.argv[2]] = entry
          yaml.safe_dump(reg, open(sys.argv[1], "w"), sort_keys=False)
          PY
          probe_refusal "refused:served_generation_not_established" "ACTIVE removed"

          # (2) Replace it with a different generation.
          python3 - "$REGISTRY" "$domain" <<'PY'
          import sys, yaml
          reg = yaml.safe_load(open(sys.argv[1])) or {}
          reg["domains"][sys.argv[2]]["active_generation"] = "0" * 64
          yaml.safe_dump(reg, open(sys.argv[1], "w"), sort_keys=False)
          PY
          probe_refusal "refused:served_generation_mismatch" "ACTIVE replaced"

          # Restore, and prove the restoration actually restored: the positive case must pass again, or
          # the controls have left the activation world broken.
          cp /tmp/ci-registry.bak "$REGISTRY"
          probe_consumable "restored"
          echo "authority-negative controls passed, and the authority state was restored"

      - name: Resolve exact diff
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"

            # NO --depth=1 HERE.
            #
            # A shallow fetch brings the base COMMIT without its ancestry, so the
            # three-dot range below has no merge base and git exits 128:
            #
            #   fatal: <base>...<head>: no merge base
            #   activation producer exited 128
            #
            # The job then goes red having produced no activation evidence at all,
            # which reads identically to an architectural rejection while actually
            # being an infrastructure failure. Fetch the base branch with history
            # so the merge base is computable.
            git fetch --no-tags --prune origin \
              "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
            git fetch --no-tags origin "$BASE"

            # Verify the merge base exists BEFORE handing the range to the
            # producer. If it still cannot be computed, say so in one line rather
            # than surfacing a bare exit 128 that looks like a verdict.
            if ! git merge-base "$BASE" "$HEAD" >/dev/null 2>&1; then
              echo "::error::no merge base between base $BASE and head $HEAD after a full-history fetch." \
                   "This is an ancestry/infrastructure failure, NOT an architectural verdict —" \
                   "no activation evidence was produced."
              exit 1
            fi
            echo "SENSEI_DIFF=${BASE}...${HEAD}" >> "$GITHUB_ENV"
          else
            echo "SENSEI_DIFF=HEAD~1...HEAD" >> "$GITHUB_ENV"
          fi

      - name: Run enforce-mode architect activation
        shell: bash
        run: |
          set +e
          timeout --foreground 900s bash scripts/sensei-architect-activation.sh \
            --repo . \
            --sensei ./bin/sensei \
            --addr localhost:19120 \
            --repository-domain github.com/globulario/sensei \
            --graph-domain github.com/globulario/sensei \
            --diff "$SENSEI_DIFF" \
            --mode enforce \
            --full-how-timeout 60 \
            --out sensei-activation
          activation_rc=$?
          set -e

          # The private per-PR graph can honestly report semantic coverage debt
          # for new or changed files while the independent enforce-mode gate
          # still passes. Accept only that bounded state. Missing/malformed
          # preflight evidence, process failures, gate failures, or missing
          # required evidence surfaces remain fatal.
          python3 - "$activation_rc" sensei-activation/activation.json sensei-activation/preflight <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          producer_rc = int(sys.argv[1])
          activation_path = Path(sys.argv[2])
          preflight_dir = Path(sys.argv[3])

          errors = []
          if producer_rc not in (0, 1):
              errors.append(
                  f"activation producer exited {producer_rc}; "
                  "expected 0 or policy-only 1"
              )

          if not activation_path.is_file():
              errors.append(f"missing activation artifact: {activation_path}")
              payload = {}
          else:
              try:
                  payload = json.loads(
                      activation_path.read_text(encoding="utf-8")
                  )
              except Exception as exc:
                  errors.append(f"invalid activation artifact: {exc}")
                  payload = {}

          rows = payload.get("surfaces")
          if not isinstance(rows, list):
              errors.append("activation surfaces are missing or malformed")
              rows = []

          surfaces = {
              row.get("name"): row
              for row in rows
              if isinstance(row, dict)
              and isinstance(row.get("name"), str)
          }

          required = {
              "metadata": "available",
              "gate": "pass",
              "phase10_fixture_how": "available",
              "phase10_fixture_why": "available",
          }
          for name, expected in required.items():
              actual = surfaces.get(name, {}).get("status")
              if actual != expected:
                  errors.append(
                      f"{name}: expected {expected}, "
                      f"got {actual or 'missing'}"
                  )

          preflight = surfaces.get("preflight", {})
          preflight_status = preflight.get("status")
          if preflight_status == "available":
              pass
          elif preflight_status == "degraded":
              changed_files = payload.get("changed_files")
              if not isinstance(changed_files, list):
                  errors.append("changed_files is missing or malformed")
                  changed_files = []

              files = sorted(preflight_dir.glob("*.json"))
              if len(files) != len(changed_files):
                  errors.append(
                      "preflight evidence count mismatch: "
                      f"expected {len(changed_files)}, got {len(files)}"
                  )

              detail = preflight.get("detail", "")
              match = re.search(r"\bfailed_files=(\d+)\b", detail)
              if match is None:
                  errors.append(
                      "degraded preflight detail is missing failed_files count"
                  )
                  expected_degraded = None
              else:
                  expected_degraded = int(match.group(1))

              semantic_degraded = 0
              for path in files:
                  try:
                      data = json.loads(
                          path.read_text(encoding="utf-8")
                      )
                  except Exception as exc:
                      errors.append(
                          f"{path.name}: malformed preflight payload: {exc}"
                      )
                      continue

                  if not isinstance(data, dict):
                      errors.append(
                          f"{path.name}: preflight payload is not an object"
                      )
                      continue

                  status = data.get("status")
                  risk_class = data.get("risk_class")
                  coverage = data.get("coverage")

                  if status == "PREFLIGHT_STATUS_DEGRADED":
                      # Not every DEGRADED payload is the bounded
                      # coverage-debt case this block is meant to
                      # tolerate. golang/server/preflight.go sets
                      # DEGRADED for several distinct reasons, only one
                      # of which is "the graph genuinely has no facts
                      # about this file yet" (the honest thin/no-anchor
                      # case, marked by this exact blind_spots string).
                      # The others -- store unavailable, domain scope
                      # unverified, canonical protection assessment
                      # itself degraded, and a per-file impact query
                      # that errored outright (preflight.go:141-145,
                      # "impact_query_failed_for_<file>:", which can
                      # co-occur with the honest-thin-coverage marker
                      # since the failed file also ends up with zero
                      # anchors) -- are operational/derivation failures
                      # where Preflight never established usable scoped
                      # awareness at all, and must fail this check
                      # rather than be silently counted as ordinary
                      # coverage debt. ("coverage_insufficient:" and the
                      # "[deprecated]"/"[low-confidence]" trust-scoring
                      # cautions are NOT in this list: both represent a
                      # real, non-erroring query that genuinely found
                      # nothing or found only demoted guidance -- the
                      # same bounded debt the honest-thin-coverage
                      # marker itself already describes, not an
                      # operational failure.)
                      spots = data.get("blind_spots")
                      if not isinstance(spots, list):
                          spots = []
                      honest_thin_coverage = any(
                          s == "this is NOT proof of safety — the graph has no facts about this file"
                          for s in spots
                      )
                      known_bad = any(
                          s == "awareness_store_unavailable"
                          or s.startswith("domain_scope_unverified:")
                          or s.startswith("protection_assessment_degraded:")
                          or s.startswith("impact_query_failed_for_")
                          for s in spots
                      )
                      if not honest_thin_coverage or known_bad:
                          errors.append(
                              f"{path.name}: preflight degraded for a "
                              "reason beyond bounded thin/no-anchor "
                              f"coverage debt: {spots}"
                          )
                          continue
                      semantic_degraded += 1
                      continue

                  if status not in (
                      "PREFLIGHT_STATUS_OK",
                      "PREFLIGHT_STATUS_EMPTY",
                  ):
                      errors.append(
                          f"{path.name}: missing or unknown "
                          f"preflight status {status!r}"
                      )
                      continue

                  if risk_class == "UNKNOWN_IMPACT":
                      semantic_degraded += 1
                      continue

                  if not isinstance(coverage, dict):
                      errors.append(
                          f"{path.name}: preflight coverage "
                          "is missing or malformed"
                      )
                      continue

                  if coverage.get("sufficient") is not True:
                      semantic_degraded += 1
                      continue

                  # This payload is healthy. The aggregate preflight
                  # surface is degraded when any changed file is degraded,
                  # so a mixed set of healthy and degraded payloads is valid.

              if semantic_degraded == 0:
                  errors.append(
                      "preflight is marked degraded without any "
                      "semantic coverage finding"
                  )
              if (
                  expected_degraded is not None
                  and semantic_degraded != expected_degraded
              ):
                  errors.append(
                      "preflight degraded count mismatch: "
                      f"summary reports {expected_degraded}, "
                      f"payloads classify {semantic_degraded}"
                  )
          else:
              errors.append(
                  "preflight: expected available or degraded, "
                  f"got {preflight_status or 'missing'}"
              )

          if producer_rc == 1 and preflight_status != "degraded":
              errors.append(
                  "activation producer exited 1 without an accepted "
                  "degraded-preflight condition"
              )

          if errors:
              print(
                  "Sensei activation CI verdict: FAIL",
                  file=sys.stderr,
              )
              for error in errors:
                  print(f"- {error}", file=sys.stderr)
              raise SystemExit(1)

          if preflight_status == "degraded":
              print(
                  "Sensei activation CI verdict: PASS with visible "
                  "semantic preflight debt; the enforce-mode "
                  "architectural gate and required evidence surfaces passed."
              )
          else:
              print("Sensei activation CI verdict: PASS")
          PY

      - name: Publish activation summary
        if: always()
        shell: bash
        run: |
          if [[ -f sensei-activation/summary.md ]]; then
            cat sensei-activation/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sensei activation did not produce a summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sensei-architect-activation
          path: sensei-activation/
          if-no-files-found: warn

      - name: Stop private graph
        if: always()
        shell: bash
        run: |
          if [[ -n "${SENSEI_SERVER_PID:-}" ]]; then
            kill "$SENSEI_SERVER_PID" 2>/dev/null || true
          fi

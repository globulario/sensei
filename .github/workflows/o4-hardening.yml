name: O4 checkpoint-4 hardening

on:
  push:
    branches:
      - agent/governed-evaluator-composition-o4
    paths:
      - .github/workflows/o4-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/governed-evaluator-composition-o4
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum
      - name: Apply and prove hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"{label} not found")
              return text.replace(old, new, 1)

          surface = Path('golang/architecture/evaluatorcomposition/surface.go')
          text = surface.read_text()
          text = replace_once(text,
          '''\tif mode != SurfaceModePlain && mode != SurfaceModeGitDiff {
          \t\treturn nil, fmt.Errorf("CandidateMaterializer.Materialize: unsupported surface mode %q", mode)
          \t}

          \tbaseDir, baseManifest, baseDigest, baseCleanup, err := runnercomposition.ExtractSnapshot(ctx, m.RepositoryRoot, artifact.BaseRevision)
          ''',
          '''\tif mode != SurfaceModePlain && mode != SurfaceModeGitDiff {
          \t\treturn nil, fmt.Errorf("CandidateMaterializer.Materialize: unsupported surface mode %q", mode)
          \t}
          \tif mode == SurfaceModeGitDiff {
          \t\tif err := validateGitControlPaths(artifact.Manifest); err != nil {
          \t\t\treturn nil, fmt.Errorf("CandidateMaterializer.Materialize: %w", err)
          \t\t}
          \t}

          \tbaseDir, baseManifest, baseDigest, baseCleanup, err := runnercomposition.ExtractSnapshot(ctx, m.RepositoryRoot, artifact.BaseRevision)
          ''', 'git control precondition')
          marker = '''func validateManifestFilesystemCollisions(entries []runnercomposition.CandidateManifestEntry) error {
          '''
          helper = '''func validateGitControlPaths(entries []runnercomposition.CandidateManifestEntry) error {
          \tfor _, entry := range entries {
          \t\tfolded := strings.ToLower(entry.Path)
          \t\tif folded == ".git" || strings.HasPrefix(folded, ".git/") {
          \t\t\treturn fmt.Errorf("candidate manifest path %q targets the disposable Git control directory", entry.Path)
          \t\t}
          \t}
          \treturn nil
          }

          '''
          if marker not in text:
              raise SystemExit('manifest collision marker not found')
          text = text.replace(marker, helper + marker, 1)
          old_commit = '''{"-c", "user.name=Sensei O4", "-c", "user.email=sensei-o4@invalid", "-c", "commit.gpgsign=false", "commit", "-q", "--no-gpg-sign", "-m", "sealed base"},'''
          new_commit = '''{"-c", "user.name=Sensei O4", "-c", "user.email=sensei-o4@invalid", "-c", "commit.gpgsign=false", "commit", "-q", "--allow-empty", "--no-gpg-sign", "-m", "sealed base"},'''
          text = replace_once(text, old_commit, new_commit, 'allow-empty base commit')
          surface.write_text(text)

          command = Path('golang/architecture/evaluatorcomposition/command.go')
          text = command.read_text()
          text = replace_once(text,
          '''\t"path/filepath"
          \t"sync"
          ''',
          '''\t"path/filepath"
          \t"sort"
          \t"strings"
          \t"sync"
          ''', 'command imports')
          text = replace_once(text,
          '''\tcapture := newBoundedProcessCapture(maxCapturedBytes)
          \tcmd := exec.CommandContext(ctx, request.Executable, request.Args...)
          \tcmd.Dir = request.Dir
          \tcmd.Env = append([]string(nil), request.Env...)
          \tcmd.Stdout = capture.stdoutWriter()
          \tcmd.Stderr = capture.stderrWriter()
          \terr := cmd.Run()
          \tstdout, stderr, truncated := capture.snapshot()
          ''',
          '''\tstdoutCapture := newBoundedStreamCapture(maxCapturedBytes)
          \tstderrCapture := newBoundedStreamCapture(maxCapturedBytes)
          \tcmd := exec.CommandContext(ctx, request.Executable, request.Args...)
          \tcmd.Dir = request.Dir
          \tcmd.Env = append([]string(nil), request.Env...)
          \tcmd.Stdout = stdoutCapture
          \tcmd.Stderr = stderrCapture
          \terr := cmd.Run()
          \tstdoutFull, stdoutStreamTruncated := stdoutCapture.snapshot()
          \tstderrFull, stderrStreamTruncated := stderrCapture.snapshot()
          \tstdout, stderr, budgetTruncated := trimCapturedOutput(stdoutFull, stderrFull, maxCapturedBytes)
          \ttruncated := stdoutStreamTruncated || stderrStreamTruncated || budgetTruncated
          ''', 'deterministic command capture')
          start = text.index('type boundedProcessCapture struct {')
          end = text.index('// EvidenceSink persists captured evidence')
          replacement = '''type boundedStreamCapture struct {
          \tmu        sync.Mutex
          \tlimit     int64
          \tbuffer    bytes.Buffer
          \ttruncated bool
          }

          func newBoundedStreamCapture(limit int64) *boundedStreamCapture {
          \treturn &boundedStreamCapture{limit: limit}
          }

          func (c *boundedStreamCapture) Write(p []byte) (int, error) {
          \tc.mu.Lock()
          \tdefer c.mu.Unlock()
          \taccepted := len(p)
          \tremaining := c.limit - int64(c.buffer.Len())
          \tif remaining < 0 {
          \t\tremaining = 0
          \t}
          \twriteN := int64(len(p))
          \tif writeN > remaining {
          \t\twriteN = remaining
          \t\tc.truncated = true
          \t}
          \tif writeN > 0 {
          \t\t_, _ = c.buffer.Write(p[:writeN])
          \t}
          \tif writeN < int64(len(p)) {
          \t\tc.truncated = true
          \t}
          \treturn accepted, nil
          }

          func (c *boundedStreamCapture) snapshot() ([]byte, bool) {
          \tc.mu.Lock()
          \tdefer c.mu.Unlock()
          \treturn append([]byte(nil), c.buffer.Bytes()...), c.truncated
          }

          // trimCapturedOutput applies the shared evidence budget deterministically:
          // stdout is retained first because structured machine evidence such as
          // Sensei gate JSON is emitted there; stderr receives the remaining bytes.
          func trimCapturedOutput(stdoutFull, stderrFull []byte, limit int64) (stdout, stderr []byte, truncated bool) {
          \tstdoutN := int64(len(stdoutFull))
          \tif stdoutN > limit {
          \t\tstdoutN = limit
          \t\ttruncated = true
          \t}
          \tstdout = append([]byte(nil), stdoutFull[:stdoutN]...)
          \tremaining := limit - stdoutN
          \tstderrN := int64(len(stderrFull))
          \tif stderrN > remaining {
          \t\tstderrN = remaining
          \t\ttruncated = true
          \t}
          \tstderr = append([]byte(nil), stderrFull[:stderrN]...)
          \treturn stdout, stderr, truncated
          }

          // environmentKeys returns a stable, secret-free description of an exact
          // process environment. Evidence records names only; values still reach the
          // subprocess but are never persisted in O4 evidence.
          func environmentKeys(environment []string) ([]string, error) {
          \tseen := make(map[string]bool, len(environment))
          \tkeys := make([]string, 0, len(environment))
          \tfor i, item := range environment {
          \t\tkey, _, ok := strings.Cut(item, "=")
          \t\tif !ok || strings.TrimSpace(key) == "" {
          \t\t\treturn nil, fmt.Errorf("environment[%d] must be KEY=value with a non-empty key", i)
          \t\t}
          \t\tif seen[key] {
          \t\t\treturn nil, fmt.Errorf("environment key %q appears more than once", key)
          \t\t}
          \t\tseen[key] = true
          \t\tkeys = append(keys, key)
          \t}
          \tsort.Strings(keys)
          \treturn keys, nil
          }

          '''
          text = text[:start] + replacement + text[end:]
          command.write_text(text)

          mechanical = Path('golang/architecture/evaluatorcomposition/mechanical.go')
          text = mechanical.read_text()
          text = replace_once(text,
          '''\t\tcommand.Args = append([]string(nil), command.Args...)
          \t\tcommand.Env = append([]string(nil), command.Env...)
          ''',
          '''\t\tif _, err := environmentKeys(command.Env); err != nil {
          \t\t\treturn nil, fmt.Errorf("NewMechanicalEvaluator: command %q environment: %w", command.CheckID, err)
          \t\t}
          \t\tcommand.Args = append([]string(nil), command.Args...)
          \t\tcommand.Env = append([]string(nil), command.Env...)
          ''', 'mechanical env validation')
          text = replace_once(text,
          '''\tEnv               []string       `json:"env"`
          ''',
          '''\tEnvironmentKeys   []string       `json:"environment_keys"`
          ''', 'mechanical evidence env field')
          text = replace_once(text,
          '''\t\tresult, runErr := e.runner.Run(runCtx, CommandRequest{
          ''',
          '''\t\tenvKeys, envErr := environmentKeys(command.Env)
          \t\tif envErr != nil {
          \t\t\treturn EvaluatorResult{}, fmt.Errorf("MechanicalEvaluator.Evaluate: check %q environment: %w", command.CheckID, envErr)
          \t\t}
          \t\tresult, runErr := e.runner.Run(runCtx, CommandRequest{
          ''', 'mechanical evidence env keys')
          text = replace_once(text,
          '''\t\t\tCheckID: command.CheckID, Executable: command.Executable,
          \t\t\tArgs: append([]string(nil), command.Args...), Env: append([]string(nil), command.Env...),
          ''',
          '''\t\t\tCheckID: command.CheckID, Executable: command.Executable,
          \t\t\tArgs: append([]string(nil), command.Args...), EnvironmentKeys: envKeys,
          ''', 'mechanical evidence append')
          text = replace_once(text, 'reference, err := e.sink.Put(ctx, bundleBytes)', 'reference, err := e.sink.Put(runCtx, bundleBytes)', 'mechanical evidence deadline context')
          mechanical.write_text(text)

          gate = Path('golang/architecture/evaluatorcomposition/sensei_gate.go')
          text = gate.read_text()
          text = replace_once(text,
          '''\tconfig.Environment = append([]string(nil), config.Environment...)
          \tif config.TotalTimeout <= 0 {
          ''',
          '''\tif _, err := environmentKeys(config.Environment); err != nil {
          \t\treturn nil, fmt.Errorf("NewSenseiGateEvaluator: environment: %w", err)
          \t}
          \tconfig.Environment = append([]string(nil), config.Environment...)
          \tif config.TotalTimeout <= 0 {
          ''', 'gate env validation')
          text = replace_once(text,
          '''\tEnvironment   []string        `json:"environment"`
          ''',
          '''\tEnvironmentKeys []string        `json:"environment_keys"`
          ''', 'gate evidence env field')
          text = replace_once(text,
          '''\tevidence := senseiGateEvidence{
          ''',
          '''\tenvKeys, err := environmentKeys(e.config.Environment)
          \tif err != nil {
          \t\treturn EvaluatorResult{}, fmt.Errorf("SenseiGateEvaluator.Evaluate: environment: %w", err)
          \t}
          \tevidence := senseiGateEvidence{
          ''', 'gate evidence env keys')
          text = replace_once(text,
          '''\t\tEnvironment:   append([]string(nil), e.config.Environment...),
          ''',
          '''\t\tEnvironmentKeys: envKeys,
          ''', 'gate evidence env append')
          gate.write_text(text)

          command_test = Path('golang/architecture/evaluatorcomposition/command_test.go')
          text = command_test.read_text()
          text = replace_once(text,
          '''\tif len(emit.Stdout)+len(emit.Stderr) != 12 {
          \t\tt.Fatalf("captured bytes = %d, want exactly 12", len(emit.Stdout)+len(emit.Stderr))
          \t}
          ''',
          '''\tif len(emit.Stdout)+len(emit.Stderr) != 12 {
          \t\tt.Fatalf("captured bytes = %d, want exactly 12", len(emit.Stdout)+len(emit.Stderr))
          \t}
          \tif string(emit.Stdout) != "abcdefghij" || string(emit.Stderr) != "AB" {
          \t\tt.Fatalf("deterministic capture = stdout %q stderr %q, want full stdout then stderr remainder", emit.Stdout, emit.Stderr)
          \t}
          ''', 'deterministic capture assertion')
          command_test.write_text(text)

          adapters = Path('golang/architecture/evaluatorcomposition/adapters_test.go')
          text = adapters.read_text()
          text = text.replace('Env: []string{"LANG=C"}', 'Env: []string{"LANG=C", "TOKEN=super-secret"}')
          text = replace_once(text,
          '''\t\tif len(request.Env) != 1 || request.Env[0] != "LANG=C" {
          \t\t\tt.Fatalf("mechanical command inherited or changed environment: %v", request.Env)
          \t\t}
          ''',
          '''\t\tif len(request.Env) != 2 || request.Env[0] != "LANG=C" || request.Env[1] != "TOKEN=super-secret" {
          \t\t\tt.Fatalf("mechanical command inherited or changed environment: %v", request.Env)
          \t\t}
          ''', 'mechanical process environment assertion')
          marker = '''\tif len(runner.requests) != 2 {
          \t\tt.Fatalf("command requests = %d, want 2", len(runner.requests))
          \t}
          '''
          evidence_assert = '''\tif len(result.EvidenceReferences) != 1 {
          \t\tt.Fatal("mechanical result did not bind its evidence bundle")
          \t}
          \tevidenceBytes, ok := sink.Get(result.EvidenceReferences[0].DigestSHA256)
          \tif !ok {
          \t\tt.Fatal("mechanical evidence bundle missing from sink")
          \t}
          \tif strings.Contains(string(evidenceBytes), "super-secret") || !strings.Contains(string(evidenceBytes), "TOKEN") {
          \t\tt.Fatalf("mechanical evidence leaked environment values or omitted keys: %s", evidenceBytes)
          \t}
          ''' + marker
          text = replace_once(text, marker, evidence_assert, 'mechanical evidence redaction assertion')
          adapters.write_text(text)

          surface_test = Path('golang/architecture/evaluatorcomposition/surface_test.go')
          text = surface_test.read_text()
          insert = '''
          func TestCandidateMaterializerGitDiffRejectsCandidateGitControlPaths(t *testing.T) {
          \tartifact, _, _, repoRoot := checkpoint4Fixture(t)
          \tmaterializer, err := NewCandidateMaterializer(artifact.RepositoryDomain, repoRoot)
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tfor _, candidatePath := range []string{".git/config", ".GIT/hooks/pre-commit"} {
          \t\tt.Run(candidatePath, func(t *testing.T) {
          \t\t\ttampered := artifact
          \t\t\tcontent := []byte("candidate-controlled Git configuration\\n")
          \t\t\tsum := sha256.Sum256(content)
          \t\t\ttampered.Manifest = append(tampered.Manifest, runnercomposition.CandidateManifestEntry{
          \t\t\t\tPath: candidatePath, Mode: runnercomposition.ModeRegular,
          \t\t\t\tContent: content, SymlinkTarget: "", ContentDigestSHA256: hex.EncodeToString(sum[:]),
          \t\t\t})
          \t\t\tfinalDigest, err := runnercomposition.ManifestDigest(tampered.Manifest)
          \t\t\tif err != nil {
          \t\t\t\tt.Fatal(err)
          \t\t\t}
          \t\t\ttampered.FinalCandidateContentDigestSHA256 = finalDigest
          \t\t\ttampered = finishSurfaceArtifact(t, tampered)
          \t\t\tif _, err := materializer.Materialize(context.Background(), tampered, "sensei-gate", SurfaceModeGitDiff); err == nil || !strings.Contains(err.Error(), "Git control directory") {
          \t\t\t\tt.Fatalf("candidate Git control path rejection = %v", err)
          \t\t\t}
          \t\t})
          \t}
          }

          func TestInitializeDisposableGitBaseAllowsEmptySnapshot(t *testing.T) {
          \trepoRoot := t.TempDir()
          \tparent := t.TempDir()
          \tif err := initializeDisposableGitBase(context.Background(), repoRoot, parent); err != nil {
          \t\tt.Fatal(err)
          \t}
          \tcmd := exec.Command("git", "-C", repoRoot, "rev-parse", "--verify", "HEAD")
          \tif out, err := cmd.CombinedOutput(); err != nil {
          \t\tt.Fatalf("empty disposable base has no commit: %v: %s", err, out)
          \t}
          }
          '''
          finish_marker = '''func finishSurfaceArtifact(t *testing.T, artifact runnercomposition.CandidateArtifact) runnercomposition.CandidateArtifact {
          '''
          if finish_marker not in text:
              raise SystemExit('surface test finish marker not found')
          text = text.replace(finish_marker, insert + '\n' + finish_marker, 1)
          surface_test.write_text(text)
          PY
          gofmt -w golang/architecture/evaluatorcomposition/surface.go golang/architecture/evaluatorcomposition/command.go golang/architecture/evaluatorcomposition/mechanical.go golang/architecture/evaluatorcomposition/sensei_gate.go golang/architecture/evaluatorcomposition/command_test.go golang/architecture/evaluatorcomposition/adapters_test.go golang/architecture/evaluatorcomposition/surface_test.go
          go test ./golang/architecture/evaluatorcomposition -count=1 -timeout 120s
          make import-graph-check
          git config user.name "sensei-o4-maintenance"
          git config user.email "sensei-o4-maintenance@users.noreply.github.com"
          git add golang/architecture/evaluatorcomposition
          git commit -m "fix(synthesis): close evaluator control and evidence leaks"
          git push origin HEAD:agent/governed-evaluator-composition-o4

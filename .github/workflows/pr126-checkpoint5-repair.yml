name: PR 126 checkpoint 5 repair

on:
  push:
    branches:
      - agent/governed-evaluator-composition-o4
    paths:
      - .github/workflows/pr126-checkpoint5-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/governed-evaluator-composition-o4
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go.sum
      - name: Apply and verify checkpoint 5 repair
        shell: bash
        run: |
          set +e
          {
            python scripts/pr126_checkpoint5_repair.py
            gofmt -w \
              golang/architecture/evaluatorcomposition/compose.go \
              golang/architecture/evaluatorcomposition/complete.go \
              golang/architecture/evaluatorcomposition/compose_proof_test.go \
              golang/architecture/evaluatorcomposition/compose_test.go
            go test ./golang/architecture/evaluatorcomposition -count=1 -timeout 240s
          } > /tmp/pr126-checkpoint5-repair.log 2>&1
          status=$?

          git config user.name "sensei-pr126-repair"
          git config user.email "sensei-pr126-repair@users.noreply.github.com"
          if [ "$status" -ne 0 ]; then
            cp /tmp/pr126-checkpoint5-repair.log pr126-checkpoint5-repair-error.log
            git add pr126-checkpoint5-repair-error.log
            git commit -m "test(synthesis): capture checkpoint-5 repair failure"
            git push origin HEAD:agent/governed-evaluator-composition-o4
            exit "$status"
          fi

          git add golang/architecture/evaluatorcomposition
          git commit -m "fix(synthesis): close checkpoint-5 composition evidence gaps"
          git push origin HEAD:agent/governed-evaluator-composition-o4
